ht="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!fSsM!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa7f96a67-1966-4b55-9a6d-3a4bf0de6252_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!fSsM!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa7f96a67-1966-4b55-9a6d-3a4bf0de6252_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!fSsM!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa7f96a67-1966-4b55-9a6d-3a4bf0de6252_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!fSsM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa7f96a67-1966-4b55-9a6d-3a4bf0de6252_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Honestly, fuck ESPN. </p><p>Grantland was APEX MOUNTAIN for sports and culture.</p><p>And ESPN killed it. </p><p><em><strong>For what?</strong></em></p><ul><li><p>Spite over Simmons leaving?</p></li><li><p>To clear budget to overpay Stephen A.?</p></li><li><p>To make America dumb again with Pat?</p></li></ul><p><strong>Disgusting man. I hope those @ ESPN – the execs, probably Disney ppl – are NOT having fun anymore.</strong></p><p>Anyways. </p><p>This is an ode to the OG Ringer. To the online that I grew up with. To Shea Serrano. To sports AND entertainment. And too much Russell Westbrook. And too few Oral Histories. To when Simmons’ fingers worked. And when Lowe made THE leap.</p><p>To Grantland.*</p><blockquote><p>* God how I miss their footnotes.</p></blockquote><h6>And this is the second edition of Kurate, a blog about blogs. My little internet museum. Let’s gooooooo.,.. !!! ??</h6><div><hr></div><h2><strong>KURATE #2 – GRANTLAND (2011-2015)</strong></h2><p>This is an essay about Bill Simmons and the most impactful website in all of sports: <a href="https://grantland.com/" target="_blank" rel="noopener noreferrer">Grantland</a>.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!atey!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!atey!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 424w, https://substackcdn.com/image/fetch/$s_!atey!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 848w, https://substackcdn.com/image/fetch/$s_!atey!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 1272w, https://substackcdn.com/image/fetch/$s_!atey!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!atey!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png" width="1456" height="653" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!atey!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 424w, https://substackcdn.com/image/fetch/$s_!atey!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 848w, https://substackcdn.com/image/fetch/$s_!atey!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 1272w, https://substackcdn.com/image/fetch/$s_!atey!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9ce6bab0-3092-4825-b740-e5f8b9d46091_2048x918.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Grantland was an offshoot of ESPN, created by Bill Simmons in 2011 that ran through 2015.</p><p>Grantland took the blog and made it high art – if an article about Russell Westbrook could dream of an afterlife, its dream of heaven would look like Grantland.</p><p>Newspaper font, embedded footnotes, graphic design at least a decade ahead of its time, and a roster of writers that could not be replicated again.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!Gaba!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Gaba!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 424w, https://substackcdn.com/image/fetch/$s_!Gaba!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 848w, https://substackcdn.com/image/fetch/$s_!Gaba!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 1272w, https://substackcdn.com/image/fetch/$s_!Gaba!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Gaba!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png" width="1456" height="1324" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Gaba!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 424w, https://substackcdn.com/image/fetch/$s_!Gaba!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 848w, https://substackcdn.com/image/fetch/$s_!Gaba!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 1272w, https://substackcdn.com/image/fetch/$s_!Gaba!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc95312a9-36be-41fb-b0d1-568d5e398dca_1656x1506.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Named after iconic columnist <a href="https://www.britannica.com/biography/Grantland-Rice" target="_blank" rel="noopener noreferrer">Grantland Rice</a>, the site was an ode to sport, an ode to culture, an ode to style, an ode to writing, an ode to forgotten stories and any topic even tangentially related to ball, film, art, or pop culture.</p><p>It was the place to read up on <a href="https://grantland.com/features/duran-duran-paper-gods-comeback/" target="_blank" rel="noopener noreferrer">Duran Duran</a>, to laugh while learning about the history of <a href="https://grantland.com/features/an-oral-history-ron-shelton-basketball-comedy-white-men-jump" target="_blank" rel="noopener noreferrer">White Men Can’t Jump</a>, and, of course, debate the <a href="https://grantland.com/nba-trade-value/" target="_blank" rel="noopener noreferrer">trade value</a> of NBA Players.</p><h2><em><strong>A Brief History of Bill Simmons</strong></em></h2><p>Grantland’s architecture should come as no surprise as the creator of Grantland, <a href="https://en.wikipedia.org/wiki/Bill_Simmons" target="_blank" rel="noopener noreferrer">Bill Simmons</a>, has been on the forefront of storytelling around sports, film, and culture since he came onto the scene as the Boston Sports Guy.</p><p>Simmons’ speciality is manipulating new forms of media – blog, podcast, documentary – into something that feels comfortable, despite it being shown through foreign new technology.</p><p>A quick look at the legendary BS run from the late 90s to now:</p><ul><li><p><em><strong>Blog</strong></em>: His sports column on <a href="https://www.espn.com/espn/page2/story?page=simmons/subject/archive" target="_blank" rel="noopener noreferrer">Page 2</a> was the first to embrace the digital space of a blog and pushed <a href="http://espn.com" target="_blank" rel="noopener noreferrer">ESPN.com</a> to the forefront of thought leadership for sports, but his writing was simple, analogy-driven, personal. You probably cannot recreate the freedom he had to weave together Larry Bird as basketball Jesus, Mike Tyson’s Pigeon Coop, Advice for the Lovelorn, and an Oscar’s Diary all in the year of 2003.</p></li><li><p><em><strong>Books</strong></em>: author of the single greatest love letter to hoops, The Book of Basketball. He didn’t reinvent form here, but did just create a masterpiece, sooo I’ll give it to him. Best sports book of all time.</p></li><li><p><em><strong>Podcast</strong></em>: The man practically invented the sports podcast, imbuing the new form of show-creation with the best of radio (long rambles, recurring personalities, funny takes) and the best of long-form writing (historical takes, fantastic interviews, timely, research-driven shows). Early <a href="https://www.theringer.com/podcasts/the-bill-simmons-podcast" target="_blank" rel="noopener noreferrer">Bill Simmons Podcast</a> episodes gave me the same feeling as opening a Sports Illustrated magazine. Today he’s more culture and movie oriented, but a master of the 2-hour show, three times a week.</p></li><li><p><em><strong>Documentary</strong></em>: he invented <a href="https://en.wikipedia.org/wiki/30_for_30" target="_blank" rel="noopener noreferrer">30 for 30</a>, pushing forward the docu-drama, giving the world the Fab 5 and many other documentaries, which reached its apex in the COVID-covering launch of the Last Dance. He brought the feeling of SportsCenter Top 10 into an hour-long sports binge – my favorites are Bo Knows and Pony Express – that were new types of films, driven into the decades-old setting of ESPN programming, while also perfect fits for the introduction of binge watching that Netflix and other streamers normalized at the same time.</p></li><li><p><em><strong>Media company</strong></em>: These days Bill heads up Grantland’s successor, <a href="https://www.theringer.com/" target="_blank" rel="noopener noreferrer">The Ringer</a>, transforming the business model for a media company from the written word to a podcast hub. And now maybe transitioning to a Substack funnel (perhaps recreating what made him famous in the first place).</p></li></ul><p>The one thing he didn’t hit was TV, but that’s ok. It’s a 90/10 tradeoff anyone can handle – like how LeBron’s inability to consistently hit 3s doesn’t hurt his 2nd place GOAT case.</p><p><strong>But hell, nobody can embed sports references into movie critiques, or movie references into sports analysis, or Jayson Tatum’s age better than BS.</strong></p><h2><em><strong>But back to Grantland.</strong></em></h2><p>While destined for a short life for various reasons (Bill’s acrimonious ESPN relationship, death of longform reader interest, an unsustainable talent budget, an ESPN that was moving away from early 2000s bets (like the <a href="https://en.wikipedia.org/wiki/Mobile_ESPN" target="_blank" rel="noopener noreferrer">sportsphone</a>) into today’s clickbait, star-driven (not talent-driven) circus), Grantland was THE culture website for a long while, taking blogs and the writers that penned them to new, unexplored heights.</p><p><em><strong>Grantland was no doubt the Apex Mountain for sport and culture.</strong></em></p><p>But that sells the website short – because I think…</p><h2><em><strong>Grantland’s legacy was actually its writing hub.</strong></em></h2><p>Sports and words and sport and film, Grantland covered it all, slicing Bill’s personality and hiring people who could take these topics to new heights. </p><p>I will remember Grantland most as a talent hub for culture writers. </p><p>Grantland gave Kirk Goldsberry and Zach Lowe and Shea Serrano their big-time starts. And it also housed other wonderful talents like Bryan Curtis, Katie Baker, Andrew Sharp, Jonathan Abrams, Bill Barnwell, Jason Gallagher and Concepcion, Andy Greenwald, Robert Mays, Rembert Browne. Gah, not to mention David Jacoby and Mallory Rubin – there are so many careers that Grantland launched that I’m probably still doing it a disservice. </p><p>Together, these people changed...</p><ol><li><p>how sports were reported</p></li><li><p>how media/culture is remembered</p></li><li><p>how up-and-coming writers can really create unique styles and monetize themselves (through podcasts, book deals, etc)</p></li><li><p>how movies are ranked and talked about </p></li></ol><p>Without these names and styles and love for longform, we’re just left with the mainstream dregs of the hot take – McAfee, Bayless, Smith, Cowherd, Russillo. And ofc the Barstools and such.</p><p>Oh Grantland — place that bet big on in-depth content. From longform writing to podcasts. It was an investment in style when everyone else has gone towards slop. </p><h2><em><strong>Grantland Reading Recommendations</strong></em></h2><p>So this is Kurate, a blog about blogs that recommends a few links for you to click today. </p><p>I am BEGGING you to go back and read the beautiful words from the Grantland cabal. Go remember how the internet used to feel.</p><p>Ofc, you should start and go through all the <a href="https://grantland.com/tags/oral-history/" target="_blank" rel="noopener noreferrer">Oral Histories</a> and all the <a href="https://grantland.com/features/" target="_blank" rel="noopener noreferrer">features</a>. </p><p>They’re a delight. You can lose a weekend there.</p><p>But I also pitched Grantland as a legacy of the writers room. </p><p>So I’ll walk you through a few examples of people I used to love reading (Kirk G, Zach L, Shea S). </p><ul><li><p><a href="https://grantland.com/contributors/kirk-goldsberry/" target="_blank" rel="noopener noreferrer">Kirk Goldsberry</a> – a professor at the University of Texas now, I know Kirk for bringing visuals to the art of the blog, to the world of analytics.</p></li></ul><blockquote><p>Kirk would create a visual worth 10,000 words and then explain it in 1,000. His was a rise in lockstep with the three-point revolution – Morey Ball – and he specialized in making it obvious that 3s were better than 2s and that Michael Carter Williams did not deserve his Rookie of the Year and that James Harden was an isolation god.</p><p>While his prose is nothing to write home about, the way Kirk tells a story in a single image is what Grantland was all about (especially in how they created a gorgeous website for mobile all the way back in 2015, which was a crazy, beautiful experience).</p><p>In terms of graphics, I would say Kirk is to sports blogging what Tim Urban is to tech blogging.</p><p><em><strong>I also think that sports reporting, offense design, and roster construction were genuinely changed by Kirk</strong></em>.</p><p>His imagery was so powerful that he definitely helped accelerate the death of the midrange jump shot and made super clear the power of floor spacers like Steph Curry, to the point that Steph will maybe be remembered as the defining player of the 2010s, during the peak of LeBron’s power.</p><p>It’s no surprise that when Grantland shut down, the Spurs hired him as their VP of Strategic Research in 2016.</p></blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!Lnc6!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Lnc6!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 424w, https://substackcdn.com/image/fetch/$s_!Lnc6!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 848w, https://substackcdn.com/image/fetch/$s_!Lnc6!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 1272w, https://substackcdn.com/image/fetch/$s_!Lnc6!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Lnc6!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png" width="1252" height="1048" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Lnc6!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 424w, https://substackcdn.com/image/fetch/$s_!Lnc6!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 848w, https://substackcdn.com/image/fetch/$s_!Lnc6!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 1272w, https://substackcdn.com/image/fetch/$s_!Lnc6!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9a88cc7e-66bb-460e-a7e7-60d937a776a8_1252x1048.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ul><li><p>Zach Lowe – a direct apostle of Bill, Zach is a wordsmith who specializes in listicles, in longform. “<a href="https://grantland.com/the-triangle/the-annual-nba-league-pass-rankings-part-1-2/" target="_blank" rel="noopener noreferrer">Annual League Pass Rankings</a>” was a must-read for me when I was in high school.</p></li></ul><blockquote><p>Bill’s draft diaries and trade value columns will always be dear to my heart, but Zach’s fastball was almost as good, a Clemens to Bill’s Ryan, when ranking mascots and jersey combinations and League Pass play style and, of course, the home announcers. He can also pod, but in a beautiful game way: you have to love pick-and-roll coverages.</p><p>If you were to branch off Zach’s writing tree, Ben Solak and Kevin O’Connor come to mind: nerds that can explain the game. He has a bit of Sports Illustrated in him and is spiritually aligned with Peter King’s “<a href="https://www.nbcsports.com/nfl/profootballtalk/fmia/news/nfl-peter-king-mailbag-fmia-finale-onward" target="_blank" rel="noopener noreferrer">10 Things I Think I Think</a>” writing style.</p><p>Below I’m leaving a classic Zach paragraph that combines Tiago Splitter’s spacing issues with the new court design for the Hawks: a masterpiece that I hope never leaves the internet. <a href="https://zachlowe.substack.com/p/welcome-to-the-lowe-post" target="_blank" rel="noopener noreferrer">Super glad that he’s back on substack now.</a></p></blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!VHuG!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!VHuG!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 424w, https://substackcdn.com/image/fetch/$s_!VHuG!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 848w, https://substackcdn.com/image/fetch/$s_!VHuG!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 1272w, https://substackcdn.com/image/fetch/$s_!VHuG!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!VHuG!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png" width="1136" height="1112" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!VHuG!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 424w, https://substackcdn.com/image/fetch/$s_!VHuG!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 848w, https://substackcdn.com/image/fetch/$s_!VHuG!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 1272w, https://substackcdn.com/image/fetch/$s_!VHuG!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F448cde82-cbc8-40e6-a518-4d77ea704e90_1136x1112.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ul><li><p><a href="https://grantland.com/contributors/shea-serrano/" target="_blank" rel="noopener noreferrer">Shea Serrano</a> – his lane is music and movies, his lane is the San Antonio Spurs, his lane is family man, his lane is article topics that feel personal yet still find a massive audience.</p></li></ul><blockquote><p>His sentences leap off the page in that they are dancing, and if your eyes aren’t moving quick enough, you will miss the joke.</p><p>Shea really can’t be pinned down, but I recommend clicking at least 10 of his old essays. I mean, look at the September 2015 run from Shea in screenshot below.</p><p>Fucking iconic.</p><p>Shea took Grantland and made it weird, then left and got weirder – if Zach took Bill’s writing and Bill’s podcasting, then Shea took the zaniness and the hot takes and the everydaysmen attitude and ran with it.</p><p>Shea’s branch of writing has an obvious adherent in The Ringer’s <a href="https://www.theringer.com/creator/tyler-parker" target="_blank" rel="noopener noreferrer">Tyler Parker</a>: just swap out Spurs fandom for Thunder fandom and switch up a penchant for odd essay topics (Shea) for odd prose decisions (Tyler).</p></blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!xlXJ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!xlXJ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 424w, https://substackcdn.com/image/fetch/$s_!xlXJ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 848w, https://substackcdn.com/image/fetch/$s_!xlXJ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 1272w, https://substackcdn.com/image/fetch/$s_!xlXJ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!xlXJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png" width="1422" height="1450" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!xlXJ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 424w, https://substackcdn.com/image/fetch/$s_!xlXJ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 848w, https://substackcdn.com/image/fetch/$s_!xlXJ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 1272w, https://substackcdn.com/image/fetch/$s_!xlXJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fedaf7350-0b8e-44d6-8b9b-36a56ade5638_1422x1450.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2>On the Legacy of Grantland: The Simmons Writing Tree Is Unmatched</h2><p>The thing with <a href="https://grantland.com/" target="_blank" rel="noopener noreferrer">Grantland</a>, for me, was not its content repository (which is a delight), but really how it acted as a launchpad for so many different writers.</p><p>It’s really a story about the Bill Simmons writing tree and interest tree, Grantland is.</p><p>There are many, many trees planted in the world that branch in many, many ways. </p><p>For example…</p><ul><li><p>The words of Tim Ferris, David Remnick, and Eric Schlosser are styled after lessons from Princeton professor John McPhee.</p></li></ul><ul><li><p>The playcalls of Andy Reid, Mike Shanahan, and Mike Holmgren are wrought from the system designed by Bill Walsh.</p></li></ul><ul><li><p>The scenes of Francis Ford Coppola, Ron Howard, and James Cameron can be traced back to an accelerated start from Roger Corman.</p></li></ul><p>And yes, after looking at those lists, I would say that John McPhee and Bill Walsh and Roger Corman are pretty important.</p><p>But they don’t hold a candle to Bill Simmons and Grantland.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!gJnl!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!gJnl!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 424w, https://substackcdn.com/image/fetch/$s_!gJnl!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 848w, https://substackcdn.com/image/fetch/$s_!gJnl!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 1272w, https://substackcdn.com/image/fetch/$s_!gJnl!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!gJnl!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png" width="876" height="554" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!gJnl!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 424w, https://substackcdn.com/image/fetch/$s_!gJnl!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 848w, https://substackcdn.com/image/fetch/$s_!gJnl!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 1272w, https://substackcdn.com/image/fetch/$s_!gJnl!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a2c8282-a968-4454-8885-1e25ca234928_876x554.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><em><strong>More Like This</strong></em></h2><p>– <a href="https://www.nbcsports.com/nfl/profootballtalk/fmia" target="_blank" rel="noopener noreferrer">Football Morning in America</a></p><p>– <a href="https://www.theringer.com/" target="_blank" rel="noopener noreferrer">The Ringer</a></p><p>– <a href="https://www.espn.com/espn/page2/story?page=simmons/subject/archive" target="_blank" rel="noopener noreferrer">Sports Guy Archives</a></p><div><hr></div><h2><strong>About Kurate</strong></h2><p>The internet is full of corners. It is a library of sorts, but with a Dewey Decimal system built for machines. Not for mankind. There are endless paths to walk upon, holes to burrow into. The vast circuitry of the world’s information is ever unfolding.</p><p>Curation is the keystone for the human experience on the internet going forward. The ephemeral sense of taste melded with trend-tracking today’s reality, combined with references across both subject and time. Vertical, horizontal, deep must the curator go.</p><p>This is a newsletter about the internet. It is part museum, part food-blog but for blogs. It is a place to find other places so that the time you spend on the internet is not wasted on YouTube recommendations that entrance you but leave feeling empty. Or Instagram or TikTok reels that teach you a shallow lesson or imbue you with a shallow laugh.</p><p>This was the second version of Kurate. I hope you enjoyed.</p><p><a href="https://kramnotmark.substack.com/p/kurate-2-grantland-2011-2015">Originally published on Substack</a></p></article></noscript>
