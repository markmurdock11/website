<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">Back to archive</a><h1>KURATE #3 – VIBECESSION</h1><p>If there is one person I could recommend to anyone wanting to understand today’s economy.... it would be Kyla Scanlon.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!8m6R!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!8m6R!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!8m6R!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!8m6R!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!8m6R!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!8m6R!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!8m6R!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!8m6R!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!8m6R!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!8m6R!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F75c093d1-845c-4258-bdf1-5a72483ee3e6_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><blockquote><p><em>Are you afraid of interest rates? </em></p><p><em>Did you barely get a B in econ 101? </em></p><p><em>Do you feel like the world is ending but also life is good?</em></p></blockquote><h3><strong>Then Kyla Scanlon is the internet economist for you. </strong></h3><p>She is the number one expert in explaining what is happening and why in the world of finance.</p><p>And, most importantly, what it feels like to live through it.</p><p>Fun to read. Easy to understand. Digestible, yet analytical.</p><p>I nod my head and highlight a lot when reading her stuff (compliment).</p><h3>Kyla’s signature is a penchant… for defining new financial x internet nomenclature.</h3><ul><li><p><em><strong>Vibecession</strong></em>: economic stats look good but the economy feels bad</p></li><li><p><em><strong>Ozempicization</strong></em>: quick fixes for the individual, underlying problems untouched for society ahhh</p></li><li><p><em><strong>Shrugflation</strong></em>: everything is more expensive… but all the governments and AI orgs are just <em>throwing their hands in the air and continuing to gamble</em></p></li></ul><p>If there is one person I could recommend to anyone wanting to understand THESE MARKETS.</p><p>It would be Kyla Scanlon.</p><p>And if there was one article of Kyla’s that I wish EVERYBODY in the world would read…</p><p>It would be…</p><h2><strong>KURATE #3 – VIBECESSION:</strong></h2><p>This is an essay about Vibecession, a blog post by <a href="https://www.kylascanlon.com/" target="_blank" rel="noopener noreferrer">Kyla Scanlon</a> defining the gap between our lived experience in the real world and the information we receive about markets online.</p><p>Vibecession is an essay that…</p><ol><li><p>led to Kyla’s well-earned jump from <em>thought haver</em> to<em> thought leade</em>r and</p></li><li><p>perfectly defined the uneasiness most North Americans feel when comparing the booming economy to their frazzled reality.</p></li></ol><p>Put those two together, and you have <em><strong>zeitgeist</strong></em>: a moment in time captured by a new writer on the scene.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!aa1y!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!aa1y!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 424w, https://substackcdn.com/image/fetch/$s_!aa1y!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 848w, https://substackcdn.com/image/fetch/$s_!aa1y!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 1272w, https://substackcdn.com/image/fetch/$s_!aa1y!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!aa1y!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png" width="1456" height="1031" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!aa1y!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 424w, https://substackcdn.com/image/fetch/$s_!aa1y!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 848w, https://substackcdn.com/image/fetch/$s_!aa1y!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 1272w, https://substackcdn.com/image/fetch/$s_!aa1y!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F99d49c56-c369-471a-b826-c8c374689333_1502x1064.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>The disconnect between consumer sentiment and economic data. – that is the Vibecession.</p><p>Kyla describes it as a “self-fulfilling prophecy” – that after Covid the world has continued to wait for the massive implosion that we’ve learned to expect after a speculative, money-printing-crazed boom.</p><p><em>“If people have an experience (say, living through the 2008 recession) and evidence (home prices skyrocketing) that might shape some of their expectations - “wow, another unprecedented event to live through” which shapes their perception (things suck) and their interpretation of the future (things will continue to suck) - that shapes their narrative, which can shape reality.”</em></p><p>In terms of canonical essays of the internet, Vibecession is a keystone piece for understanding post-Covid economics.</p><h2><strong>Ultimately, Vibecession is bigger than recession</strong></h2><p>Vibecession is, for my money, the clearest description of…</p><p><strong>the increasingly common condition where humanity’s information environment and physical reality become impossible to reconcile.</strong></p><p>The world has accelerated since COVID.  The people feel this and so the vibes get weird.</p><p>And because the vibes get weird, we have all expected markets to go down… except all data shows that we are living in a bountiful, connected, AI-accelerated environment.</p><p>Everything we know about stocks and markets, all the lived and learned experiences from 1929 through 2020, points to some implosion around the corner.</p><p>But the party hasn’t stopped. The money continues up, the vibes continue down.</p><h3><strong>Kyla is the only analyst I know that can capture the vibecession…vibes (?) and extend them into the future.</strong></h3><p>She has mastered the art of writing along the trendlines, threading together what is happening with markets with how it feels to be in the culture, all in a way that speaks directly to online persons between the ages 17 and 39.</p><p>You can feel the pulse of the internet markets by reading her blog, which consistently defines cultural-economic phenomena in real time.</p><ul><li><p>October 2026: <a href="https://kyla.substack.com/p/the-shrugflation-triangle-how-ai" target="_blank" rel="noopener noreferrer">“The Shrugflation Triangle: How AI, Oil, and Treasuries are Impacting the Economy”</a></p></li><li><p>August 2026: “<a href="https://kyla.substack.com/p/how-to-get-rich-in-america" target="_blank" rel="noopener noreferrer">How to Get Rich in America</a>”</p></li><li><p>March 2026: “<a href="https://kyla.substack.com/p/the-ozempicization-of-the-economy" target="_blank" rel="noopener noreferrer">The Ozempicization of the Economy</a>”</p></li><li><p>December 2025: “<a href="https://kyla.substack.com/p/everyone-is-gambling-and-no-one-is" target="_blank" rel="noopener noreferrer">Everyone is Gambling and No One is Happy</a>”</p></li><li><p>June 2025: “<a href="https://kyla.substack.com/p/trump-mamdani-and-cluely" target="_blank" rel="noopener noreferrer">Trump, Mamdani, and Cluely”</a></p></li><li><p>September 2024: “<a href="https://kyla.substack.com/p/the-mr-beast-memo-is-a-guide-to-the" target="_blank" rel="noopener noreferrer">The Mr. Beast Memo is a Guide to the Gen Z Workforce</a>”</p></li></ul><p>This is a crazy run of producing canonical works of the internet and markets on almost a monthly basis. Insane.</p><p>Kyla’s entire archive (and also Instagram) is delightful, but this is specifically an essay about her breakout essay, The Vibecession, a perfect summary of a post-Covid world, that began with the words…</p><p>“<em>there is a lot going on and no one really knows what is going on”</em> – Kyla Scanlon, June 30, 2022</p><p>I recommend that you read the full piece <a href="https://web.archive.org/web/20220630154207/https://kyla.substack.com/p/the-vibecession-the-self-fulfilling" target="_blank" rel="noopener noreferrer">here</a>. And also go through all the sources on the <a href="https://en.wikipedia.org/wiki/Vibecession" target="_blank" rel="noopener noreferrer">Wikipedia page</a>, heh..</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!736C!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!736C!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 424w, https://substackcdn.com/image/fetch/$s_!736C!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 848w, https://substackcdn.com/image/fetch/$s_!736C!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 1272w, https://substackcdn.com/image/fetch/$s_!736C!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!736C!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png" width="1456" height="670" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!736C!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 424w, https://substackcdn.com/image/fetch/$s_!736C!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 848w, https://substackcdn.com/image/fetch/$s_!736C!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 1272w, https://substackcdn.com/image/fetch/$s_!736C!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F18bdfc42-56c5-4c1d-af16-4b03b8603549_1752x806.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h3>And I also recommend reading her book, “In This Economy?” </h3><p>I’ll leave it to you to figure out where to emphasize the title:</p><ul><li><p>In THIS economy?</p></li><li><p>IN this economy?</p></li><li><p>In this ECONOMY?</p></li></ul><p>And while there are not many recession conversations happening now, Kyla’s essay remains poignant: the Vibecession captures the feeling of confusion that people feel in today’s world.</p><p>Where scrolling is how opinions are created, where betting is the new investing, where war is streamed, and where everything is just happening so fast.</p><h2>Vibecession is Kurate #3, <em><strong>4.6/5</strong></em></h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!Awj9!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Awj9!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 424w, https://substackcdn.com/image/fetch/$s_!Awj9!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 848w, https://substackcdn.com/image/fetch/$s_!Awj9!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 1272w, https://substackcdn.com/image/fetch/$s_!Awj9!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Awj9!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png" width="878" height="536" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Awj9!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 424w, https://substackcdn.com/image/fetch/$s_!Awj9!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 848w, https://substackcdn.com/image/fetch/$s_!Awj9!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 1272w, https://substackcdn.com/image/fetch/$s_!Awj9!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F59c016c8-0f00-42ce-96cf-75e7b15ba074_878x536.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2>More Like This</h2><p>– <a href="https://www.derekthompson.org/p/the-monks-in-the-casino" target="_blank" rel="noopener noreferrer">Monks in the Casino</a>, Derek Thompson</p><p>– <a href="https://www.theatlantic.com/magazine/archive/2022/05/social-media-democracy-trust-babel/629369/" target="_blank" rel="noopener noreferrer">Why the Past 10 Years of American Life Have Been Uniquely Stupid</a>, Jonathan Haidt</p><p>– <a href="https://www.noahpinion.blog/" target="_blank" rel="noopener noreferrer">Noahpinion</a>, Noah Smith</p><h4><strong>About Kurate</strong></h4><p>Kurate is part internet museum, part food-blog for blogs.</p><p>This was Kurate #3.</p><p>You can also read my reviews of Patrick Collison’s website and Grantland <a href="https://kramnotmark.substack.com/s/kurate/?utm_source=substack&amp;utm_medium=menu" target="_blank" rel="noopener noreferrer">here</a>.</p><p><a href="https://kramnotmark.substack.com/p/kurate-3-vibecession">Originally published on Substack</a></p></article></noscript>
