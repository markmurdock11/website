width="1456" height="819" class="sizing-normal" alt="A lilac paper landscape of stacked notes, a folded map, and a lit desk lamp opening toward the horizon." title="A lilac paper landscape of stacked notes, a folded map, and a lit desk lamp opening toward the horizon." srcset="https://substackcdn.com/image/fetch/$s_!PTY1!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F693d5a09-4b7d-4e56-abcf-3b8b18d29d50_1672x941.png 424w, https://substackcdn.com/image/fetch/$s_!PTY1!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F693d5a09-4b7d-4e56-abcf-3b8b18d29d50_1672x941.png 848w, https://substackcdn.com/image/fetch/$s_!PTY1!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F693d5a09-4b7d-4e56-abcf-3b8b18d29d50_1672x941.png 1272w, https://substackcdn.com/image/fetch/$s_!PTY1!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F693d5a09-4b7d-4e56-abcf-3b8b18d29d50_1672x941.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Alright, I’m a few weeks into posting non-corporate thoughts for the world to read (all 92 of my subscribers).</p><p>I’m sharing this post today to “legibilize” Kram Not Mark. </p><p>So far I’ve posted about my travels to <a href="/writing-ireland-and-the-emma-i-never-could.html" data-native-post="ireland-and-the-emma-i-never-could">Ireland</a>, <a href="/writing-crete-friendship-and-what-technology.html" data-native-post="crete-friendship-and-what-technology">Crete</a>, and <a href="/writing-in-croatia-there-is-a-town-called.html" data-native-post="in-croatia-there-is-a-town-called">Croatia</a> during a two-month sabbatical I took earlier this year. </p><ul><li><p>Ireland is where I visited Emma’s home.</p></li><li><p>Crete is where I went on a walking trip I won’t forget. </p></li><li><p>Croatia was a trip of friendship and family and language.</p></li></ul><p>I am calling this series of essays “<a href="https://kramnotmark.substack.com/s/kinetic" target="_blank" rel="noopener noreferrer">Kinetic</a>”—a reference to the nature of travel (moving, moving, moving) and Emma (my partner who is always moving, moving, moving) and my writing style (the sentences are long and winding, like a path). </p><p>I currently have two series planned from here. </p><ul><li><p>One is called “Komplex,” a series of essays based on notes I wrote earlier this year after helping with a product launch that earned roughly 35 million social views and coverage from <a href="https://fortune.com/2026/02/10/layerzero-blockchain-ark-citadel-cathie-wood-nyse-dtcc-ice-tokenization-crypto/" target="_blank" rel="noopener noreferrer">Fortune</a>. The series is about the current media landscape, content, copy, and dealing with the weird split between AI and humans. I think I have five or six essays in it—maybe more, maybe less.</p></li><li><p>The second, and this is the one that I think has the most legs, is a series called “Kurate,” which will just be me reviewing some of my favorite websites and essays and places on the internet. It’s going to be like a food Instagram, but for the internet. </p></li></ul><p>A dark part of me also wants to do “Krypto” as a series because I hate all crypto writing and want to explain a lot of the money technology being invented through the lens of debt, government, and the history of markets, but I’m unsure whether I am going to be able to stomach the cringe.</p><p>Anyhow, instead of publishing Kinetic today, I have given you an illegible legibilization of Kram Not Mark. In all honesty, the title is a gotcha — I don’t really believe in being legible, as I believe legibility comes with the practice of high-level performance over a long period of time. </p><p>Legibility is just perfect practice turned into execution that then looks packaged (overnight success 10 years in the making). </p><p>Anyways, the pursuit of legibility is why you will be receiving posts from Kram Not Mark every Monday and Thursday, around noon PT. I’m out here practicing being legible by being myself…what a concept. </p><p class="button-wrapper"><a class="button primary" href="https://kramnotmark.substack.com/subscribe?" target="_blank" rel="noopener noreferrer"><span>Subscribe now</span></a></p><p>Anywho, since I’m here… here are 7 things I’m thinking about this week:</p><ol><li><p><strong>Substack Is a Mediocre Social App That Will Turn Into TV</strong></p><p>Substack is full of people writing content for the sake of making content. Lots of essays about writing essays. Lots of paragraphs that make me think of tiny mics (derogatory). I dislike it. The app’s feed itself is millennial, like some weird mixture of Threads and LinkedIn. In the long run, I think there is more upside in publishing content on your own site and vibe-coding a subscription backend or going native on X than betting on Substack. Email distribution is powerful. Substack has done a ton of work creating an easy-to-use solution for generating good-looking content and growing an email list, but I am unsure if it can scale into an actual social network—and when it does, it will probably just turn into TV and start pushing video. Derek Thompson has a whole essay about <a href="https://www.derekthompson.org/p/why-everything-became-television" target="_blank" rel="noopener noreferrer">why everything became television</a>, and <a href="https://substack.com/@kyla/note/p-214667471" target="_blank" rel="noopener noreferrer">Kyla on Let’s Do Lunch</a> last week feels like one small example of where Substack will end up by 2030. Personalities become programming, the feed becomes the channel guide, and the platform decides what gets distributed (Substack just reinvented cable, wooo). Anyways, I’m starting this section of the email with Substack to test if the Substack algo likes content about Substack, which, from what I see on the feed, might be the case. </p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!xGSP!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!xGSP!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 424w, https://substackcdn.com/image/fetch/$s_!xGSP!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 848w, https://substackcdn.com/image/fetch/$s_!xGSP!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 1272w, https://substackcdn.com/image/fetch/$s_!xGSP!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!xGSP!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png" width="1220" height="1032" class="sizing-normal" alt="Kyla Scanlon appearing on Let’s Do Lunch on Substack." title="Kyla Scanlon appearing on Let’s Do Lunch on Substack." srcset="https://substackcdn.com/image/fetch/$s_!xGSP!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 424w, https://substackcdn.com/image/fetch/$s_!xGSP!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 848w, https://substackcdn.com/image/fetch/$s_!xGSP!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 1272w, https://substackcdn.com/image/fetch/$s_!xGSP!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe07fb419-3656-4cae-9d94-b9933a745430_1220x1032.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ol start="2"><li><p><strong>Publishing Content… While Cringe, Is Worth It (So Far)!</strong></p><p>I’ve published three essays now about my travels this summer—<a href="/writing-ireland-and-the-emma-i-never-could.html" data-native-post="ireland-and-the-emma-i-never-could">Ireland</a>, <a href="/writing-crete-friendship-and-what-technology.html" data-native-post="crete-friendship-and-what-technology">Crete</a>, <a href="/writing-in-croatia-there-is-a-town-called.html" data-native-post="in-croatia-there-is-a-town-called">Croatia</a>. None have really “popped” off, meaning my subscriber count has barely moved, from 90 to 92 (lol), and almost nobody outside my friend network liked the posts. But the beauty of writing, as Henrik puts it, is that <a href="https://www.henrikkarlsson.xyz/p/search-query" target="_blank" rel="noopener noreferrer">a blog post is a very long and complex search query to find fascinating people and make them route interesting stuff to your inbox</a>. And my inbox has been pretty interesting since I’ve started publishing. One friend recommended this beautiful, beautiful piece by Ursula K. Le Guin, <a href="https://www.nonknowledge.org/media/pages/hfbksose21/3874102952-1621341422/ursula-k-le-guin.pdf" target="_blank" rel="noopener noreferrer">“Telling Is Listening,”</a> to me. A former colleague reached out and confirmed a want for a continued friendship. Kevin Kelly commented (!!) on <a href="/writing-crete-friendship-and-what-technology.html" data-native-post="crete-friendship-and-what-technology">my Crete essay</a>, which was inspired by <a href="https://colossus.com/article/flounder-mode/" target="_blank" rel="noopener noreferrer">his essay about walking</a>. I’ve found two interesting AI companies thanks to inbound messages on LinkedIn. And that’s just from publishing three essays! Very fun and really a reminder that the world gives back what it receives. Onward to more publishing—even though it feels super weird to continue writing about myself and about my thoughts. Who will care? And isn’t it embarrassing? I don’t know and yes, but we continue forth. I think it’s really hard to publish things that are true to me.</p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!wpsM!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!wpsM!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 424w, https://substackcdn.com/image/fetch/$s_!wpsM!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 848w, https://substackcdn.com/image/fetch/$s_!wpsM!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 1272w, https://substackcdn.com/image/fetch/$s_!wpsM!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!wpsM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png" width="1184" height="1336" class="sizing-normal" alt="A response to Kram’s published Crete essay." title="A response to Kram’s published Crete essay." srcset="https://substackcdn.com/image/fetch/$s_!wpsM!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 424w, https://substackcdn.com/image/fetch/$s_!wpsM!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 848w, https://substackcdn.com/image/fetch/$s_!wpsM!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 1272w, https://substackcdn.com/image/fetch/$s_!wpsM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0054d418-cb9b-4290-bcf5-de1a5826ce93_1184x1336.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ol start="3"><li><p><strong>There Will Be a Coordinated “AGI Is Here” Call Within Two Weeks</strong></p><p>I think a lot of people believe Anthropic and OpenAI team members are positioning themselves for a trillion-dollar IPO and the ability to create government-induced monopolies by making all these claims about how scary AI is. I actually think these organizations might be telling the truth. They actually might be scared to death by the technology they are creating. Anthropic comms remind me a lot of crypto company comms: there is definitely some narrative manipulation occurring, but every piece of communication they put out is also first-of-its-kind stuff. <a href="https://darioamodei.com/post/we-must-pace-the-frontier" target="_blank" rel="noopener noreferrer">Dario</a> is having to invent new language and new systems to explain big ideas, and mostly he is stating his truth FIRST before anyone else can front-run him. So, yes, Dario is manipulating the narrative around embedding third parties into frontier labs. But I also think he is scared to death of what might happen if a larger group of people beyond the startup employees at frontier labs are not allowed to shape what may become a new sentient part of the population. My prediction is that Anthropic, <a href="https://openai.com/index/research-acceleration-view-inside-openai/" target="_blank" rel="noopener noreferrer">OpenAI</a>, Google DeepMind, and xAI will make an AGI call by September 28. By an “AGI call,” I mean the teams themselves saying that AGI is here. </p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!o7h3!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!o7h3!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 424w, https://substackcdn.com/image/fetch/$s_!o7h3!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 848w, https://substackcdn.com/image/fetch/$s_!o7h3!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 1272w, https://substackcdn.com/image/fetch/$s_!o7h3!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!o7h3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png" width="918" height="1524" class="sizing-normal" alt="A post about recent warnings from frontier AI labs." title="A post about recent warnings from frontier AI labs." srcset="https://substackcdn.com/image/fetch/$s_!o7h3!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 424w, https://substackcdn.com/image/fetch/$s_!o7h3!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 848w, https://substackcdn.com/image/fetch/$s_!o7h3!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 1272w, https://substackcdn.com/image/fetch/$s_!o7h3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feb5a3b42-a651-4a64-aa64-bbdc865b4ba9_918x1524.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ol start="4"><li><p><strong>Markets Are Swallowing Sports Faster Than Leagues Can Adapt</strong></p><p>Sports have always been businesses. What feels weird about sports today is that every surrounding object—rights, picks, outcomes, teams, attention—is becoming separately tradable. You can see this in the <a href="https://pr.nba.com/nba-walt-disney-company-nbcuniversal-amazon-prime-video-media-agreements/" target="_blank" rel="noopener noreferrer">TV deals</a> and in the complexity of the collective bargaining agreements and in how many different ways one asset (an NBA draft pick) can be broken down and traded via protections. You can see it in the embrace of sports betting and prediction markets, which athletes and leagues alike have begun promoting as if their next paycheck depends on the success of hypergambling culture (with the movement from TV watching to phone scrolling, it just might). You can see it in who is investing in the teams nowadays—Ballmer and the Clippers, <a href="https://www.axios.com/2026/08/12/josh-kushner-bob-iger-lakers" target="_blank" rel="noopener noreferrer">Kushner and the Lakers</a>—and you can see it in how frail organizations are collectively falling short on policing what is right or wrong (NCAA and NIL and the WNBA and pretty much anything they’re trying to do). I think it’s really weird how the financial machinery surrounding sports has overtaken the sport itself. I wrote about this weird feeling I have with sports on Thoth <a href="https://thothworship.substack.com/p/nfl-preview-written-by-krammurda" target="_blank" rel="noopener noreferrer">this week</a>. I should trademark the essay title <em><strong>Liquid Sports</strong></em> before a Pompliano brother frontruns me.</p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!9LSj!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!9LSj!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 424w, https://substackcdn.com/image/fetch/$s_!9LSj!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 848w, https://substackcdn.com/image/fetch/$s_!9LSj!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 1272w, https://substackcdn.com/image/fetch/$s_!9LSj!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!9LSj!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png" width="1456" height="1081" class="sizing-normal" alt="Kram and Drew Murdock’s NFL preview on Thoth." title="Kram and Drew Murdock’s NFL preview on Thoth." srcset="https://substackcdn.com/image/fetch/$s_!9LSj!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 424w, https://substackcdn.com/image/fetch/$s_!9LSj!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 848w, https://substackcdn.com/image/fetch/$s_!9LSj!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 1272w, https://substackcdn.com/image/fetch/$s_!9LSj!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1ed50e02-51a4-46d1-bb8f-699804d8a351_1562x1160.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ol start="5"><li><p><strong>Zuckerberg Definitely Tweaked the Algo to Be Rome-Forward</strong></p><p>Colossus published a <a href="https://colossus.com/article/mark-zuckerberg-profile/" target="_blank" rel="noopener noreferrer">profile of Mark Zuckerberg</a> this week. I’m a huge fan of Colossus—they are investing in “the profile” piece to levels unseen since the ’80s. Notice I didn’t say “elevating,” as I don’t actually think the writing is quite on par with older publications, but for something coming out in 2026, they are crushing—if you haven’t read the Colossus pieces on <a href="https://colossus.com/article/joshua-kushner-thrive-new-world/" target="_blank" rel="noopener noreferrer">Josh Kushner</a>, <a href="https://colossus.com/article/thomas-peterffy-market-maker/" target="_blank" rel="noopener noreferrer">Interactive Brokers</a>, or <a href="https://colossus.com/article/flounder-mode/" target="_blank" rel="noopener noreferrer">Kevin Kelly</a>, stop everything you are doing and check them out. Anyways, the Zuckerberg piece was good (not great), but the craziest little nugget in the article was Zuck’s obsession with the Roman Empire and how he gave all his kids Roman-like names, too. Super weird—especially when you remember that <a href="https://yougov.com/en-us/articles/47481-men-women-thinking-about-the-roman-empire-poll" target="_blank" rel="noopener noreferrer">YouGov found that 28% of American men think about the Roman Empire at least once a month</a>… I just really think that Zuck might’ve unleashed a Roman bomb into the algo by accident, which is probably going to lead to a rise in imperialist thinking and also tourism to Rome. Anyways—in general I’m interested in the comeback of long-form. More than anything, the piece made me think about the return of the enormous corporate profile. Thrive Holdings just put out <a href="https://www.thriveholdings.com/the-pioneers" target="_blank" rel="noopener noreferrer">“The Pioneers,”</a> a piece by Nathan Baugh (full-time corporate bloggers FTW!!) that profiled a 65-year-old accounting firm in New Jersey and how they are incorporating AI. I thought it was more interesting that Thrive was investing in long-form than what the accounting firm was doing with AI, haha.</p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!RiII!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!RiII!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 424w, https://substackcdn.com/image/fetch/$s_!RiII!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 848w, https://substackcdn.com/image/fetch/$s_!RiII!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 1272w, https://substackcdn.com/image/fetch/$s_!RiII!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!RiII!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png" width="900" height="1166" class="sizing-normal" alt="The Colossus profile of Mark Zuckerberg." title="The Colossus profile of Mark Zuckerberg." srcset="https://substackcdn.com/image/fetch/$s_!RiII!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 424w, https://substackcdn.com/image/fetch/$s_!RiII!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 848w, https://substackcdn.com/image/fetch/$s_!RiII!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 1272w, https://substackcdn.com/image/fetch/$s_!RiII!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1cd7a8ed-3c3c-4437-b221-d4c8ed298408_900x1166.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><ol start="6"><li><p><strong>Be Ready for the Term “Barrels” to Rip in 2027</strong></p><p>Being online is fun because, if you are plugged into enough social feeds, you can track the narratives of the internet in real time. Narratives often come in the form of sticky words that, when lifted from their dictionary meaning, transform into slang to be used by companies to raise money, VCs to posture, and tech employees to make slop on all possible social feeds (usually starting on TikTok or Twitter, then dripping into Instagram, LinkedIn, and Facebook). Just as Dunder Mifflin was a paper company in a paperless world, we are now living as bodied people in the bodiless world—the mid-singularity experience is a weird one. The words and narratives that define us right now are all about exuding humanness and showcasing dominance through execution (because both thought (LLMs) and movement (robots) are coming for us). Therefore, humans are left with, idk, taste and distribution and agency in order to prove themselves worthy of money so they can provide food, water, and shelter. With that in mind, I would like to make a prediction for the word “Barrels” as the successor to 2026’s narrative of “motion”—which is defined as implicit momentum of an individual that overrides any friction the world might place in front of them on the way to their goals. Motion is a singular, taste-driven word and it’s a great word for 2026. But I think 2027 is going to be a bit more plural—how do you take the motion of many and turn it into momentum for more? I think it’s about Barrels: working together with a few other highly motioned individuals to do as much at the same time at a high level as possible. If you haven’t, I’d recommend listening to <a href="https://www.youtube.com/watch?v=w19IBxDu2Y4" target="_blank" rel="noopener noreferrer">Keith Rabois’s original “Barrels” presentation</a>.</p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!iAsB!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F56340d82-13f0-428e-bf50-d295229e0a7e_896x1090.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp"
