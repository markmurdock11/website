lic%2Fimages%2F486e305d-f78e-49dc-bcb3-fa54d297d7dd_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!-Aip!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F486e305d-f78e-49dc-bcb3-fa54d297d7dd_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!-Aip!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F486e305d-f78e-49dc-bcb3-fa54d297d7dd_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!-Aip!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F486e305d-f78e-49dc-bcb3-fa54d297d7dd_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!-Aip!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F486e305d-f78e-49dc-bcb3-fa54d297d7dd_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em><strong>Preliminary Fun Fact:</strong></em><strong> </strong><em>U.S. citizens were not required to have a passport to travel abroad until 1941.</em></p><p>I grabbed a passport in August of 2022.</p><p>Since then, I have not lived in the same place for more than two months. It’s been about 18 months of travel for Kram. I’ve spent somewhere around 150 hours in airports and indulged in a similar number of ginger ale’s whilst in the air.</p><p>Overall, I received stamps on my passport in 7 countries: India, Thailand, Italy, France, Slovenia, Canada, and UAE. Stateside, I was also busy, spending time in Philadelphia, Austin, New York, and Houston (while also visiting Denver and Nashville).</p><p>For canon purposes, I figured it might not hurt to put in writing a few thoughts, feelings, and opinions on where I’ve been and what I’ve experienced.</p><p>We’ll start internationally and then come back to domestic.</p><div><hr></div><div class="pullquote"><p><strong>international</strong></p></div><div><hr></div><h2>On India</h2><h5>Experiences</h5><p>I’ve been to India twice. Once on a journey across northern India, and once on a shorter adventure through southern India. Both times I traveled with the same group of friends I met through work: Arjun (short), Akshay (tall), Marko (the Croatian).</p><p><em>In October of 2022…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!w9qq!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!w9qq!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!w9qq!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!w9qq!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!w9qq!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!w9qq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png" width="1052" height="796" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!w9qq!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!w9qq!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!w9qq!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!w9qq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F93c82e82-e722-4736-88f2-3eed20d64f32_1052x796.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I spent a month across four different locations.</p><ul><li><p>Delhi —&gt; the home of Arjun. Delhi was the first out-of-the-country experience I ever had and it was bonkers. With roughly 32 million people, Delhi is crowded, energetic, and confusing. Think of it like New York City, minus building regulations and transportation infrastructure, then add 30% more people. We used Delhi as our home base — though didn’t explore too much outside of a night out getting beers at their tech center (a really nice place). Oh, and I guess we did get to see the Taj Mahal (two-hour drive tho).</p></li><li><p>Amritsar —&gt; the home of the Golden Temple and a bit of a holy town (no meat, cigarettes, or alcohol allowed within 1 mile of the temple is the rule I remember). We spent a few days here, on the border of Pakistan, enjoying the holy vibes and getting lost amidst the endless stalls and merchants selling everything from clothes to fruit to day passes to different tourist events.</p></li><li><p>Dharamsala —&gt; the home of a yoga retreat tucked into the mountains that we spent a week at. Did we perform any yoga? Absolutely not. But did we enjoy the mountainous view, great food, and fresh, ahem, herbs — yes.</p></li><li><p>Ladakh —&gt; the home of the most ridiculous stretch of travel in my life. Ladakh is 3,000 meters in elevation, a military base, and right next to China — so an American traveling here is a bit out of the ordinary. From Ladakh, we hit Nubra Valley (gorgeous) and Pangong Lake (more gorgeous) by traversing the world’s highest road at the worst time of the year (just warm enough for ice to turn to slush). I will never do this trip again, but I wouldn’t give these memories up for anything: the most beautiful sunrise I’ve ever seen, a mile-long camel ride, go carts at 5,000 meters, having my football popped by an Indian military member because it looked dangerous, etc.</p></li></ul><p><em>In October of 2023…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!CF5_!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!CF5_!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 424w, https://substackcdn.com/image/fetch/$s_!CF5_!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 848w, https://substackcdn.com/image/fetch/$s_!CF5_!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 1272w, https://substackcdn.com/image/fetch/$s_!CF5_!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!CF5_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png" width="1052" height="471" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!CF5_!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 424w, https://substackcdn.com/image/fetch/$s_!CF5_!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 848w, https://substackcdn.com/image/fetch/$s_!CF5_!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 1272w, https://substackcdn.com/image/fetch/$s_!CF5_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4b732421-3664-43b6-b028-1b8a8f70acf6_1052x471.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>We ran it back — on a trip that was cut off too soon for my liking (Kram was having some health issues that were unrelated to India).</p><p>This time, we found ourselves in southern India, with our home base being Bangalore, the home of Akshay. Our trip this time around the block was far more work related, with most of our time focused on hanging out around a “hacker house” to grind on things that needed to be grinded upon.</p><p>That being said, we still had some time to travel a bit — hitting Ooty and Kodaikanal (pictured) in conjunction with Bangalore.</p><h5>Vibes</h5><p>Southern India is an endless tropical rainforest. Green everywhere. Elephants on the road. Sweaty. Beautiful.</p><p>Northern India is mountainous and condescending. Harsh conditions, yet lush ecosystems. Cold. Beautiful.</p><h5>Advice</h5><ul><li><p>visit the Taj Mahal in a traditional kurta — you will be treated with much respect.</p></li><li><p>fly to Amritsar once in your life and eat at Chrystals. Order chicken vindaloo and butter chicken and tons of garlic naan. It will be the best meal you’ve ever had.</p></li><li><p>Do not drink the water, drink the water bottles you purchase every day.</p></li><li><p>Attempting to bring a lighter on a flight in India is an exercise in futility.</p></li><li><p>Hire drivers for days at a time and have them drive you around. It’s not going to be expensive.</p></li><li><p>The Golden Temple and Taj Mahal and Pangong Lake are must-see locations.</p></li><li><p>Ordering “curry” is not what you do. Everything is a curry in India. That’s like going to a Mexican restaurant and ordering “tacos.” Like, ser, what kind of tacos?</p></li><li><p>Northern India has much better food (gravy-focused) than Southern India (dry spice-focused).</p></li><li><p>KFC is flames.</p></li><li><p>It is sometimes hard to find beer in India.</p></li><li><p>The lines in roads and things like “traffic regulations” are to be ignored with impetuence.</p></li><li><p>Never, ever, accept the first price that you are offered, you will most definitely be getting ripped off.</p></li><li><p>It helps to travel with friends, especially my friends (thanks friends, if you’re reading this).</p></li><li><p>Fly Emirates.</p></li><li><p>Garlic naan, butter chicken, briyani — the holy trinity of foods that an American in India can solely survive on if you are of the less adventurous type.</p></li><li><p>Be wary of borders. Very, very wary. Officers always check your bags.</p></li></ul><div><hr></div><h2>On Thailand</h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!9gGn!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!9gGn!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!9gGn!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!9gGn!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!9gGn!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!9gGn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png" width="1052" height="796" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!9gGn!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!9gGn!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!9gGn!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!9gGn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fec8c025e-52ae-4635-b950-f3a505c7ee4c_1052x796.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h5>Experiences</h5><p>15 days in Thailand for a company retreat. A week in Bangkok, the landlocked capital of Thailand. A week and change on the island of Koh Samui.</p><p><em>In Bangkok…</em></p><p>I mostly focused on work because the nightlife in Bangkok just isn’t my style. Was visiting with a ton of Europeans, who described Bangkok as a twisted version of their vaunted Red Light District — which is either a huge compliment or a huge dig, depending on who was the descriptor.</p><p><em>In Koh Samui…</em></p><p>I had some fun. Our work schedule was quite lax — solo work from 9-12, meetings from 1-3, with the rest of the time being either unstructured work, free time, or events.</p><p>In the brief time I was in Thailand, I was able to zip line, hike, lay on the beach, eat properly spicy fried rice, hang out on a private island, snorkel, and enjoy the best boat ride of my life (pictured above).</p><h5>Vibes</h5><p>A sunset, a coconut, a beach, and endless 80-degree weather. Clocks do not work in Thailand.</p><h5>Advice</h5><ul><li><p>skip Bangkok and go straight to an island</p></li><li><p>drink 2-3 coconuts a day, drink 2-3 spiked coconuts at night.</p></li><li><p>hooker culture is real — be aware of it and just don’t make eye contact (or make direct eye contact if that’s your style)</p></li><li><p>a ping pong show is not what you think it is</p></li><li><p>foot massages cost $3 for 30 minutes and you should take advantage of that</p></li><li><p>telling your waiter or waitress “Thai Spicy” will lead to your face melting off melt, but the food will be absolutely delicious.</p></li><li><p>bring a sturdy pair of flip-flops</p></li></ul><div><hr></div><h2>On Italy</h2><h5>Experiences</h5><p>I spent almost two months in Italy in 2023 thanks to a combination of a job that required a bit of travel and a best friend who decided to live in the home of pizza.</p><p><em>In Feb of 2023…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!kGpX!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!kGpX!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 424w, https://substackcdn.com/image/fetch/$s_!kGpX!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 848w, https://substackcdn.com/image/fetch/$s_!kGpX!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 1272w, https://substackcdn.com/image/fetch/$s_!kGpX!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!kGpX!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png" width="1053" height="796" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!kGpX!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 424w, https://substackcdn.com/image/fetch/$s_!kGpX!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 848w, https://substackcdn.com/image/fetch/$s_!kGpX!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 1272w, https://substackcdn.com/image/fetch/$s_!kGpX!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F82fd5151-12a7-423b-9851-3742706396b8_1053x796.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I went on an Italian bender that led to Florence, Venice, Rome, and a small little town in Northern Italy called Sacile. None of this was planned in advance, no trips had an agenda and it was a wonderous time. (I also ran 100 miles in the 25 days I was there. An odd little sidenote.)</p><p>Sacile was home base for this trip, as that’s where my friend had a two-bedroom apartment that I got to borrow! Florence, Rome, and Venice were weekend trips, a 2, 5, and 1 hour train ride, respectively.</p><ul><li><p>Florence —&gt; It was a sunny weekend, the Italian Air Force put on an air show over the city. The Duomo, Bobili Gardens, and the Statue of David. I saw two out of three of them. Ben, Vincenzo, and I decided to test the limit of when Kram would black out, which required, ahem, two bottles of wine, 6-10 darts, and 15 drinks over the course of 11 bars — if our notes app is to be believed (and we have videos to back it up). The last thing I remember is an alley outside of an Irish bar. Wonderful.</p></li><li><p>Venice —&gt; We happened upon Venice during a Carnival weekend, meaning that everybody was dressed up Halloween style on the streets of Venice (and, hence, why I’m wearing that sick hat in the picture above). It was a great weekend, minus the fact that we saw St. Mark’s Basilica on a cloudy day and that Venice, in general, is a somewhat boring city that closes around 11 pm (unless you make it stay open by sheer force of inebriated will). Murano, the island of glass-making, was the highlight of this trip — the brightly colored town is full of the most breathtaking glass sculptures you’ll ever lay eyes upon. It was again a Kram, Vincenzo, and Ben weekend, so there were another few tanks of wine consumed during this trip, culminating in a race up some stairs (featured on Instagram), a video loudly extolling the virtues of the US Air Force (patriotism!), another video of Vincenzo saying hello to my grandmother (I’ll send this to you if you want it, Hunny), and a potty break that saw urine spilling into a canal (elite).</p></li><li><p>Rome —&gt; A Ben and Kram solo trip. We finished running 100 miles in 25 days at the Coliseum, which felt like an entirely poetic thing to do. We also traipsed around the town, taking in the sights of a city built upon thousands of years of history (Roman Empire, take a drink!). By walking around aimlessly, we found Trevi Fountain, The Parthenon, St. Peter’s Basilica, and The Roman Forum. Perhaps the greatest video from this trip was when I was taking a vlog of some cool-looking pillars down the street, asked Ben what he thought they were, and then we both realized it was the Parthenon(this was obviously a few beers in).</p></li><li><p>Sacile —&gt; Tucked just inside the northernmost part of Italy, Sacile is about a 20-minute drive from the Aviano airbase. A small town full of delightfully quaint restaurants, this is where I spent the weekdays working out of Ben’s apartment, which he graciously left empty for me because he works for the military and has put on camouflage and commute to work every day (lol, camo).</p></li></ul><p><em>In August of 2023…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!1N1l!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!1N1l!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 424w, https://substackcdn.com/image/fetch/$s_!1N1l!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 848w, https://substackcdn.com/image/fetch/$s_!1N1l!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 1272w, https://substackcdn.com/image/fetch/$s_!1N1l!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!1N1l!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png" width="1456" height="1099" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!1N1l!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 424w, https://substackcdn.com/image/fetch/$s_!1N1l!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 848w, https://substackcdn.com/image/fetch/$s_!1N1l!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 1272w, https://substackcdn.com/image/fetch/$s_!1N1l!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F91b1d09a-e9a3-4ea6-9f77-93b67764ad72_1484x1120.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I had a bit of a quieter trip to Italy on the heels of a work trip to Paris. What started as a weekend trip to meet Bag and Ben in Italy ended up being almost a month because, well, who would want to leave Italy for any reason?</p><p>While it was a quiet trip, there were a few highlights:</p><ul><li><p>A Beach Trip Disaster —&gt; Kram, Bag, Ben, Vincenzo, Girfriendicca, and Nate. We all took a hop-skip and a drive down to the beach — an Italian beach — for a weekend on the water. Twas about a 3-hour drive from Sacile to a town whose name is now lost from me (Ben, please comment). What started as an innocuous day on the beach, with pizza and beers in the afternoon, piaya and meade for dinner, and a trip to da club, ended in disaster after one of our group members was kicked out of the club that he barely got into — leading to a near sleepless night that is still not that funny but will get funnier as the years go by, for sure.</p></li><li><p>Romeo, Dear Romeo —&gt; In fair Verona, did this weekend trip begin, with Kram third wheeling his ass off for Ben and Girlfriendicca. Verona is honestly gorgeous — a small town centered around a fictional story. It is a tourist trap, but a clean, interesting tourist trap. Our weekend included checking out a few cool bridges, walking around aimlessly, and seeing Juliet’s grave. I also bought a sick hat.</p></li></ul><p>Besides those two trips, I hung out in Sacile, again helping Ben and Marathonicca on their marathon training — meaning I was running 4-6 miles most days for no reason outside of boredom.</p><p>Sacile is a fantastic little place, I have to say.</p><h5>Vibes</h5><p>Dionysus.</p><h5>Advice</h5><ul><li><p>When in Rome, do as the Romans do, because the Romans do things right: concrete, wine, pasta, and imperialism!</p></li><li><p>Take a walking tour of the Coliseum by day and walk around it aimlessly by night (they put colorful lights on it!)!</p></li><li><p>Spend 6-10 hours at the Boboli Gardens and Castle in Florence.</p></li><li><p>In Rome, don’t map anything, just follow the flow of traffic and stop at things that look cool.</p></li><li><p>Pasta is a high-end dinner, pizza is not — so expect more pizza and less pasta.</p></li><li><p>Kebabs are the best — eat at least 4 per week (especially if you are in Sacile).</p></li><li><p>Spend as little money on hotels as possible. If you do Italy correctly, you will not be spending much time there anyways.</p></li><li><p>Go to Verona for a day, Venice for two days, Florence for an extended weekend, and Rome for a week.</p></li><li><p>Northern Italy is beautiful — go run around the mountains.</p></li><li><p>If you try to speak Italian, you will be rewarded with a delighted smile.</p></li><li><p>Don’t expect to get a coffee, or much of anything, in between the hours of 2 pm to 5 pm, as it seems like Italy does not believe in midday work.</p></li><li><p>Enjoy the wine and pizza because nothing in the States matches it.</p></li><li><p>Put your phone down and walk down the streets in awe. The cities are built to inspire.</p></li><li><p>Find a mate before journeying to Verona.</p></li><li><p>Always, always, order a cappuccino when possible.</p></li><li><p>When in Murano, go learn how glass is made and then spend wayyyy too much money on buying a souvenier!</p></li><li><p>Florence. Go there.</p></li></ul><div><hr></div><h2>On Paris</h2><h5>Experiences</h5><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!wRGE!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!wRGE!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!wRGE!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!wRGE!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!wRGE!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!wRGE!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png" width="1052" height="796" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!wRGE!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!wRGE!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!wRGE!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!wRGE!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45def5c0-4182-4e15-bd5a-17da3e721eae_1052x796.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>A week-long trip for work kept me pretty busy. I spoke at an event, had about 50 meetings to attend, and was up to the crack of dawn most nights at dinners on the Seine (poor me).</p><p>In between work, I did find some time to enjoy the sights. I blundered across Notre Dame (under construction), walked around the Louvre (didn’t go inside due to a time crunch), and saw some pretty sick cathedrals in general. I saw The Eiffel Tower from afar, but didn’t venture closer.</p><p>In general, I viewed this trip to Paris as a preliminary Paris extravaganza — a way for me to explore the city and be prepared for when I do Paris RIGHT at some point in the future when, ya know, I’m not quite so extraordinarily single.</p><h5>Vibes</h5><p>Sunlight until 11 pm. A ticklish wind. The energy of The Seine. Lights, romantic lights, everywhere. Fashion in a way that made me somewhat uncomfortable.</p><h5>Advice</h5><ul><li><p>Eat as many croissants as possible. Yes, French croissants are better than other croissants.</p></li><li><p>When at a cafe, sit on the second row from the street, unless you want people to accidentally bump you every three seconds.</p></li><li><p>Don’t even bother to try to speak French — broken French seems like an insult.</p></li><li><p>Be prepared to stay out until 4-5 am. And that’s ok because work will not start until 11 am.</p></li><li><p>Get up early and walk around The Seine with nothing to do.</p></li><li><p>Be prepared to or bike everywhere (I chose to walk…).</p></li><li><p>Watch The Devil Wears Prada on the plane ride to Paris.</p></li><li><p>The wine is delicious.</p></li><li><p>French onion soup goes hard at most cafes.</p></li><li><p>Buy tickets to the Louvre — it’s not really a walk-in type of thing (I learned this the hard way).</p></li><li><p>Wo not, under any circumstance, book a flight with Expedia when going international because if plans change, you are absolutely screwed.</p></li></ul><div><hr></div><h2>On Dubai</h2><h5>Experiences</h5><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!8tsn!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!8tsn!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!8tsn!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!8tsn!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!8tsn!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!8tsn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png" width="1052" height="796" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!8tsn!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 424w, https://substackcdn.com/image/fetch/$s_!8tsn!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 848w, https://substackcdn.com/image/fetch/$s_!8tsn!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 1272w, https://substackcdn.com/image/fetch/$s_!8tsn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7041312b-e2d4-4d90-94a1-7882290e1131_1052x796.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>My friend Arjun and I gave a talk in Dubai about “Bridge Aggregation in a Multi-Chain World” — a topic that CRUSHES it on first dates. This is probably the coolest work thing I’ve done thus far in my career. It was an IEEE event, which means everyone in the audience was a cryptography nerd, mathematician, or engineer. Our talk was about 30 minutes long and was sort of the culmination of 8 months of reading, writing, and podcasts. If you ever want to waste two hours of your life, feel free to ask me about that talk.</p><p>Anyways, since I flew all the way to Dubai, I decided to take a full week there. It was amazing. Dubai is a city built entirely after 2005 and its infrastructure is pristine. There is not a piece of trash on the streets nor a rough part of the city.</p><p>The main (and really only) event in Dubai is The Burj Khalifa, which stands at 2717 feet and is the tallest building in the world by a pretty wide margin. Jun and I spent many a night just walking around The Burj, gawking. Outside of The Burj, there isn’t much to do except hangout in immaculate malls, restaurants, and coffee shops — which is fine by me, as we had a lot of work to do for our talk.</p><h5>Vibes</h5><p>A video game city come to life.</p><h5>Advice</h5><ul><li><p>Dubai is so hot that nobody goes outside in the heat of the day. That means many people are semi-nocturnal — so be ready for regular nights to go to 2 am and days to be pretty slow.</p></li><li><p>Walk along the water at night — it’s beautiful.</p></li><li><p>Take notice of what American places found themselves in Dubai because it’s hilarious (Cheesecake Factory, Chili’s, Crispy Creme, Texas Roadhouse).</p></li><li><p>Hang out at the mall and find the restaurant on the third floor that has seating overlooking the Burj.</p></li><li><p>When giving a presentation, maybe wear a shirt that isn’t quite so snug.</p></li><li><p>Fly Emirates and ask your flight attendants a ton of questions.</p></li><li><p>Turkish coffee with dates is fantastic.</p></li><li><p>Kunafa is an elite dessert — order it often.</p></li><li><p>Be careful what you say in public transportation, as you never know who might be listening.</p></li><li><p>Salt is not a good burger shop, but it is an enjoyable place to wile a night away.</p></li></ul><div><hr></div><h2>On Slovenia</h2><h5>Experiences</h5><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!m0qE!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!m0qE!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 424w, https://substackcdn.com/image/fetch/$s_!m0qE!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 848w, https://substackcdn.com/image/fetch/$s_!m0qE!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 1272w, https://substackcdn.com/image/fetch/$s_!m0qE!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!m0qE!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png" width="1456" height="1099" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!m0qE!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 424w, https://substackcdn.com/image/fetch/$s_!m0qE!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 848w, https://substackcdn.com/image/fetch/$s_!m0qE!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 1272w, https://substackcdn.com/image/fetch/$s_!m0qE!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9988d84e-eb80-415a-9292-41321d04ee72_1484x1120.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>A weekend trip to visit my favorite Croatian friend, who happens to now live in Slovenia. I walked far too many steps to find a waterfall, was driven across beautiful highways to Lake Bled, and spent an afternoon meandering around Ljubljana. Overall, it was a fantastic little weekend trip across the border from Italy.</p><h5>Vibes</h5><p>Rolling green hills, rich blue water, walkable cities — felt like European-city-version of The Shire.</p><h5>Advice</h5><ul><li><p>Make sure to become friends with a Croatian who spent a few years as a travel guide — he will show you the best places to go.</p></li><li><p>Lard in eggs is better than butter in eggs.</p></li><li><p>Don’t forget to purchase a vignette on the way into the country.</p></li><li><p>The cake at Bled Castle is worth purchasing, especially if you plan to inhale it atop the patio overlooking the lake.</p></li><li><p>When a friend takes you to a ravine for a walk, expect a hike, not a walk.</p></li><li><p>Klobasarna (famous restaurant) has fantastic sausage, but terrible kolaches.</p></li></ul><div><hr></div><h2>On Vancouver</h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!WkVf!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!WkVf!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!WkVf!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!WkVf!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!WkVf!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!WkVf!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png" width="1456" height="1932" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!WkVf!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!WkVf!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!WkVf!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!WkVf!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3ff62ce1-09b5-44e4-adba-c9b1d1470249_1484x1969.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h5>Experiences</h5><p>Two trips to Canada occurred in 2024 for Kram, once in October, and once in December. Both revolved around a new gig and centered on downtown Vancouver — Yaletown to be exact. The experience was a week-long, with a pop-in from younger brother Bag. The second was a Christmas extravaganza, with the entire Murdock family traversing that nefarious border for a few days of holiday cheer.</p><h5>Vibes</h5><p>It’s like the tech scene of Austin mixed with the skyline of Manhattan (just Manhattan) and the walkability of France, minus the sunshine of Denver.</p><h5>Advice</h5><ul><li><p>Nightingale is a delightful dining experience</p></li><li><p>The Capilano Suspension Bridge is overrated, but the canopy tour is underrated. Be sure to not look for a trash can while the bus is waiting though, when taking the shuttle from downtown to the bridge.</p></li><li><p>Sea to Sky Gondola is worth the $70 admission fee, but the highlight is really the chili at the top of the mountain.</p></li><li><p>Bring an umbrella everywhere you go, even if it is quite sunny outside.</p></li><li><p>It’s not quite as cold as you would expect.</p></li><li><p>Canadian Dollars are hilarious and you shouldn’t hold them — credit cards work well enough.</p></li><li><p>Stanley Park has great bathrooms and even greater views.</p></li><li><p>Kitsilano has a great beach and you should walk around it.</p></li><li><p>UBC is a beautiful campus and might put American campuses to shame.</p></li></ul><div><hr></div><div class="pullquote"><p><strong>domestic</strong></p><div><hr></div></div><h2>On New York</h2><h5>Experiences</h5><p>New York is always a fun time. I hit NYC 3-4 separate times in the last 15 months.</p><p><em>In mid-2022…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!R4Io!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!R4Io!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 424w, https://substackcdn.com/image/fetch/$s_!R4Io!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 848w, https://substackcdn.com/image/fetch/$s_!R4Io!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 1272w, https://substackcdn.com/image/fetch/$s_!R4Io!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!R4Io!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png" width="796" height="1052" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!R4Io!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 424w, https://substackcdn.com/image/fetch/$s_!R4Io!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 848w, https://substackcdn.com/image/fetch/$s_!R4Io!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 1272w, https://substackcdn.com/image/fetch/$s_!R4Io!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f733846-dda3-494c-8956-a0afe8788ac5_796x1052.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I journeyed to the Big Apple with my mother and two brothers. A tourist excursion it was. We hit Joe’s Pizza, Central Park, Times Square, and the Chrysler Building (as pictured below) etc.</p><p>It was a fantastic little expedition into the big city added late to our North Eastern travel agenda that was primarily focused on Turner visiting a few colleges (including Villanova and Princeton) and a Bag/J-Tonic/Kram/Cousin Jeff celebrating a Manhattan-infused, Taylor Swift adjacent 4th of July.</p><p><em>In late 2022…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!V-y_!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!V-y_!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!V-y_!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!V-y_!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!V-y_!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!V-y_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png" width="1456" height="1932" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!V-y_!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!V-y_!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!V-y_!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!V-y_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac2bfd5d-d68c-4c77-a411-4e07b5c125b2_1484x1969.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I ended up in NYC for Mainnet — a crypto conference put on by a company called Messari. The event is held at Pier 36, which is about a 15-minute walk from the Financial District, where I was lucky enough to stay for an entire week. It’s your typical conference: a big building with lots of booths and tech bros wearing vests and lanyards and Allbirds. I’ve come to appreciate conferences, as they ar a fun way for me to see different cities, as most of the side events happen across the entire city. I’ve had meetings on Wall Street, dinner at Times Square, lunch in Brooklyn, a Manhattan in Manhattan, I’ve spoken at an event overlooking Central Park (shown above).</p><p>Maybe my favorite memory from this trip was when I caught a Yankees/Red Sox game directly behind the plate, eight rows up. It was a near-perfect day, 70 degrees and sunny, perfect for a few beers and America’s pastime. The game was during Aaron Judge’s race to 62 home runs and the stadium was abuzz — applauding him before and after every at-bat despite a distinct lack of a record-breaking performance.</p><p><em>In late 2023…</em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!9rzH!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!9rzH!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 424w, https://substackcdn.com/image/fetch/$s_!9rzH!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 848w, https://substackcdn.com/image/fetch/$s_!9rzH!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 1272w, https://substackcdn.com/image/fetch/$s_!9rzH!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!9rzH!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png" width="1308" height="748" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!9rzH!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 424w, https://substackcdn.com/image/fetch/$s_!9rzH!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 848w, https://substackcdn.com/image/fetch/$s_!9rzH!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 1272w, https://substackcdn.com/image/fetch/$s_!9rzH!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8d5f03c-5eac-43fc-8e82-b14e4e847c19_1308x748.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I hit Mainnet again, this time as a seasoned conference pro and, ahem, a speaker (as shown above!). This was a week-long trip that was a bit of a grind because I was asked to speak only 4 days in advance, which meant I had to throw together a last-second presentation, change my flight to an earlier date, and sleep at a hostel on night one (cuz every hotel room in NYC was booked that night). Overall, not so glamourous — except it was all worth it because the talk was super fun to give and at least one person took pictures of my slides (lol).</p><p>Anyways, Mainnet was very similar to the last time I was there. Pier 36. Franklin Hotel. Morning walks across the city from hotel to conference. Events in China Town and the Financial District were the highlight. A few fancy schmancy dinners that I was glad I didn’t have to pick up the check on.</p><h5>Vibes</h5><p>New York City is a movie setting, and walking down the street is a cinematic experience. Something about NYC makes me want to take a long drag out of a dart.</p><h5>Advice</h5><ul><li><p><a href="https://www.lostacos1.com/" target="_blank" rel="noopener noreferrer">Los Tacos</a> in New York City is perhaps the best-drunk food available at any hour of the night. As a Texan, it really hurts me to compliment them, but, I have to say, Los Tacos al pastor tacos are probably some of the best I’ve had this century.</p></li><li><p>When needing to store luggage whilst sightseeing, check out <a href="https://usebounce.com/city/new-york" target="_blank" rel="noopener noreferrer">Bounce</a>. It cost me $5 to find a restaurant near Yankee Stadium to hold my bags during the aforementioned Judge game so that I could leave directly from the stadium to the airport.</p></li><li><p>Never Uber. Always Subway.</p></li><li><p><a href="https://www.cookshopny.com/" target="_blank" rel="noopener noreferrer">Cookshop</a> is a wonderful place to grab dinner with friends or family.</p></li><li><p>Do not order a Manhattan on the rocks while in Manhattan. Get it up or don’t get it at all.</p></li><li><p>WeWork’s are cheapest on Broadway and you can usually find a quiet place to work for less than $40 for an entire day.</p></li><li><p>The 9/11 Museum is a tear-jerker, but certainly worth 3-4 hours. For a World-Trade-Center-Owned business, it contains a shocking amount of content for conspiracy theorists to conspire with.</p></li><li><p>When in New Jersey and wanting to not be in New Jersey and instead be in New York, please, PLEASE, take the ferry. Views of downtown Manhattan, Lady Liberty, and sturdy bridges abound.</p></li><li><p>The pizza is so good — be sure to grab as many slices as possible.</p></li></ul><div><hr></div><h2>On Austin</h2><h5>Experiences</h5><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!3mh4!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!3mh4!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!3mh4!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!3mh4!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!3mh4!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!3mh4!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg" width="1456" height="1092" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!3mh4!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!3mh4!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!3mh4!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!3mh4!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3617a287-6b38-4f95-8ea1-75b38936f4ad_4032x3024.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Austin was a mainstay on the 2023 world tour because it is a mainstay for the conference circuit that I oh so happily find myself upon. I spent a few weeks in Austin in April for Consensus and another few weeks in Austin in September for Permissionless, two of the biggest events of my year.</p><p>Austin is more of a second home than a place to go for me. Outside of Houston, it’s probably the place I’ve spent the most time in during my 25 years (gasp — how old I am!). That being said, this was the first year I ventured out of the North Austin bubble where my family is from (shoutout family). I spent a few weeks on East 6th in September of this year, a week in the North with the grand fam, and a full month on campus in November 2022.</p><h5>Vibes</h5><p>It’s like New York except lamer.</p><h5>Advice</h5><ul><li><p>Peche is a delightful place to dine. So is Bar Peached.</p></li><li><p>For coffee, go to Jo’s.</p></li><li><p>UT Games are far more fun when in the student section than in the actual stands.</p></li><li><p>Never, ever park downtown, just Uber.</p></li><li><p>Buford’s is trash. Cain and Abel’s is also trash now (rip previous location). Really all of 6th Street is trash. Go to East 6th or Rainey.</p></li><li><p>East 6th is the place to be and I will live there at some point.</p></li><li><p>Via 313 has the best Detroit-style pizza this side of a Piston’s fan.</p></li><li><p>Mt. Joy in Austin is a must-see ticket.</p></li><li><p>A book and a towel and a summer day spent at Barton Springs is an elite experience.</p></li><li><p>Vintage Bookstore and Wine Bar is a wine bar / bookstore that I adore. Go to a poetry reading there.</p></li><li><p>VonLane is a bus that takes you to and fro Houston/Austin for $150 and that is such a steal. WiFi, snacks, and comfy chairs for the win.</p></li><li><p>Visit your grandparents and sit around and talk about things!</p></li></ul><div><hr></div><h2>On Denver</h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!Q9wF!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Q9wF!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 424w, https://substackcdn.com/image/fetch/$s_!Q9wF!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 848w, https://substackcdn.com/image/fetch/$s_!Q9wF!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!Q9wF!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Q9wF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg" width="960" height="1280" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Q9wF!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 424w, https://substackcdn.com/image/fetch/$s_!Q9wF!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 848w, https://substackcdn.com/image/fetch/$s_!Q9wF!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!Q9wF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fcb82c967-ea80-4f44-adc0-a38cf8bfed95_960x1280.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h5>Experiences</h5><p>A week in Denver to end February and start March was just what the doctor ordered. It was a busy week (conferences, duh), but a fruitful week of life experiences. In just a few days I tried quite a few things, like my first gummy, my first bite of sushi, and a few Denver-style burritos that were rather life changing.</p><p>Denver is a good place to hang out. Great coffee, clean city, nice people — though a bit bland. Nothing is striking about Denver. I wouldn’t want to live there, but, sure, will go visit occasionally.</p><h5>Vibes</h5><p>Barnes and Noble.</p><h5>Advice</h5><ul><li><p>Splurge for an Air BnB in the city. The outskirts really be out there.</p></li><li><p>Any time you see a burrito place called “Big Mama's”, immediately stop and grab a burrito. Specifically the bacon, egg, potato burrito with the spicy sauce.</p></li><li><p>Plan to only jog half as far as you normally would.</p></li><li><p>Take an edible, head over to Meow Wolf; enjoy.</p></li></ul><div><hr></div><h2>On Philadelphia</h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!gjTM!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!gjTM!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!gjTM!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!gjTM!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!gjTM!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!gjTM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png" width="1456" height="1932" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!gjTM!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!gjTM!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!gjTM!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!gjTM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5c279b2-b393-4aca-9e0a-583b7aa1eb0b_1484x1969.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h5>Experiences</h5><p>Summer 2023 is one that I’ll never forget. 229 Bryn Mawr Avenue was rocked and rolled by the three blokes pictured above — young Nova student turned friend Matt, caddy Bag, tech worker Kram. We spent about 8 weeks renting a shitty apartment from the Villanova golf team, a 4-minute drive from Merion, where Bag worked for the summer. It was a time of workouts (everyday), hoops (often), drinking (occasionally, but deeply), shopping (poorly, though fashionably), golfing (poorly), cheesesteaks (many), and pizzas (way too many).</p><h5>Vibes</h5><p>Like a TV show.</p><h5>Advice</h5><ul><li><p>Dellassandro’s, Angelo’s — those are the only two cheesesteaks you need to try.</p></li><li><p>The pickup basketball is worse than Houston, but probably better than everywhere else.</p></li><li><p>Honestly, don’t expect anything to be open, ever. The city hates to have things open.</p></li><li><p>The Phillies do a great fireworks show.</p></li><li><p>South is a great little jazz bar downtown. 10/10 recommend for a date.</p></li><li><p>Valley Forge is a good place to walk around — just not in the rain.</p></li><li><p>The Liberty Bell is for chumps.</p></li><li><p>Walnut Bend is a great golf course.</p></li><li><p>The drive from Philly to Brooklyn for the NBA draft must be made.</p></li><li><p>Living with younger doods is a great way to motivate yourself to get back into shape.</p></li><li><p>Going to the beach for the 4th of July is the move — any beach will work.</p></li></ul><h2>On Nashville</h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!23kQ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!23kQ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!23kQ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!23kQ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!23kQ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!23kQ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png" width="1456" height="1932" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!23kQ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 424w, https://substackcdn.com/image/fetch/$s_!23kQ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 848w, https://substackcdn.com/image/fetch/$s_!23kQ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 1272w, https://substackcdn.com/image/fetch/$s_!23kQ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0a6a080-7df4-4787-8df2-2e67b92f3ae9_1484x1969.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h5>Experiences</h5><p>I spent a bit less than a week in Nashville in November 2023 but felt like I did a pretty good job of seeing what it had to offer. A few days of hanging out with old friends, getting some much-needed live music in, and generally having a great time while in between work was just what I needed.</p><h5>Vibes</h5><p>Exactly what you think it is, but slightly better.</p><h5>Advice</h5><ul><li><p>do the Broadway thang on a Monday. It’s not crowded. Day drinking is sometimes quite fun. And did I mention it’s less crowded?</p></li><li><p>Hattie B’s in the airport will be the best nashville hot chicken you will ever experience.</p></li><li><p>Luke Bryan’s is a good bar, but not as good as Tootsies.</p></li><li><p>If your friend says he is friends with an artist and that artist is playing, go watch the artist and ask them questions about why they are trying to be an artist — it is quite inspiring.</p></li><li><p>The Parthenon Museum is a waste of time, but you should go to centennial park and at least look at it.</p></li><li><p>Visit your friends more. As often as possible, in fact.</p></li></ul><div><hr></div><div class="pullquote"><p>in conclusion</p></div><div><hr></div><p>Woah! And that’s a wrap.</p><p>A busy, busy year 2023 was. Cheers to hoping 2024 will be similarily adventourous.</p><p>- Kram</p><p><a href="https://kramnotmark.substack.com/p/krams-declassified-travel-survival">Originally published on Substack</a></p></article></noscript>
