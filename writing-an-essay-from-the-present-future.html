idth="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Euks!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0712a2a-45eb-4a02-85c6-de076ac1b466_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!Euks!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0712a2a-45eb-4a02-85c6-de076ac1b466_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!Euks!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0712a2a-45eb-4a02-85c6-de076ac1b466_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!Euks!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0712a2a-45eb-4a02-85c6-de076ac1b466_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>vaguely curated thoughts. </em></p><p><em>sending this today, before the world goes officially insane. </em></p><div><hr></div><h2><strong>On Living in the Future</strong></h2><blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!D3E_!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!D3E_!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 424w, https://substackcdn.com/image/fetch/$s_!D3E_!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 848w, https://substackcdn.com/image/fetch/$s_!D3E_!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 1272w, https://substackcdn.com/image/fetch/$s_!D3E_!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!D3E_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png" width="916" height="527" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!D3E_!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 424w, https://substackcdn.com/image/fetch/$s_!D3E_!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 848w, https://substackcdn.com/image/fetch/$s_!D3E_!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 1272w, https://substackcdn.com/image/fetch/$s_!D3E_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7345c486-9fc2-47f7-bacf-fe32d6ec0e6c_916x527.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>I recently spent a night dancing inside the light at the end of the tunnel where the ephemeral was made infinite and the ethereal was made tangible.</em></p></blockquote><p>The Las Vegas Sphere can likely be seen from space. Outside, the ever-changing lights are preprogrammed to circulate a combination of visuals embodying schizophrenia. </p><p>The Sphere’s atrium is a spaceship -- open spaces with wide, unduly angles and black walls, accented by a soft blue light. Everything is new, with nary a scuff upon the floor. Inside, the performance hall is alien. The screen swallows the human perspective, generating enough movement for three pairs of eyes. </p><p>All visuals are deeply saturated, making the bright imagery bouncing across the screen unreal in the sense that it is obviously better than what exists in our limited human reality. The audio thumps. It is almost thunderous in that sound rolls from the speakers into the floor, disseminating information just as clearly through the soles of your feet as through your ear drums.</p><p>I have visited the Sistine Chapel and the Taj Mahal. I have watched The Godfather and Shawshank Redemption. I have read Atlas Shrugged and Brother Karamazov. I have listened to Mozart’s Requiem in D Minor and Led Zeppelin’s a Stairway to Heaven…</p><div class="pullquote"><p><em>The Sphere was easily the single most impressive display of art I have ever experienced.</em></p></div><p>The Sphere is something truly, truly new: a blend of cinema, concert, and gallery. The combination is reality-bending. I felt fully immersed, almost like I was inside the screen. Where I can sometimes feel lost in content by scrolling addictive reels on socials or listening to music with volume on high, The Sphere brought a depth to the experience like I had never come across. This was the metaverse promised by Oculus and Meta, without the cumbersome, reality-jarring goggles.</p><p>The storyline embedded in the show I saw (Afterlife: The End of Genesys by Anyma) accentuated the unreality of The Sphere. </p><p>Gargantuan depictions of Adam and Eve, derived from code and imbued with equal parts human and machine, traverse the screen in a story enveloping the many twin flames of existence: birth/death, creation/destruction, love/hate, fire/ice, war/peace. Each storyline is propelled by music distilled to a flowing simplicity: driving to the forefront of the senses to match a climax and falling away to the background when needed, giving the viewer a hint to search the screen for the next piece of the narrative.</p><p>It is odd that in such an alien place I felt so very human and so very proud to be a human and so very grateful to be alive in 2025. Personally, the Sphere perfectly encapsulates what I hope the future feels like and looks like. It is a physical location for a digital experience that can be shared with thousands of others people in the same room, at the same time, together. Tis something like a physicalverse; not quite an antithesis to Facebook’s rebrand to Meta, but definitely a shot across the chin to those who prognosticate that our future is bound to the sad virtual reality of wearable tech.</p><p>As I was writing this piece a friend called and asked how my trip to Las Vegas was and I responded with almost childlike enthusiasm, stating simply: “it was fucking awesome.” Period, end of sentence. “You should drop any vacations you have planned and reroute to Vegas,” I recommended to my friend, “the Sphere will make you feel something positive, I guarantee it.”</p><p>Awesome without qualification in 2025 was not what I expected from a night that mixed Las Vegas, EDM, and an apocryphal story about the genesis of humanity, yet it was and I think I might have been understating it. </p><p>And maybe The Sphere might end up becoming tacky and tasteless as time progresses, as acts move through and do not perform up to the standard of the venue. Perhaps The Sphere is ripped off and it becomes commoditized and insignificant, just a new, better movie theater and this is but a moment in time. </p><p>But that is a conversation for the future. For now? </p><p>The world needs more public artwork. Western civilization is in need of revitalization. At least for me, The Sphere is a reminder of what humanity is capable of. A look into the future: a bright, flickering, irreverent monument designed to awe, executed perfectly. </p><p>The Sphere is fucking awesome. You should check it out.</p><div><hr></div><h2>Book List 2025</h2><ul><li><p></p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!HMKZ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 424w, https://substackcdn.com/image/fetch/$s_!HMKZ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 848w, https://substackcdn.com/image/fetch/$s_!HMKZ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 1272w, https://substackcdn.com/image/fetch/$s_!HMKZ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!HMKZ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png" width="289" height="221" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!HMKZ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 424w, https://substackcdn.com/image/fetch/$s_!HMKZ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 848w, https://substackcdn.com/image/fetch/$s_!HMKZ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 1272w, https://substackcdn.com/image/fetch/$s_!HMKZ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe3afce71-8cdd-41e9-92a2-c4c5e52d7fdb_289x221.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>Shantaram</p></li><li><p>Origins of Political Order</p></li><li><p>Anna Karenina (failed to read in 2024)</p></li><li><p>Nexus</p></li><li><p>Guns Sails and Empire</p></li><li><p>Something about the fall of rome (send recs!)</p></li></ul><div><hr></div><h2><strong>Consensus!!!!!!!</strong></h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!pvD_!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!pvD_!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!pvD_!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!pvD_!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!pvD_!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!pvD_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!pvD_!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!pvD_!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!pvD_!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!pvD_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa12f08da-071b-49d4-ba8a-40d448515b4d_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>Innovators.</em></p><p><em>Early adopters.</em></p><p><em>    Early majority.</em></p><p><em>Late majority.</em></p><p><em>Laggards.</em></p><p>Consensus is a term you run across in crypto every once in a while. Quite often consensus is mentioned in the context of nodes and chain history and what the ‘truth’ is about the history such and such transactions of a certain digital ledger. </p><p>Consensus is general agreement. Not absolute agreement. But general agreement, enforced sometimes by law, other times by code, perhaps most often by vibes -- the unspoken rules of the world and such. </p><p>At the moment, blockchains are “coming to consensus” mechanisms for finance. Bitcoin is a consensus mechanism for ownership, of “who owns what fake internet rocks.” Ethereum is a consensus mechanism for businesses, saying “this is the logic that powers my app” while also being a consensus mechanism for ownership, of “who owns what fake internet asset.” Other blockchains serve other consensus mechanisms for finance somewhere within the spectrum of ownership and logic, spanning asset issuance to token trading to borrowing and lending to art sales to memecoins.</p><p>Blockhains are great because they codify consensus, enabling coordination to be created around the promises made by the code. A concept for these codified promises is called a “credible commitment.” </p><p>For instance, Bitcoin’s two credible commitments are “you own your bitcoin” and “there are 21M bitcoin.” The blockchain is the enforcing mechanism for these promises. Around these credible commitments are where “consensus” is born -- as humans can look at the promises then look at the code then look at each other and say something like, “we like the fake orange coin and we think this should be money.” </p><p>The idea of credible commitments is beautiful in that it is simple. </p><ul><li><p>For instance, Uniswap is a set of smart contracts that commits to finding users the best price to swap assets onchain, allowing 24/7/365 trading that doesn’t require a stock exchange. </p></li><li><p>Aave is another set of contracts that commit to liquidating a borrower if they are under-collateralized, enabling permissionless borrowing and lending that doesn’t require a bank. </p></li><li><p>Story commits to storing IP onchain and tracking it, without a lawyer. </p></li><li><p>Maker says that “Dai can be used by anyone, anywhere, anytime,” enabling dollars to be used without a government.</p></li></ul><p>Blockchains are probably the best coordination device since the US Constitution.</p><p>The code is laid, the commitments are proffered -- what’s left is for humanity to coordinate around these consensus layers (the chain itself and the rallying in and of itself).</p><p>This brings me to mainstream adoption. I think “mainstream adoption” is misunderstood by pretty much everyone — both people who work in crypto, people who report on crypto, the people who hate crypto, etc. </p><p>“Is crypto going mainstream?” is a paraphrased question-as-headline I see every once in a while in Bloomberg (the journalist usually says “no, it’s a ponzi and will die”).</p><p>“How do we onboard mainstram users?” is a question I hear on many a bad twitter space or crypto podcast, as breathless BD bros pontificate on creating a better UX, while speaking about how gas will be a one-click experience or how the chains will be abstracted (it is one click, they are abstracted: interop is solved).</p><p>Both questions miss the point.</p><p>Mainstream adoption is not about getting people to use the <em><strong>tools</strong></em> of the crypto trade -- to store value in BTC, to earn yield by staking ETH, to buy art on an L2, to pay friends with a stablecoin from Phantom wallet. We speak in crypto about onboarding the next billion users, as if the next billion users will make the tech we use mainstream. Instead, the next billion users will bring the space to a grand total of 1,000,500,000 users -- which accounts for less than 15% of the world, a far cry from mainstream.</p><p>No. No. No. Mainstream adoption is about getting people to coordinate around the consensus of the chains themselves. To care about the credible commitments being promised by the code. </p><p>Mainstream adoption is a narrative problem, not a tech problem.</p><p>Generallly, mainstream is just a euphemism social <em><strong>consensus</strong></em> around what things are ok to discuss at the dinner table, purchase at the store, bring up in small talk. Mainstream is a safe place, the veritable discussion of weather or sports. In the end, the only thing that's popular is what's been popular for a while. Most people are living 50 years in the past. What we call 'mainstream’ is just a slow-moving, rolling tide of things that were once new but now are safe, digestible, and, therefore, completely outdated. </p><p>For crypto, mainstream adoption will only come when people come to social consensus that the credible commitments of blockchains are so obvious and powerful and coordinated around that they are okay to discuss at the dinner table. Mainstream adoption is not a number of users or value secured or amount of assets tokenized -- mainstream adoption is small talk. It is humanity coming to agreement about liking the promises of blockchains, those beautiful consensus mechanisms that enforce credible commitments.</p><div class="pullquote"><p><em>The truth is mainstream isn’t about the use of crypto, it’s about the belief in the promises codifed by blockchains. People will only adopt technology when they believe in the commitments it offers, when they see its consensus mechanisms make promises that their current provider can’t keep -- like banks that stay open all day and night, while offering better rates in assets that cannot be inflated.</em></p></div><p>The consensus mechanisms that blockchains use are powerful, but the collective agreement around them hasn’t yet materialized on a broad enough scale. Crypto has failed to promise big enough, promise better, and make its <em>credible commitments</em> clearer than the legacy systems people already know—like banks, credit cards, and insurance. Crypto’s promises need to stand out as a better alternative, not just in theory, but in practice. The consensus around these promises has to be clear, simple, and compelling.</p><p>Crypto has forgotten to promise big and promise better. Make the credible commitments clearer than what exists in legacy finance. People will adopt crypto when they see that these promises—of ownership, transparency, fairness, and immutability—are ones worth keeping. </p><p>Until these promises are seen as clear, relatable, and better than the systems we’ve had for decades, crypto will remain just a niche industry of financial consensus mechanisms. The tech itself is capable. The potential is there. But mainstream adoption requires social consensus that the promises made are worth coordinating around -- transforming from consensus mechanisms to coordination engines through the approval of a bunch of humans.</p><p>Mainstream adoption, in the end, is not about solving gas fees, improving UX, or scaling blockchain to the moon. It's about the human story we tell ourselves about why we should trust crypto rails. It’s about social consensus, about humanity agreeing at deep cultural consensus layer that these commitments—these promises— embedded in code ar,e worth coordinating around. <strong>That’s the consensus that will drive crypto to the mainstream.</strong></p><div><hr></div><h2><strong>On Living in the Past</strong></h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!UYKA!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!UYKA!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 424w, https://substackcdn.com/image/fetch/$s_!UYKA!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 848w, https://substackcdn.com/image/fetch/$s_!UYKA!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 1272w, https://substackcdn.com/image/fetch/$s_!UYKA!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!UYKA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png" width="968" height="528" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!UYKA!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 424w, https://substackcdn.com/image/fetch/$s_!UYKA!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 848w, https://substackcdn.com/image/fetch/$s_!UYKA!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 1272w, https://substackcdn.com/image/fetch/$s_!UYKA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F65f1b1cd-3c40-4d5c-aed1-9a788aad02be_968x528.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Grand, god-shaped rock.</p><p>Dirt. Sun. Wind. Joshua Trees.</p><p>Living silence. Beautiful erosion.</p><p>The desert beckons.</p><div><hr></div><h2><strong>Review: The Morning Show</strong></h2><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!TuqF!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 424w, https://substackcdn.com/image/fetch/$s_!TuqF!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 848w, https://substackcdn.com/image/fetch/$s_!TuqF!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 1272w, https://substackcdn.com/image/fetch/$s_!TuqF!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!TuqF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png" width="327" height="196" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!TuqF!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 424w, https://substackcdn.com/image/fetch/$s_!TuqF!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 848w, https://substackcdn.com/image/fetch/$s_!TuqF!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 1272w, https://substackcdn.com/image/fetch/$s_!TuqF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11ab794b-83ad-4e70-b294-dea0447ee7f4_327x196.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>I have watched three seasons of The Morning Show, the flagship TV program produced by Apple+, starring Jennifer Anniston, Reese Witherspoon, Steve Carrel, and John Hamm.</p><p>The Morning Show was ideated in 2016/2017, shot in 2019, and released between 2020 and 2023. Season one explores the “me-too” movement through the lens of Steve Carrell’s character Mitch Kessler, an on-air personality accused (and guilty) of sexual misconduct in the workplace based on the real-life story of Matt Lauer. Season two is a COVID-riddled plot, attempting to comment on lockdowns and legacy media moving into a new decade of streaming. Season three, conducts a trial on race and tech and January 6th and Ukraine, pitting the board against on-air talent, a traditional media CEO against a tech mogul. The January 6th and Ukraine subplots lack any real substance, outside of popping up mid-episode as jump scares, but they exist.</p><p>Everything that led to The Morning Show getting greenlit -- a hunger for streaming content, Carrell and Aniston starpower, a groundswell of support for politically correct storylines -- makes it feel off in 2024. Streaming is no longer cutting edge, it is categorically oversaturated. Carrell and Aniston are decades out from Friends and The Office, not able to connect on screen in a way that feels real. Witherspoon is from a bygone romcom era. The “me too” moment, covid, and race plots -- all worthy topics ripe for exploration and hard conversations -- feel pedantic rather than timely. Like The Morning Show is more worried about teaching the viewer a lesson than entertaining us. This was a show that needed to happen in 2015 when it could have reached less jaded viewers.</p><p>Now, in 2024, a show about morning TV feels quaint -- at least 5 years too late -- and the fictitious world takes place in barely wilder than the world we live in. For instance, season three features a tech CEO who sends rockets to the moon and wants to buy a media company - which is less crazy than Elon is in real life. Our lived experiences more ficticious than fiction.</p><p>The entire show is just too on the nose. They created a synthetic reality too similar to the real world, lessening the magic of TV and creating a sense of unease; scripted deja vu that does nothing to solve the problems of our society outside reminding us how broken a world we live in. </p><p>Yet I watched all three seasons, almost like a car wreck. It was something that I could just not take my eyes away from.</p><p>The most salacious comment The Morning Show makes about the world is its existence itself. The Morning Show swung too far and arrived too late. A pendulum turned into a wrecking ball, transforming a show meant to entertain into an epitaph for the 2010s. </p><p>I understand what The Morning Show was trying to do -- it was trying to be the de facto statement for the corruption found at the core of mass media. But it failed because it tried to do too much, without giving any topics enough room to breathe, without giving viewers the ability to come to any conclusions themselves. Where they went for Succession, they instead got Connor Roy. Where they went for Sorkin and West Wing -- The Morning Show is more Black Mirror commentary on the state of Apple. </p><blockquote><p>“Gutenberg gave us a lot of bibles, but he made the median bible uglier than it had ever been.” -- <a href="https://archive.is/p44mV#selection-599.38-603.135" target="_blank" rel="noopener noreferrer">Bryne</a></p></blockquote><p>The Morning Show is a synthetic show about a synthetic show. And it missed the mark in that it reminded the viewer of this haunting experience of the last decade instead of providing entertianment. It did not save the viewer and transport them somewhere new. It drowned the viewer, bringing them back to the worst of our past while shouting about how terrible it was to have experienced such a thing. Everything is bad, the show yelled. And there is nothing you can do about it. Except wallow. The Morning Show, like Jennifer Aniston’s Alex Levy character, is broken by the world of its own creation. A character study of itself, without knowing it.</p><p>10/10 recommend.</p><div><hr></div><h2><strong>On 2025 Sunglasses Predictions</strong></h2><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!8H7W!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 424w, https://substackcdn.com/image/fetch/$s_!8H7W!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 848w, https://substackcdn.com/image/fetch/$s_!8H7W!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 1272w, https://substackcdn.com/image/fetch/$s_!8H7W!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!8H7W!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png" width="451" height="206" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!8H7W!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 424w, https://substackcdn.com/image/fetch/$s_!8H7W!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 848w, https://substackcdn.com/image/fetch/$s_!8H7W!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 1272w, https://substackcdn.com/image/fetch/$s_!8H7W!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6b331453-c252-4208-9cb9-099a43dbad41_451x206.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>In: rounded squares, metal frames, colorful lenses</p><p>Out: cat-eye frames, ray bans, clear frames</p><div><hr></div><h2><strong>Five Las Vegas Thoughts</strong></h2><ol><li><p></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!GxJ4!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!GxJ4!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 424w, https://substackcdn.com/image/fetch/$s_!GxJ4!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 848w, https://substackcdn.com/image/fetch/$s_!GxJ4!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 1272w, https://substackcdn.com/image/fetch/$s_!GxJ4!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!GxJ4!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png" width="640" height="487" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!GxJ4!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 424w, https://substackcdn.com/image/fetch/$s_!GxJ4!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 848w, https://substackcdn.com/image/fetch/$s_!GxJ4!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 1272w, https://substackcdn.com/image/fetch/$s_!GxJ4!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F624cf7d8-7abb-4214-92c5-89a4e768b7c2_640x487.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Cigarette smoke is the perfect ambiance for Las Vegas. The idea of smoking normally fills me with abject disgust unless I’m in Europe, wherein a dart after a beer is a necessity. I believe that I must add a Las Vegas addendum here in that I do not want to smoke a ciggy while in Vegas, but I want to be around other people smoking as often as possible. Bonus points if the smoker is geriatric, glassy-eyed at a slots machine. Or awake after 2 am. </p></li><li><p>Every city should be trying to emulate The Strip. It is cleaner than most downtowns. The shops are a delight. The airport is just a twenty-minute drive away. And all because someone made gambling legal in the desert. More please. I guess gambling should be legal everywhere. Let the adults play the game of chance and let the house take their cut. Casinos are wonderful -- decent food, funny people watching, tacky design choices. If gambling is what brings casinos to more cities, then I think the tradeoff might be worth it. I want more of the Las Vegas thing, not less. </p></li><li><p>Ranking of casinos based only on a single afternoon walking around five of them and not betting but just looking around at shops and dining options: Venetian, Caesars, Ballagio, Cosmopolitan, Flamingo.</p></li><li><p>In Caesar’s Palace there are four stops you must make. First, there is a robot that sells cookie cups filled with Morrocan milk and it costs $8. You can order the cookie from an application on your phone and it’s just amazing to live in the future. Second is not Neptune’s Fountain, which is sad in terms of both view and smell. Second is the food court next to the cookie machine because in the food court are restaurants owned by Bobby Flay, the Fondant Guy from the Bakery, Guy Fieri, and Skip Bayless’ brother. The reason you should go to the food court is to ponder: think about how all one has to do in life to get a bad torta pop-up restaurant in Las Vegas is to have blood relations with one of the most annooying people in the world (Skip Bayless). The third stop on your trip to Caesar’s should be Atlantic City and the show it puts on at 5 pm (probably at the top of each hour but I can only confirm that it happens at 5 pm). Atlantic City is the opposite of The Sphere. A group of humanoid robots built in the 90s sing with limp mouths that move slightly off to the words billowing out from speakers in the ceilings. Bright fluorescent lights stream from the plastic pedestal of an attraction in the center of the room, leaving the viewers awash in turquoise-blue lighting. The fourth stop is each and every Ferragamo store you can find, as that place has oh so very much style.</p></li><li><p>Slot machines are dumb. As a society, we should cancel them.</p></li></ol><div><hr></div><h2><strong>The President Launched a Memecoin</strong></h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!u4Xs!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!u4Xs!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!u4Xs!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!u4Xs!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!u4Xs!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!u4Xs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!u4Xs!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!u4Xs!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!u4Xs!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!u4Xs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff3e0efaa-38e8-4beb-9bb3-9722a53c8850_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>There is a new Captain America movie coming out named “Brave New World” and I do not think very many people understand how ironic this is. </em></p><p>Life goes on. And so it goes. A few thoughts that get longer each time. </p><p>With Trump and the election, I think the main thing here is to talk about how he ran a campaign that took advantage of the current state of the internet. He is the president our tiktok-addled brains deserve. </p><p>In 2024, attention is fragmented and trust is found within our own social feeds, weakening the power of mass media quite substantially. As Kyla Scanlon wrote recently, “Alternative media has created sealed ecosystems. As we saw, Trump supporters are more likely to get their news from social media, heavily influenced by the collapse in local news and the inflammatory sources that filled the vacuum. The traditional methods - press releases, policy speeches, even local news coverage - often just bounce off these bubbles. It's not just that people don't listen - they can't.</p><p>Trump played not with the media, but with the tech leaders that own the media — a notable distinction. One crazy stat is Elon versus other billionaires in terms of raw influence. “According to Forbes, more than 50 other billionaires also threw their weight behind Trump. So far so good for the preferred narrative. But here’s the twist: even more billionaires — 83 to be precise — supported the Democratic nominee. Kamala had 60 percent more billionaire backers than Donald Trump did,” writes <a href="https://musaalgharbi.substack.com/p/a-graveyard-of-bad-election-narratives" target="_blank" rel="noopener noreferrer">Sura</a>. Elon is more powerful than the combined effort of 33 other billionaires. </p><p>Overall, Trump’s entire presence is built for socials -- his tweets are bangers, his statements viral, his expressions great for video (as shown by his appearance on Rogan). </p><p>It is apparent we're dealing with information overload. Attention spans fractured by social media, deep distrust in traditional information sources, algorithm-driven echo chambers, and a very apparent collapse of shared reality. It should be no surprise that this campaign worked — for better, for worse. </p><div><hr></div><h2>places i want to visit in 2025</h2><blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!ze-Q!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!ze-Q!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 424w, https://substackcdn.com/image/fetch/$s_!ze-Q!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 848w, https://substackcdn.com/image/fetch/$s_!ze-Q!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 1272w, https://substackcdn.com/image/fetch/$s_!ze-Q!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!ze-Q!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png" width="668" height="668" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!ze-Q!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 424w, https://substackcdn.com/image/fetch/$s_!ze-Q!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 848w, https://substackcdn.com/image/fetch/$s_!ze-Q!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 1272w, https://substackcdn.com/image/fetch/$s_!ze-Q!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F06fce8b5-5fdc-4c9f-9ae0-55a0eed49687_668x668.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>greece</p><p>egypt</p><p>miami</p></blockquote><div><hr></div><h2>Political Animal</h2><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!XlUJ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!XlUJ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!XlUJ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!XlUJ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!XlUJ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!XlUJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!XlUJ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!XlUJ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!XlUJ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!XlUJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc7f5e89e-115d-4540-8d79-152ea50100a9_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>To end here, I think the DOGE stuff is interesting? Maybe. Could be utterly dystopian. But the optimistic view is that DOGE will cut government spending, cut bloat, cut red tape, and ship infra upgrades. There will likely be terrible things to come out of DOGE, for sure. For example, Elon favoring Tesla, SpaceX, and Twitter through policy feels like a pretty obvious conflict of interest that will occur. There will be corruption and a lot of information will be shared that is likely untrue thanks to tech bro algo control on Twitter. </p><p>However, directionally speaking, I think this administration is heading in the direction of building things. I google searched for “how to work for DOGE” after the announcement. I had not for a single second considered working for the government before this. Say what you will about Elon, but the man is an exceptional coordinator. Trump letting Elon cook is like putting Hank Rearden in charge of the railroad commission rather than sending him to Galt’s Gulch -- the motor of the world housed in the government, rather than turned off. </p><p>I don’t think DOGE has a chance to be our generation’s version of the Manhattan Project, but I also looked up details on the Manhattan Project when DOGE was announced, soooo. </p><p>Says <a href="https://www.notboring.co/p/the-trump-bubble" target="_blank" rel="noopener noreferrer">Packy</a>, “Whoever you voted for and however you feel about the results of the election, there is now a clear choice: you can spend your time wallowing and miss out on what may be the greatest opportunity to build in America since the Second Industrial Revolution, or you can get to work and build.” America has the chance to do something special. </p><p>I just hope the simulation doesn’t get into the way too much. </p><div><hr></div><p>- kram</p><p><a href="https://kramnotmark.substack.com/p/an-essay-from-the-present-future">Originally published on Substack</a></p></article></noscript>
