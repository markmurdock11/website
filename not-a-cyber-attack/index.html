    'amtrak-1113':'Transport','coordination-1117':'Public claims','blackout-1117':'Public claims'
  };
  function sector(r) {
    if (sectors.has(r.sector)) return r.sector;
    if (known[r.id]) return known[r.id];
    const org = String(r.org || '').toLowerCase();
    const rules = [
      ['Aviation',/airline|airport|aviation/],['Healthcare',/hospital|medical cent|health system|health service/],
      ['Finance',/bank|credit union|brokerage|stock exchange/],['Education',/university|college|school district/],
      ['Transport',/railway|railroad|rail transit|transit authority/],['Energy',/energy|electric utility|power grid/],
      ['Government',/ministry|department of|government/],['Sport',/hockey|sports league|football club/]
    ];
    return rules.find(([,pattern]) => pattern.test(org))?.[0] || 'Other';
  }

  const outlets = [
    {name:'Reuters Cybersecurity',url:'https://www.reuters.com/technology/cybersecurity/',kind:'News wire',description:'Company statements and reported operational impact.'},
    {name:'BleepingComputer',url:'https://www.bleepingcomputer.com/news/security/',kind:'Specialist press',description:'Breach reporting, researcher findings and vendor responses.'},
    {name:'The Record',url:'https://therecord.media/',kind:'Newsroom',description:'Government, cybercrime and critical-infrastructure reporting.'},
    {name:'Microsoft 365 Status',url:'https://x.com/MSFT365Status',kind:'Operator on X',description:'Microsoft’s public updates on selected service incidents.'},
    {name:'Cloudflare Status',url:'https://www.cloudflarestatus.com/',kind:'Operator',description:'Service-specific disruption, maintenance and recovery times.'},
    {name:'SEC EDGAR',url:'https://www.sec.gov/edgar/search/',kind:'Company filings',description:'Search a company’s Form 8-K filings for Item 1.05, material cybersecurity incidents.'}
  ];

  const text = value => typeof value === 'string' && value.trim().length > 0;
  const operationalImpacts = new Set(['limited','service','multiservice','systemwide']);
  function citation(value) {
    if (!text(value)) return '';
    try {
      const u = new URL(value);
      return ['https:','http:'].includes(u.protocol) && !u.username && !u.password ? u.href : '';
    } catch { return ''; }
  }
  function denial(r) {
    return r?.denial || null;
  }
  function eligible(r, asOf) {
    if (!r || r.verifiedOutageDenial !== true || !text(r.id) || !text(r.org) || !text(r.title) ||
        !operationalImpacts.has(r.impact) || !Array.isArray(r.sources)) return false;
    const d = denial(r);
    if (!d || !['explicit','qualified'].includes(d.type) || !text(d.speaker) ||
        !(text(d.quote) || text(d.paraphrase)) || !text(d.sourceName) ||
        !['statement','report'].includes(d.basis)) return false;
    const outageTime = Date.parse(r.date), denialTime = Date.parse(d.when);
    if (!Number.isFinite(asOf) || !Number.isFinite(outageTime) || !Number.isFinite(denialTime) ||
        outageTime > asOf || denialTime > asOf) return false;
    const link = citation(d.sourceUrl);
    return !!link && r.sources.some(s=>s && text(s.name) && citation(s.url) === link);
  }
  function clock(records, now) {
    if (!Number.isFinite(now)) return null;
    const entries = records.filter(record=>eligible(record,now)).map(record=>({record,d:denial(record)})).filter(({d})=>
      d?.type === 'explicit' && d.when && Number.isFinite(Date.parse(d.when)) && Date.parse(d.when)<=now);
    if (!entries.length) return null;
    const newestDay = entries.map(({d})=>new Date(d.when).toISOString().slice(0,10)).sort().pop();
    const sameDay = entries.filter(({d})=>new Date(d.when).toISOString().startsWith(newestDay));
    const dayOnly = sameDay.find(({d})=>d.when.length === 10);
    const {record,d} = dayOnly || sameDay.sort((a,b)=>Date.parse(b.d.when)-Date.parse(a.d.when))[0];
    const when = d.when, stamp = Date.parse(when);
    const minutes = Math.floor((now-stamp)/60000);

      : d.sourceName+' · '+dayFormat.format(stamp)+' · '+timeFormat.format(stamp)+' UTC';
    return {record,when,title,detail,sourceName:d.sourceName,sourceUrl:d.sourceUrl,
      value:dayOnly?dayFormat.format(stamp):minutes.toLocaleString('en-US'),unit:dayOnly?'':'minutes',basis:d.basis||'report'};
  }
  function publisher(source) {
    const kind = String(source.kind || '').toLowerCase();
    if (!/news|journalis|press|reporting|wire/.test(kind) || /social|operator|official|status/.test(kind)) return '';
    const name = String(source.name || '').trim().toLowerCase();
    if (!name) return '';
    if (/\bnyt\b|new york times/.test(name)) return 'The New York Times';
    if (/reuters/.test(name)) return 'Reuters';
    if (/associated press|\bap\b/.test(name)) return 'Associated Press';
    return name;
  }
  function trend(records, asOf) {
    const end = Date.parse(asOf);
    if (!Number.isFinite(end)) return [];
    const lastDay = Math.floor(end/dayMs);
    const rows = [];
    for (const record of records) {
      const d = denial(record);
      if (!eligible(record,end)) continue;
      const desks = new Map();
      let latest = -Infinity;
      for (const s of record.sources || []) {
        const desk = publisher(s), at = Date.parse(s.date);
        if (!desk || !Number.isFinite(at) || at>end) continue;
        const age = lastDay - Math.floor(at/dayMs);
        if (age<0 || age>2) continue;
        desks.set(desk,Math.max(desks.get(desk)||0,3-age));
        latest = Math.max(latest,at);
      }
      if (!desks.size) continue;
      const score = [...desks.values()].reduce((sum,weight)=>sum+weight,0);
      rows.push({record,score,publishers:desks.size,latest:new Date(latest).toISOString(),classification:d.type==='explicit'?'Explicit denial':'No indication'});
    }
    return rows.sort((a,b)=>b.score-a.score || b.publishers-a.publishers || b.latest.localeCompare(a.latest) || a.record.org.localeCompare(b.record.org));
  }
  window.DeskMetrics = {sector,clock,trend,outlets,denial,eligible};
})();

function recentDevelopments(records,asOf){
 const cutoff=Date.parse(asOf);
 if(!Number.isFinite(cutoff))return [];
 const start=Date.parse(new Date(cutoff).toISOString().slice(0,10))-2*86400000;
 const items=[];
 for(const record of records){
  if(!record.sources?.some(s=>safe(s.url)))continue;
  let latest=null;
  const seen=new Set();
  for(const event of [...(record.history||[])].sort((a,b)=>Date.parse(a.date)-Date.parse(b.date))){
   const text=String(event.text||event.detail||'').trim(),time=Date.parse(event.date);
   if(!text||!Number.isFinite(time)||time>cutoff||/published additional coverage\.?$/i.test(text))continue;
   if(seen.has(text))continue;
   seen.add(text);
   if(time<start)continue;
   if(!latest||time>=latest.time)latest={record,text,time,date:event.date,url:safe(event.url),precise:String(event.date).includes('T')};
  }
  if(latest)items.push(latest);
 }
 return items.sort((a,b)=>b.time-a.time||Number(b.precise)-Number(a.precise)||a.record.org.localeCompare(b.record.org));
}

function packRows(items,w,h){
 const total=items.reduce((n,i)=>n+i.weight,0);
 if(!total||w<=0||h<=0)return [];
 const left=items.map(i=>({...i,area:i.weight/total*w*h})).sort((a,b)=>b.area-a.area||a.order-b.order);
 const out=[];let x=0,y=0,rw=w,rh=h;
 const worst=(row,l,sum)=>Math.max(l*l*row[0].area/(sum*sum),sum*sum/(l*l*row[row.length-1].area));
 while(left.length){
  const side=Math.min(rw,rh),row=[left.shift()];let area=row[0].area;
  while(left.length&&worst([...row,left[0]],side,area+left[0].area)<=worst(row,side,area)){const add=left.shift();row.push(add);area+=add.area}
  const vertical=rw>=rh,thick=area/side;let position=vertical?y:x;
  row.forEach((item,j)=>{
   const size=j===row.length-1?(vertical?y+rh:x+rw)-position:item.area/thick;
   out.push({...item,x:vertical?x:position,y:vertical?position:y,w:vertical?thick:size,h:vertical?size:thick});
   position+=size;
  });
  if(vertical){x+=thick;rw-=thick}else{y+=thick;rh-=thick}
 }
 return out;
}
// Pick a proportional packing that keeps marker names readable at this viewport.
function unpack(items,w,h){
 let best=[],lowest=Infinity;
 for(const scale of [.48,.62,.72,.88,1,1.2,1.5,1.8]){
  const cells=packRows(items,w*scale,h).map(p=>({...p,x:p.x/scale,w:p.w/scale}));
  const loss=cells.reduce((sum,p)=>sum+3*Math.max(0,58-p.w)**2+3*Math.max(0,34-p.h)**2+Math.log(p.w/p.h/1.5)**2,0);
  if(loss<lowest){best=cells;lowest=loss}
 }
 return best;
}

 if(view==='case'||view==='development'){const r=data.records.find(x=>x.id===id);if(!r){$('overlay').close();return}label=view==='development'?'Latest development':'Incident record';html=caseContent(r,view==='development'&&developments.find(item=>item.record.id===id))}
 else if(view==='developments'){label='Signal desk';html='<h2 id="dialog-title">Latest developments</h2><p class="develop-when">Edition · '+esc(stamp(data.asOf,true))+'</p><p class="lede">The latest timeline update for each incident over the last three UTC dates. Reports with a published time appear first within each date.</p><div class="develop-list">'+(developments.map(developCard).join('')||para('No dated updates in this window.'))+'</div>'}
 else if(view==='sector'){label='Industry map';html='<h2 id="dialog-title">'+esc(id)+'</h2>'+recordList(ordered(groups.get(id)||[]))}
 else if(view==='outlet'){const o=metrics.outlets[id];if(!o)return;label='Breaking news desk';html='<h2 id="dialog-title">'+esc(o.name)+'</h2><span class="meta">'+esc(o.kind)+'</span><p class="lede">'+esc(o.description)+'</p><p class="big-link">'+external('Open '+o.name,o.url)+'</p>'}
 else if(view==='outlets'){label='Source directory';html='<h2 id="dialog-title">Breaking news desks</h2>'+metrics.outlets.map((o,i)=>outletButton(o,i,true)).join('')}
 else if(view==='sources'){label='Research desk';html='<h2 id="dialog-title">Case index</h2>'+[...groups].map(([g,recs])=>sections(g,'<div>'+recordList(ordered(recs))+'</div>')).join('')}
 else if(view==='method'){label='Map key';html='<h2 id="dialog-title">Reading the industry map</h2><p class="lede">Each tile is a documented outage with a public statement about a possible cyberattack. Larger tiles show wider disruption within each industry.</p>'+sections('Latest developments',para('A white corner marks a case in the latest developments strip. Hover or focus an update to locate it on the map.'))+sections('What the colors mean','<ul class="method-list">'+Object.keys(names).map(k=>'<li><strong class="signal-label t-'+k+'">'+sig(k)+esc(names[k])+'</strong>'+para(descriptions[k])+'</li>').join('')+'</ul>')+sections('Denials and timing',para('The clock starts at the latest dated explicit denial in this edition. A preliminary “no indication” statement does not reset it. Report times are labeled when the speaker’s original time is unknown.'))}
 else if(view==='trends'){label='Signal desk';html='<h2 id="dialog-title">Trending denials</h2><p class="lede">Ranked by newsroom coverage over the latest three UTC dates in this edition.</p>'+trendRows(metrics.trend(visible,data.asOf))+sections('How coverage is ranked',para('A newsroom contributes three points for coverage on the latest date, two the day before, or one the day before that. Each newsroom counts once per case, using its most recent report. Syndicated copies count together.'))+sections('Coverage through',para(stamp(data.asOf,true)))}
 else{label='Signal desk';html=statusContent()}
 $('back').hidden=route.length<2;$('dialog-label').textContent=label;$('dialog-body').innerHTML=html;
}
function openView(view,id){
 const d=$('overlay');if(view==='clock'){if(!currentClock)return;view='case';id=currentClock.record.id}
 if(!d.open){returnTo=document.activeElement;route=[]}route.push({view,id});renderDialog();if(!d.open)d.showModal();d.scrollTop=0;$('close').focus({preventScroll:true});
}
document.addEventListener('click',e=>{
 const b=e.target.closest?.('button');if(!b)return;
 if(b.id==='close')$('overlay').close();
 else if(b.id==='back'){if(route.length>1){route.pop();renderDialog();$('overlay').scrollTop=0;($('back').hidden?$('close'):$('back')).focus()}}
 else if(b.dataset.case)openView('case',b.dataset.case);
 else if(b.dataset.development)openView('development',b.dataset.development);
 else if(b.dataset.sector)openView('sector',b.dataset.sector);
 else if(b.dataset.outlet!=null)openView('outlet',Number(b.dataset.outlet));
 else if(b.dataset.denialFilter!==undefined&&['','explicit','qualified'].includes(b.dataset.denialFilter)){
  selected=b.dataset.denialFilter;drawEdition();
  $('legend').querySelectorAll('[data-denial-filter]').forEach(el=>{if(el.dataset.denialFilter===selected)el.focus({preventScroll:true})});
 }
 else if(b.dataset.view)openView(b.dataset.view);
});
function spotlight(id){
 $('board').querySelectorAll('.cell').forEach(b=>{
  const match=id&&(b.dataset.case===id||(b.dataset.hiddenFeatured&&JSON.parse(b.dataset.hiddenFeatured).includes(id)));
  b.classList.toggle('spotlit',!!match);
 });
}
for(const [enter,leave] of [['pointerover','pointerout'],['focusin','focusout']]){
 $('develop-grid').addEventListener(enter,e=>spotlight(e.target.closest?.('[data-development]')?.dataset.development));
 $('develop-grid').addEventListener(leave,e=>{if(!e.relatedTarget||!e.currentTarget.contains(e.relatedTarget))spotlight('')});
}
$('overlay').addEventListener('click',e=>{if(e.target!==e.currentTarget)return;const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('overlay').close()});
$('overlay').addEventListener('close',()=>{route=[];if(returnTo?.isConnected)returnTo.focus({preventScroll:true});returnTo=null});
function drawEdition(){
 visible=selected?data.records.filter(r=>r.denial.type===selected):data.records;
 groups=new Map();
 for(const r of visible){const name=groupName(r);if(!groups.has(name))groups.set(name,[]);groups.get(name).push(r)}
 groups=new Map([...groups].sort(([a],[b])=>a.localeCompare(b)));
 drawClock();drawTrends();drawLegend();drawDevelopments();renderBoard();drawStatus();
 $('window').textContent=data.start&&data.asOf?stamp(data.start)+' – '+stamp(data.asOf):'';
 if(route.length)renderDialog();
}
function updateSituation(next){
 if(next?.scope!=='outage-denials-v1'||!Array.isArray(next.records))return;
 const cutoff=Math.min(Date.now(),Date.parse(next.asOf));
 data={...next,records:next.records.filter(r=>metrics.eligible(r,cutoff))};
 window.SITUATION=data;status={...(next.sync||{})};drawEdition();
}
window.updateSituation=updateSituation;
window.setSituationStatus=patch=>{if(patch&&typeof patch==='object')Object.assign(status,patch);drawStatus();if(route.at(-1)?.view==='status')renderDialog()};
window.openSituationStatus=()=>openView('status');
$('outlets').innerHTML=(metrics.outlets||[]).slice(0,4).map((o,i)=>outletButton(o,i,false)).join('');
updateSituation(JSON.parse($('snapshot').textContent));
let queued=false;
const resize=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;renderBoard()})};
if('ResizeObserver' in window)new ResizeObserver(resize).observe($('board'));else window.addEventListener('resize',resize);
setInterval(()=>{if(!document.hidden)drawClock()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)drawClock()});
})();
</script>
<script>(() => {
  'use strict';
  // The website publisher writes a public, sanitized JSON edition beside this file.
  // A standalone download always opens the embedded edition without credentials.
  const tiers = new Set(['confirmed','indications','unresolved','rumor','ruled-out']);
  const baseline = window.SITUATION;
  const dateValue = value => typeof value === 'string' ? Date.parse(value) : NaN;
  const textField = value => typeof value === 'string' && value.trim().length > 0;
  const sourceLink = value => {
    try {
      const u = new URL(value);
      return ['https:','http:'].includes(u.protocol) && !u.username && !u.password;
    } catch { return false; }
  };
  const dateOkay = value => Number.isFinite(dateValue(value)) && dateValue(value) <= Date.now() + 5 * 60_000;
  function validEdition(edition) {
    if (!edition || edition.scope !== 'outage-denials-v1' || edition.start !== baseline.start || !dateOkay(edition.asOf) ||
        dateValue(edition.asOf) < dateValue(window.SITUATION.asOf) ||
        !Array.isArray(edition.records) || !edition.records.length) return false;
    const ids = new Set();
    return edition.records.every(r => {
      if (!r || !window.DeskMetrics.eligible(r, dateValue(edition.asOf)) ||
          !textField(r.id) || ids.has(r.id) || !textField(r.org) || !textField(r.title) ||
          !dateOkay(r.date) || dateValue(r.date) < dateValue(baseline.start) || !tiers.has(r.tier) ||
          !Array.isArray(r.sources) || !r.sources.length || !r.sources.every(s => s && textField(s.name) && sourceLink(s.url)) ||
          (r.history != null && (!Array.isArray(r.history) || !r.history.every(h => h && dateOkay(h.date) && textField(h.text))))) return false;
      ids.add(r.id); return true;
    });
  }
  if (!baseline || !['https:','http:'].includes(location.protocol)) return;
  const interval = 5 * 60_000;
  let loading = false, lastAttempt = 0, hadFeed = false;
  async function check() {
    if (loading || document.hidden || Date.now() - lastAttempt < interval) return;
    lastAttempt = Date.now(); loading = true;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const publisher = location.hostname === 'not-a-cyber-attack.markmurdock11.chatgpt.site'
        ? 'https://kram.bio/not-a-cyber-attack/situation-feed.json' : new URL('situation-feed.json', location.href);
      const res = await fetch(publisher, {
        cache:'no-store', credentials:'omit', redirect:'error', signal:ctl.signal, headers:{Accept:'application/json'}
      });
      if (!res.ok) throw Error('No published edition available.');
      const next = await res.json();
      if (!validEdition(next)) throw Error('This feed did not contain a valid current edition.');
      if (JSON.stringify(next) !== JSON.stringify(window.SITUATION)) window.updateSituation(next);
      hadFeed = true;
      window.setSituationStatus({deliveryNote:next.sync?.lastExportAt ? 'The website has read an export from the hourly String feed.' : 'Showing the source-reviewed edition. An hourly export will carry its own timestamp when delivered.'});
    } catch {
      window.setSituationStatus({deliveryNote:hadFeed?'The latest website check failed. The last readable edition is still displayed.':'The website feed is unavailable. The saved research edition is displayed.'});
    } finally { clearTimeout(timer); loading = false; }
  }
  check();
  setInterval(check,interval);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
})();
</script>
