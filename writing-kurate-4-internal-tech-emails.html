ing="lazy" decoding="async"></source></picture></div></a></figure></div><ul><li><p><a href="https://files.techemails.com/?q=zuckerberg&amp;picks=1" target="_blank" rel="noopener noreferrer">ALL of Mark Zuckerberg’s Strategy Documents.</a></p><ul><li><p>IF THERE IS ONE THING EVERY FOUNDER OR STORYTELLER SHOULD READ, IT IS THIS. ZUCK’S WRITING IS AMAZING – SIMPLE, DIRECT, BUT ALSO COMPLEX AND WHOLE.</p></li></ul></li></ul><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!3Lxg!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!3Lxg!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 424w, https://substackcdn.com/image/fetch/$s_!3Lxg!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 848w, https://substackcdn.com/image/fetch/$s_!3Lxg!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 1272w, https://substackcdn.com/image/fetch/$s_!3Lxg!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!3Lxg!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png" width="1456" height="749" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!3Lxg!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 424w, https://substackcdn.com/image/fetch/$s_!3Lxg!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 848w, https://substackcdn.com/image/fetch/$s_!3Lxg!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 1272w, https://substackcdn.com/image/fetch/$s_!3Lxg!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd7a7d4cf-194d-4e73-8cbb-286d62590e0b_1978x1018.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h4><strong>As we move into a world run by technology… there is no better way to understand it than by reading the gossip of the decision makers.</strong></h4><p>Internal Tech Emails is the best way to understand the present because the decisions and the reasons for decisions can literally be traced to these messages.</p><p>Why can OpenAI go public after it started as a non-profit? What does Zuckerberg think of Snapchat? How did Jobs keep Apple talent? Is Google a monopoly?</p><p>You can literally find the answers to these questions here.</p><h2><strong>Aren’t we so lucky???</strong></h2><p>The world is full of petty disputes and lucky for us, these petty disputes often end up in court as lawsuits.</p><p>Even luckier for us, with the advent of digitized communications technology, we, for the first time in human history, can read the documented short-form correspondence of the leaders of great big things in real time – in a form that can be saved forever.</p><p>Nobody got to see how kings thought in near real-time. We get to see it today.</p><p>Internal Tech Emails is a cornucopia of techno-scandal that is one of my favorite places on the internet.</p><p>So if you ever find yourself thirsting for some tea on a slow Tuesday, you no longer need a water cooler or a porch.</p><p>You simply need to head over to <a href="https://files.techemails.com/" target="_blank" rel="noopener noreferrer">files.techemails.com</a> and search for your drama of choice.</p><h2>Vibecession is Kurate #4, <em><strong>4/5</strong></em></h2><ul><li><p><strong>Shareability (.5/1):</strong></p><ul><li><p>have to subscribe to get to the good stuff, so most non substack power users will be blocked after one example</p></li></ul></li></ul><ul><li><p><strong>Navigability (1/1):</strong></p><ul><li><p>the <a href="https://files.techemails.com/" target="_blank" rel="noopener noreferrer">full document archive</a>  lets you splice by name and topic, so it’s great.</p></li><li><p>really, really recommend this for any journalist looking to get background for either podcast interviews or longform</p></li></ul></li></ul><ul><li><p><strong>Curation (1/1):</strong></p><ul><li><p>whoever runs this account spends SO much time finding the best stuff from court documents.</p></li><li><p>like i actually can’t imagine the pain that goes into this.</p></li><li><p>there are only bangers here – i get very few emails from them and when i do i always click</p></li></ul></li></ul><ul><li><p><strong>Universality (.5/1):</strong></p><ul><li><p>you have to love tech for this to hit hard.</p></li></ul></li></ul><ul><li><p><strong>Personal Impact (1/1):</strong></p><ul><li><p>I use this at least twice a month when researching a new topic. </p></li><li><p>Last time I used it was trying to figure out wtf Snapchat was doing with glasses – some good stuff in here about Meta acquiring them + Google Glass.</p></li></ul></li></ul><h2><em><strong>More Like This</strong></em></h2><ul><li><p><a href="https://aletteraday.substack.com/" target="_blank" rel="noopener noreferrer">A Letter A Day</a>, <span class="mention-wrap"></span> </p></li><li><p>–<a href="https://x.com/25YearsAgoLive" target="_blank" rel="noopener noreferrer"> @25YearsAgoLive</a></p></li><li><p>– <a href="https://www.epsteinunboxed.com/" target="_blank" rel="noopener noreferrer">Epstein Unboxed</a></p></li></ul><h2><strong>About Kurate</strong></h2><p>Kurate is part internet museum, part food-blog for blogs.</p><p>This was Kurate #4.</p><p>You can read my reviews of Patrick Collison’s website, Grantland, and Vibecession <a href="https://kramnotmark.substack.com/s/kurate/?utm_source=substack&amp;utm_medium=menu" target="_blank" rel="noopener noreferrer">here</a>.</p><p><a href="https://kramnotmark.substack.com/p/kurate-4-internal-tech-emails">Originally published on Substack</a></p></article></noscript>
