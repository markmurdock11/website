name: Update cyber situation dashboard
on:
  push:
    branches: [main]
    paths:
      - 'not-a-cyber-attack/index.html'
      - 'scripts/publish-cyber-situation.mjs'
      - 'scripts/hourly-outage-monitor.mjs'
      - 'scripts/discover-industry-outages.mjs'
      - 'scripts/follow-up-outages.mjs'
      - 'scripts/industry-watchlist*'
      - '.github/workflows/publish-cyber-situation.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-cyber-situation
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check industry sources, follow up on incidents and import Composer
        env:
          STRING_FEED_BUILDER_KEY: ${{ secrets.STRING_FEED_BUILDER_KEY }}
          STRING_WEB_ACCESS_KEY: ${{ secrets.STRING_WEB_ACCESS_KEY }}
          STRING_FEED_NAME: news.cyber_evidence_wire
        run: node scripts/publish-cyber-situation.mjs not-a-cyber-attack/index.html not-a-cyber-attack/situation-feed.json
      - name: Publish the updated edition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          feed=not-a-cyber-attack/situation-feed.json
          if [[ ! -f "$feed" ]]; then exit 0; fi
          git add -- "$feed"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update cyber situation dashboard feed'
          git push
          # The built-in token's push requires an explicit branch-based Pages build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
