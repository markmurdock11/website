name: Check outage dashboard on phones
on:
  push:
    paths:
      - 'index.html'
      - 'publication.js'
      - 'not-a-cyber-attack/index.html'
      - 'scripts/check-cyber-dashboard-display.cjs'
      - '.github/workflows/check-cyber-dashboard-display.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the isolated browser test tools
        run: npm install --prefix "$RUNNER_TEMP/monitor-layout" --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Check phone layouts and interactions in Chromium and WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/monitor-layout/node_modules
          OUTPUT_DIR: ${{ runner.temp }}/monitor-screens
        run: node scripts/check-cyber-dashboard-display.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-browser-previews
          path: ${{ runner.temp }}/monitor-screens
          retention-days: 7
      - name: Read the phone preview for visual review
        if: always()
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/monitor-screens
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          for filename in ['chromium-390.png','chromium-industry-map-390.png','chromium-case-atlas-390.png']:
              path = Path(os.environ['OUTPUT_DIR']) / filename
              if path.exists():
                  try:
                      from PIL import Image
                      from io import BytesIO
                      buf = BytesIO()
                      Image.open(path).convert('RGB').save(buf, format='JPEG', quality=75)
                      raw = buf.getvalue()
                      mime = 'jpeg'
                  except ImportError:
                      raw = path.read_bytes()
                      mime = 'png'
                  data = base64.b64encode(raw).decode()
                  for i in range(0,len(data),3000):
                      print('SHOT|%s|%s|%05d|%s' % (filename,mime,i//3000,data[i:i+3000]))
          PY
  public-page:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify the detailed map on the public kram.bio page
        shell: python
        run: |
          import time, urllib.request
          from urllib.parse import urlsplit
          markers = ['id="case-atlas"', 'One tile per outage.', 'class="atlas-description"', 'b.dataset.locate=r.id']
          for attempt in range(42):
              try:
                  url = 'https://kram.bio/not-a-cyber-attack/?map-review=' + str(int(time.time()))
                  req = urllib.request.Request(url, headers={'User-Agent':'KramDashboardDisplayCheck/1.0'})
                  with urllib.request.urlopen(req,timeout=10) as response:
                      body = response.read().decode('utf-8')
                      if response.status == 200 and urlsplit(response.url).hostname == 'kram.bio' and all(x in body for x in markers):
                          print('Verified kram.bio public response, new overview, caption and incident descriptions')
                          break
              except OSError as err:
                  print('Waiting for public origin:', str(err))
              time.sleep(12)
          else:
              raise SystemExit('The latest map has not appeared at the public URL')
