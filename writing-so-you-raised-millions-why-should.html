<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">Back to archive</a><h1>So You Raised Millions… Why Should You Announce That?</h1><p>Hire. Sell. Kingmake. </p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!3O3T!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!3O3T!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!3O3T!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!3O3T!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!3O3T!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!3O3T!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!3O3T!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!3O3T!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!3O3T!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!3O3T!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9267ed4-56d7-4ad4-bc1f-bd1b38341609_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><strong><span>To set the stage: </span></strong><em><span>You are the first nontechnical hire working at a deep tech startup about to finalize a $25M seed round. You have no social accounts, no marketing people, and no one even knows the name of your project. So what do you do? Hire an agency or someone internal? Do a video, a blog, a podcast? Pitch media? Your founder wants coverage in TechCrunch and Bloomberg, but how do you reach them? You’ll probably just ask your investors… </span></em></p><p><span>OK Pause. </span></p><p><span>These are good questions, but deciding the </span><strong><span>what</span></strong><span> before the </span><strong><span>why</span></strong><span> is how you end up with an incredibly expensive launch video or a frantic CMO hire.</span></p><h4><strong><span>Know before you announce – Choose 1 primary goal:</span></strong></h4><ul><li><p><strong><span>Announce to Hire: </span></strong><span>You have the capital -- now you need people who can turn it into something. Marketing a raise to attract A+ players, or what Keith Rabois would call </span><a href="https://alearningaday.blog/2025/01/15/barrells-and-ammunition/" target="_blank" rel="noopener noreferrer"><span>barrels</span></a><span>, is a fantastic use of attention.</span></p><ul><li><p>Attract top-end talent</p></li><li><p>Show what great people could build here</p></li><li><p>Turn new hires into reasons for the next hire to join</p></li><li><p><strong>Good example: </strong><a href="https://x.com/travisk/status/2080000659546583259" target="_blank" rel="noopener noreferrer">Atoms<br></a></p></li></ul></li><li><p><strong><span>Announce to Sell: </span></strong><span>A raise is a great excuse to talk your book, meaning anything you want to sell. It can put a product in front of new customers or give hesitant ones a reason to commit. Momentum </span><em><span>around</span></em><span> a product can also make the company behind the product more interesting to future investors.</span></p><ul><li><p>Give customers a reason to buy now</p></li><li><p>Counterposition against incumbents or competitors</p></li><li><p>Make the product’s larger potential legible to future investors</p></li><li><p><strong>Good example:</strong> <a href="https://x.com/ZachBDell/status/2084253366838870208" target="_blank" rel="noopener noreferrer">Base Power Company<span><br></span></a></p></li></ul></li></ul><ul><li><p><strong><span>Announce to Kingmake: </span></strong><span>Give the company a face people can follow, reply to, and root for. Crown your champion. Birth reverance. Especially at the seed level, an ambitious idea can sound stupid as fuck before viewers are given a personality to follow.</span></p><ul><li><p><span>Funnel attention into interest in a single person</span></p></li><li><p><span>Introduce outlandish ideas in simple words from a familiar face</span></p></li><li><p><span>Give people a reason to believe your leader should be their leader</span></p></li><li><p><strong><span>Good example:</span></strong><span> </span><a href="https://x.com/noahrshinn/status/2092691344456351744" target="_blank" rel="noopener noreferrer"><span>Instinct</span></a></p></li></ul></li></ul><p><span>These goals will overlap - a good product story can attract talent, and a compelling vision can sell a product. The idea here is to focus on the </span><strong><span>main</span></strong><span> job based on what’s holding the company back: the people to build it, customers ready to buy it, or someone for people to identify with.</span></p><p><span>Below are a few examples of companies that announced to hire, sell, and kingmake well, including Atoms, Base Power Company, and Instinct. </span></p><h2><strong><span>Announce to Hire: Atoms</span></strong></h2><p><span>You have the capital -- now you need people who can turn it into something. Marketing a raise to attract A+ players, or what Keith Rabois would call barrels, is a fantastic use of attention.</span></p><p><a href="https://www.conordewey.com/blog/barrels-and-ammunition/" target="_blank" rel="noopener noreferrer"><span>Keith’s explanation</span></a><span> of barrels and ammunition below:</span></p><p><em><span>“If you think about people, there are two categories of high-quality people: there is the ammunition, and then there are the barrels. You can add all the ammunition you want, but if you have only five barrels in your company, you can literally do only five things simultaneously. If you add one more barrel, you can now do six things simultaneously. If you add another one, you can do seven, and so on.”</span></em></p><p><span>Atoms </span><a href="https://www.linkedin.com/posts/atomsco_today-were-announcing-a-17b-equity-investment-activity-7485763097119367168-xZk9" target="_blank" rel="noopener noreferrer"><span>raised $1.7B in a round led by a16z</span></a><span> to build physical AI across food, mining, and transport -- including what they call food computers. With major capital in the bank, Travis Kalanick’s name, and a fresh stamp of approval from a16z, what else would Atoms want from this announcement?</span></p><p><span>Talent.</span></p><p><span>The Atoms corporate account, a16z’s account, Travis’ account, and his talking points on TBPN all funnel toward hiring. All of the channels flooded with the big raise announcement held the same invitation: </span><em><strong><span>apply now.</span></strong></em></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!kMDm!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!kMDm!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 424w, https://substackcdn.com/image/fetch/$s_!kMDm!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 848w, https://substackcdn.com/image/fetch/$s_!kMDm!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!kMDm!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!kMDm!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg" width="1200" height="1658" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!kMDm!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 424w, https://substackcdn.com/image/fetch/$s_!kMDm!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 848w, https://substackcdn.com/image/fetch/$s_!kMDm!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!kMDm!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd1291502-2e16-4e55-9700-0c18c24bc246_1200x1658.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><span>Atoms followed the raise with executive hires that dripped into the tech consciousness in the following weeks, keeping the talent story going after the original announcement.</span></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!I0qR!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!I0qR!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 424w, https://substackcdn.com/image/fetch/$s_!I0qR!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 848w, https://substackcdn.com/image/fetch/$s_!I0qR!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!I0qR!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!I0qR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg" width="1200" height="782" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!I0qR!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 424w, https://substackcdn.com/image/fetch/$s_!I0qR!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 848w, https://substackcdn.com/image/fetch/$s_!I0qR!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!I0qR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F10b7bfbd-ec3f-46c3-9d9f-44a63b3660fe_1200x782.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><strong><span>Announce to Sell: Base Power Company</span></strong></h2><p><span>A raise is a great excuse to talk your book -- meaning anything you want to sell. It can put a product in front of new customers or give hesitant ones a reason to commit. Momentum </span><em><span>around</span></em><span> a product can also make said product more interesting to future investors.</span></p><p><span>As YC founder </span><a href="https://www.wsj.com/articles/BL-232B-2715" target="_blank" rel="noopener noreferrer"><span>Jessica Livingston</span></a><span> said in the WSJ, most marketing for startups shouldn’t feel like marketing… it should feel like sales:</span></p><p><em><span>“The most important thing an early-stage startup should know about marketing is rather counterintuitive: that you probably shouldn’t be doing anything you’d use the term “marketing” to describe. Sales and marketing are two ends of a continuum. At the sales end your outreach is narrow and deep. At the marketing end it is broad and shallow. And for an early stage startup, narrow and deep is what you want -- not just in the way you appeal to users, but in the type of product you build. Which means the kind of marketing you should be doing should be indistinguishable from sales: you should be talking to a small number of users who are seriously interested in what you’re making, not a broad audience who are on the whole indifferent.”</span></em></p><p><span>Base Power’s $1B raise opened the door to getting mainstream coverage about their business in WSJ, Tech Crunch, Bloomberg Tech, Molly O’Shea. This is a good use of leverage for pure mindshare, but it was their execution on direct channels like Twitter and investor relations that was more interesting to me.</span></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!C-xH!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!C-xH!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 424w, https://substackcdn.com/image/fetch/$s_!C-xH!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 848w, https://substackcdn.com/image/fetch/$s_!C-xH!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!C-xH!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!C-xH!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg" width="1440" height="1440" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!C-xH!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 424w, https://substackcdn.com/image/fetch/$s_!C-xH!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 848w, https://substackcdn.com/image/fetch/$s_!C-xH!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!C-xH!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1d73db8e-4abe-4eca-9ea2-f273d3043c45_1440x1440.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><span>On direct channels, they specifically used this raise to launch </span><a href="https://www.basepowercompany.com/core" target="_blank" rel="noopener noreferrer"><span>Base Core</span></a><span>, a new battery that Base owns and installs for customers.</span></p><p><span>A snippet from their announcement on X:</span></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!XlO2!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!XlO2!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 424w, https://substackcdn.com/image/fetch/$s_!XlO2!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 848w, https://substackcdn.com/image/fetch/$s_!XlO2!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 1272w, https://substackcdn.com/image/fetch/$s_!XlO2!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!XlO2!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png" width="790" height="347" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!XlO2!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 424w, https://substackcdn.com/image/fetch/$s_!XlO2!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 848w, https://substackcdn.com/image/fetch/$s_!XlO2!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 1272w, https://substackcdn.com/image/fetch/$s_!XlO2!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb13a444-dc58-4c5c-bda4-711968d2fc0a_790x347.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><span>Base did a good job of speaking to two audiences: </span><em><strong><span>homeowners</span></strong></em><span> who want backup power and </span><em><strong><span>institutions</span></strong></em><span> (capital allocators and potential markets) who might fund or welcome a much larger battery network in the future.</span></p><ol><li><p><strong><span>Homeowners</span></strong><span>: They made a hard push into the markets that the battery is available in to sell to homeowners. For the Texas side of this push, they advertised with </span><a href="https://www.basepowercompany.com/watt" target="_blank" rel="noopener noreferrer"><span>JJ Watt</span></a><span>, </span><a href="https://www.basepowercompany.com/watt" target="_blank" rel="noopener noreferrer"><span>a football superstar</span></a><span> with a name that literally has power in it. They also used Anthony Rizzo for Chicago. This socials push was also accompanied by </span><a href="https://www.tiktok.com/@diskobear/video/7651349530725698830" target="_blank" rel="noopener noreferrer"><span>direct-to-consumer ads</span></a><span> in those markets.</span></p></li></ol><ol start="2"><li><p><strong><span>Institutions</span></strong><span>: They also needed to convince future investors and governments in new markets that this can become much more than a good battery product. So they brought in the VCs and put out a bunch of pieces that help people in tech understand the power of a battery network. If you read these closely, you see the narrative of “great battery,” but you really see “wow, look what happens when you connect all these batteries” which gets institutions interested in the </span><a href="https://www.notboring.co/p/base-power-company-chapter-3" target="_blank" rel="noopener noreferrer"><span>economies of scale of Base</span></a><span>. That could interest governments, VCs or other capital allocators who might fund or help accelerate what is probably a capital-intensive, regulation-heavy next steps for Base.</span></p></li></ol><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!oEWq!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!oEWq!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 424w, https://substackcdn.com/image/fetch/$s_!oEWq!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 848w, https://substackcdn.com/image/fetch/$s_!oEWq!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!oEWq!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!oEWq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg" width="1365" height="2048" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!oEWq!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 424w, https://substackcdn.com/image/fetch/$s_!oEWq!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 848w, https://substackcdn.com/image/fetch/$s_!oEWq!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!oEWq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48187dfb-47b8-46da-a875-aa85f6284862_1365x2048.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><strong><span>Announce to Kingmake: Instinct</span></strong></h2><p><span>So what do you do when your company is looking for talent and is looking to sell, but people don’t yet understand the idea or believe you can build it?</span></p><p><strong><span>You kingmake.</span></strong><span> You crown your champion. Especially at the seed level, an ambitious idea can sound stupid as fuck before viewers are given someone to revere. The elixir of kingmaking narrative is described (and examined) by Joseph Campbell in The Hero With A Thousand Faces…</span></p><p><em><span>“A hero ventures forth from the world of common day into a region of supernatural wonder: fabulous forces are there encountered and a decisive victory is won: The hero comes back from this mysterious adventure with the power to bestow boons on his fellow man.”</span></em></p><p><span>When news of Instinct’s</span><a href="https://techcrunch.com/2026/08/26/viral-ai-startup-instinct-has-raised-350-million-at-a-2-5-billion-valuation/" target="_blank" rel="noopener noreferrer"><span> $250M Series B</span></a><span> broke, Noah Shinn’s first public post on Twitter was</span><a href="https://x.com/noahrshinn/status/2092691344456351744" target="_blank" rel="noopener noreferrer"><span> a personal</span></a><span> introduction: “I’m Noah, the founder of Instinct.” No mention of the raise or investors. Just hello, here’s what we’re building, and here’s what people are doing with it.</span></p><p><span>The post got</span><a href="https://www.linkedin.com/posts/matt-huang-103299138_noah-shinns-first-public-post-about-his-activity-7502032821444829184-Mahs" target="_blank" rel="noopener noreferrer"><span> about 2M views</span></a><span> and Noah’s account went to 30K followers overnight. Suddenly, Instinct had a King to go with its agentic kingdom of users.</span></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!BC-1!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!BC-1!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 424w, https://substackcdn.com/image/fetch/$s_!BC-1!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 848w, https://substackcdn.com/image/fetch/$s_!BC-1!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 1272w, https://substackcdn.com/image/fetch/$s_!BC-1!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!BC-1!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png" width="1204" height="1586" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!BC-1!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 424w, https://substackcdn.com/image/fetch/$s_!BC-1!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 848w, https://substackcdn.com/image/fetch/$s_!BC-1!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 1272w, https://substackcdn.com/image/fetch/$s_!BC-1!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9514e9c0-9679-4c9c-a57b-7cba28ab04cb_1204x1586.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><span>Instinct took the momentum from the raise and funneled the energy to build up Noah’s social presence for the battles to come. This was a social strategy borrowed from </span><a href="https://x.com/JensenHuang/status/2080643682408321103" target="_blank" rel="noopener noreferrer"><span>Jensen Huang -- when Nvidia used his first X post to champion open models</span></a><span>. That first moment can do a lot, especially when combined with a raise.</span></p><p><span>The next chapters for Instinct will have bigger stakes: raising again, shipping more complex product, and taking on</span><a href="https://about.fb.com/news/2026/09/introducing-muse-personal-ai-agent/" target="_blank" rel="noopener noreferrer"><span> Meta’s Muse</span></a><span>.</span></p><p><span>For these, Instinct will need a King to explain to the world why they should continue believing in the product and the thesis… Case in point: just days after the $250M raise, The Information reported Instinct </span><a href="https://www.theinformation.com/articles/ai-agent-startup-instinct-talks-10-billion-valuation/" target="_blank" rel="noopener noreferrer"><span>seeking $1B at a $10B valuation</span></a><span>.</span></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!4CAI!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!4CAI!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 424w, https://substackcdn.com/image/fetch/$s_!4CAI!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 848w, https://substackcdn.com/image/fetch/$s_!4CAI!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 1272w, https://substackcdn.com/image/fetch/$s_!4CAI!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!4CAI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png" width="1044" height="324" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!4CAI!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 424w, https://substackcdn.com/image/fetch/$s_!4CAI!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 848w, https://substackcdn.com/image/fetch/$s_!4CAI!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 1272w, https://substackcdn.com/image/fetch/$s_!4CAI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6531478a-8647-41b4-bd81-4f6476eb0a39_1044x324.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><span>Noah now has an audience who knows the person taking that on -- making it personal, giving people someone to root for or against.</span></p><p><span>Kingmade.</span></p><h2><strong><span>Choose Your Announcement Goal: Hire, Sell, Kingmake</span></strong></h2><p><span>Raise enough money and the number alone might get you a headline. That’s fine and all. But you only get to announce this round once…</span></p><p><span>So let’s go back to the set stage:</span></p><p><em><span>You are the first nontechnical hire working at a deep tech startup about to finalize a $25M seed round. You have no social accounts, no marketing people, and no one even knows the name of your project…</span></em></p><p><span>What do you do?</span></p><p><span>Nothing… until you and the rest of the org have picked a goal to sprint towards: hire, sell, kingmake.</span></p><p><span>From there, choose the story, the format, and the people who can get it in front of the right audience. All of that is downstream from the goal.</span></p><p><em><span>So you raised millions…what do you want that attention to do for the company?</span></em></p><p><em><span>Are you selling, hiring, or kingmaking?</span></em></p><p><span>--</span></p><p><span>An essay by </span><a href="http://kram.bio" target="_blank" rel="noopener noreferrer"><span>Kram</span></a><span> and </span><a href="https://www.emmajoelle.com/" target="_blank" rel="noopener noreferrer"><span>Emma</span></a><span> as we think about </span><a href="https://www.aurient.ai/" target="_blank" rel="noopener noreferrer"><span>Aurient</span></a><span>.</span></p><p><span>Thank you to </span><a href="https://x.com/WhatTheLJW" target="_blank" rel="noopener noreferrer"><span>LJW</span></a><span> for beta reading. And thank you capital and capitalism and such.</span></p><p><a href="https://kramnotmark.substack.com/p/so-you-raised-millions-why-should">Originally published on Substack</a></p></article></noscript>
