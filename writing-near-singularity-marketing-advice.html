<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">Back to archive</a><h1>Near-Singularity Marketing Advice</h1><p>It is such an interesting time to be alive. I hope this essay helps you market in the meantime.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!CZcb!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!CZcb!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 424w, https://substackcdn.com/image/fetch/$s_!CZcb!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 848w, https://substackcdn.com/image/fetch/$s_!CZcb!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 1272w, https://substackcdn.com/image/fetch/$s_!CZcb!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!CZcb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png" width="1456" height="819" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!CZcb!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 424w, https://substackcdn.com/image/fetch/$s_!CZcb!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 848w, https://substackcdn.com/image/fetch/$s_!CZcb!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 1272w, https://substackcdn.com/image/fetch/$s_!CZcb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd326d938-f9f9-4d43-88fd-54c2f9309a9c_1672x941.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Three things I think marketers need to understand about the world we exist in:</p><ul><li><p><strong>Telling Good Stories Matters. Telling Authentic Stories Matters More.</strong></p></li><li><p><strong>Corporate Demigods (Millennials) Are the New Target Audience for B2B SaaS.</strong></p></li><li><p><strong>Technology Is No Longer Soft; It Is Hard</strong></p></li></ul><p>What with nearing the singularity and all, it is a really hard time to know what to write and communicate. The corporation is expected to be an artist because the individual is expected to produce like a corporation, and your job as a marketer is still to change somebody’s mind… while not turning into a slop cannon.</p><p>It’s SUCH a weird moment which deserves a weird essay, I guess. So sorry in advance. Or you’re welcome. Who knows. Idk if people read anymore.</p><h2><strong>1. Telling Good Stories Matters. Telling Authentic Stories Matters More.</strong></h2><p>You’re writing and creating for humans and we humans, we want art and poetry and what we love is an underdog but we also love a divorce and we also love some drama.  It used to be that good stories were all that mattered, but now, as the world begins to battle with the premise that robots can also tell good stories, we want authentically human stories. So create stuff that is a bit messy around the edges, that is true to the people of the company.</p><p>Humans want content that is chicken noodle soup for the soul because we want desperately to believe that our souls matter.</p><p>A few thoughts on how to action on this thought:</p><ul><li><p><strong>Treat your audience like reality TV fans:</strong> On <a href="https://cheekypint.transistor.fm/" target="_blank" rel="noopener noreferrer">Cheeky Pint</a>, we see founder conversations as just a few guys grabbing a beer. Check out this podcast with <a href="https://x.com/anuatluru/status/2032875728652444159" target="_blank" rel="noopener noreferrer">Ed Sheeran, Lil Dicky, and Benny Blanco</a>: you are watching completely corporate individuals interact in an authentic way. There are definitely lessons from this that you can take into SaaS. You need to stop editing all the actual takes out of the company and the content you put out and let the vibes ride naturally: it is a stream forward, human forward world. Founders are the new celebrities. Athletes don’t want to be rappers anymore; they want to be VCs. There is some weird convergence happening of tech and culture and this is the moment to lean into it and treat tech company marketing like it’s a television show.</p></li><li><p><strong>Hire people who are good at storytelling:</strong> I think form and process often gets in the way of <a href="https://www.notboring.co/p/tell-good-stories" target="_blank" rel="noopener noreferrer">telling good stories</a> because the best stories always break the rules (tastefully). It makes me smile that the <a href="https://www.youtube.com/watch?v=3ryRgzE_b7Q" target="_blank" rel="noopener noreferrer">post-Thanos Snap Marvel movies</a> have sucked and that <a href="https://www.marisacollins.com/work/openai" target="_blank" rel="noopener noreferrer">OpenAI’s Super Bowl commercial</a> was bad while <a href="https://www.motherlondon.com/work/anthropic" target="_blank" rel="noopener noreferrer">Anthropic’s</a> was a chuckler. We know when humans have shaped a narrative and when something is sticking to a corpo script. Human-designed lore is going to be at a premium. Study who <a href="https://a16z.com/what-is-new-media/" target="_blank" rel="noopener noreferrer">a16z’s New Media</a> hires (hello, Alex Danco) and what types of books (or PDFs) <a href="https://press.stripe.com/" target="_blank" rel="noopener noreferrer">Stripe Press</a> is publishing these days.  It is not surprising that <a href="https://x.com/mariogabriele/status/2027055620998754455" target="_blank" rel="noopener noreferrer">Mario Gabriele joined the venture firm Hummingbird</a>. Thrive Holdings hired <a href="https://www.linkedin.com/posts/nathan-baugh_professional-news-i-joined-thrive-holdings-activity-7501321095195836416-ln92" target="_blank" rel="noopener noreferrer">Nathan Baugh</a> to work on content, and <a href="https://www.generalcatalyst.com/team/reggie-james" target="_blank" rel="noopener noreferrer">Reggie James</a> is at General Catalyst now. Open the purse strings for these roles that do all the marketing without being called marketing -- maybe it’s a creative designer, who knows. This is why everyone and their mother wants a <a href="https://www.youngmoney.co/p/some-thoughts-on-head-of-narrative" target="_blank" rel="noopener noreferrer">Head of Narrative</a>. We’re back to marketing, we’re back to comms, we’re back to building brands, we’re calling it <a href="https://x.com/cplangfo/status/2104637065954546105" target="_blank" rel="noopener noreferrer">lore</a>. Whatever you want to call it, hire it.</p></li><li><p><strong>CounterTrade Academic Papers and Focus on Bangers:</strong> Elizabeth Yin noticed that there were <a href="https://elizabethyin.com/2020/06/30/why-marketing-is-eating-the-world/" target="_blank" rel="noopener noreferrer">nearly 2 billion websites in 2020</a> -- meaning the status quo of the internet is death for much of the content and death for pretty much anyone that follows the status quo of how to market (aka package) information. AI makes it even easier to do more of what everyone else is already doing and what has already been done -- so more websites, bad tweets, and awful blogs are possible. There is a massive chance that marketing goes the way of scientific papers, which have become <a href="https://worksinprogress.co/issue/the-elements-of-scientific-style/" target="_blank" rel="noopener noreferrer">harder to read</a> despite increasing in number. I continue to think about the machinery of <a href="https://www.experimental-history.com/p/the-rise-and-fall-of-peer-review" target="_blank" rel="noopener noreferrer">peer review</a> and Donald Braben’s <a href="https://www.amazon.com/dp/0578675919/" target="_blank" rel="noopener noreferrer">Scientific Freedom</a>, which argues for giving researchers room to pursue ideas that don’t fit the process. We need to figure out how to do marketing without becoming a slop cannon that puts out daily content to engorge an already dead internet. In essence, a <em>slop cannon’s</em> work exists to satisfy the organization’s <em>process rather than outcome</em>. Executing on comms not because there is something worth communicating but because this is what the status quo tells them to do. If every launch video looks like every other launch video, making another one is not much of a strategy. I think the best way to start nowadays is with a group chat you want to reach and work backward to a bombastic campaign those people will actually pass around.</p></li></ul><h2><strong>2. Corporate Demigods (Millennials) Are the New Target Audience for B2B SaaS.</strong></h2><p>Picture the 30-year-old who squeaked into their job right before COVID and got normal job training, then acquired corporate superpowers by surviving COVID, and is now using AI because they’re still junior enough to execute yet senior enough to have reports and coordination experience.</p><p>They grew up without a phone but got social media in high school and now get AI, so their brain is only medium scrambled and they are only lightly cringe (lots of GIFs that they think are cooler than emojis).</p><p>This person -- what I think of as the corporate demigod --  is the prime target for all your marketing material, as they will be the power-dealer of every company they show up in.</p><p>A few thoughts on how to action on this thought:</p><ul><li><p><strong>Market to the person acquiring power not the org chart:</strong> This millennial is the corporate demigod, the most powerful person inside companies as they orchestrate agent swarms and distribute taste by sending links to their coworking homies from their curated feeds. <a href="https://www.pewresearch.org/internet/2026/06/17/how-opinions-and-use-of-ai-differ-by-age/" target="_blank" rel="noopener noreferrer">Pew’s 2026 survey</a> found 43% of employed Americans aged 30 to 49 had ever used chatbots for work, roughly level with 18- to 29-year-olds at 41%. My bet is that their management experience puts them in prime orchestration age: <a href="https://x.com/0x_Arjun/status/2032498616212877664" target="_blank" rel="noopener noreferrer">orchestrators of bots</a> as well as meat networks (human reports), with more say over what the company buys and executes on. Look for people whose responsibilities are growing faster than their teams and target them fully for B2B SaaS. These are the decision makers and the orchestrators: the only people that matter. And if you have a retail app, they have powerful <a href="https://x.com/benroy/article/2097725297462566987" target="_blank" rel="noopener noreferrer">group chats</a> to distribute to. Make something they want to send to their friends with a little cringe GIF. No matter if this person’ss title is head of, a lead, a VP, or a C (they probably wont be a C), this is the person that matters because they control the agents and the decisions (and therefore the taste) inside their org.</p></li><li><p><strong>Study the tastemakers above and below the millennials:</strong> <a href="https://post.substack.com/p/the-tulpa-of-the-internet" target="_blank" rel="noopener noreferrer">Donald Boat</a> gets CEOs (ok really just Sam Altman) to buy him books and energy drinks, while Roy Lee turns outrage into attention (and funding) for Cluely. They’re under 30, but these are the guys that get it. Thank god(s) for <a href="https://harpers.org/archive/2026/03/childs-play-sam-kriss-ai-startup-roy-lee/" target="_blank" rel="noopener noreferrer">Child’s Play</a>, Sam Kriss’s essay about Lee and the best explanation I’ve read of how the world works now. Cluely’s ragebait and Friend’s <a href="https://www.nytimes.com/2025/10/07/style/friend-ai-subway-ads-new-york.html" target="_blank" rel="noopener noreferrer">AI subway ads</a> give people something to argue about, and the argument becomes distribution for their companies. Instead of seething, study how they get people with power to pay attention. Then go reread our lord and savior <a href="https://paulgraham.com/taste.html" target="_blank" rel="noopener noreferrer">Paul Graham on taste</a>, because someone still has to decide what all those bots should make. Paul defines how Gen X and and above view taste. To hit the corporate demigod target, you want to meet somewhere in the middle of Donald Boat and Paul Graham: which means crossing hyperonline memetic discourse of the moment (hyperreality) with nostalgic packaging designed by humans (like Paul Graham’s website haha). Watch the tech shows <a href="https://mtslive.substack.com/" target="_blank" rel="noopener noreferrer">MTS</a> and <a href="https://www.tbpn.com/" target="_blank" rel="noopener noreferrer">TBPN</a> for formats and references and style, and notice what makes you keep watching. These are the actual corporate demigod media brands: this is what they love. Re-create the feeling of the early internet they grew up with: buddy lists, forums, GIFs and weird little websites you sent to your friends. Use familiar formats for unfamiliar technology, so the AI demo feels like something they already know how to play with. Make product demos and content that make a millennial go “ahh,” then show them something they can do in the next 4 seconds before they scroll away.</p></li></ul><h2><strong>3. Technology Is No Longer Soft; It Is Hard</strong></h2><p>I think we’re post-revenue, pre-religion as a society. Companies are selling futures well beyond what they earn today and people are looking for a place in those futures and the in-between feels weird and hard to, ahem, market.</p><p>This is a pre-singularity transition, or maybe a mid-singularity reality, and marketing orgs have to understand the world they’re competing in, in that people lack attention, funds love dynamism, and the definition of hardware/software is changing.</p><p>A few thoughts on how to action on this thought:</p><ul><li><p><strong>Understand you’re marketing to attention-addled lonely gamblers:</strong> Attention is being monetized harder than ever. <a href="https://www.iab.com/news/digital-ad-revenue-climbs-to-nearly-300b-as-iab-celebrates-30-year-anniversary/" target="_blank" rel="noopener noreferrer">US digital ad revenue reached $294.6 billion in 2025, up 13.9%</a>, and your customer still only has 24 hours a day, which means attention markets are getting more efficient at pricing screen time, which is good for the corporation and addictive to the viewer. On top of that, WHO estimates <a href="https://www.who.int/news-room/questions-and-answers/item/social-connection" target="_blank" rel="noopener noreferrer">one in six people worldwide experience loneliness</a> -- if you haven’t read Kyla Scanlon on <a href="https://kyla.substack.com/p/everyone-is-gambling-and-no-one-is" target="_blank" rel="noopener noreferrer">attention markets</a> and Derek Thompson on <a href="https://www.derekthompson.org/p/the-monks-in-the-casino" target="_blank" rel="noopener noreferrer">monks in the casino</a>, then stop now and dig into why more connectivity online seems to be increasing isolation. Toby Shorin’s <a href="https://writing.tobyshorin.com/body-futurism/" target="_blank" rel="noopener noreferrer">body futurism</a> and Yancey Strickler’s <a href="https://www.ystrickler.com/thepostindividual/" target="_blank" rel="noopener noreferrer">post-individual</a> offer a counteraction: people finding something to belong to again in the physical world. You are marketing to attention-addled lonely gamblers who either need dopamine or they need good content or they need an IRL call to action. So either lean into marketing via dopamine content -- which needs to be very good content because the competitors are Looksmaxxers selling straight dopamine on TikTok via streaming-based content that B2B SaaS just can’t quite match -- or try and go the other way with longform and weirdform and IRL activations and merch. Idk. This is a tough one to get right and is expensive, but is probably the best way to go about it as the dopamine battles are going to be hard to win.</p></li><li><p><strong>Shade your content towards where the world is going (hardware):</strong> I’m noticing that the venture funds love dynamism, which means the world is about 5 years away from loving dynamism (or maybe not loving it, but living inside it). a16z nearly doubled its American Dynamism fund from <a href="https://a16z.com/new-funds-new-era/" target="_blank" rel="noopener noreferrer">$600 million in 2024</a> to <a href="https://a16z.com/why-did-we-raise-15b/" target="_blank" rel="noopener noreferrer">$1.176 billion in 2026</a>. Defense hardware and energy and robots and manufacturing, the tangentially related dark arts of new technology, are where the tech story is going -- just look at Palantir and Anduril and Atoms and such: these are the accelerating technology firms of the 2020s, taking over the mantle from the now kingmade social media and internet orgs. The definition of technology is changing and your content needs to change with it. If you are in marketing, software is no longer cool: you must, MUST, show people why it is helpful. Hardware is now SEXY, and you MUST, must, not show revenue for your hardware firm, because the <a href="https://www.youtube.com/watch?v=BzAdXyPYKQo" target="_blank" rel="noopener noreferrer">Silicon Valley meme</a> about revenue isn’t about radio on the internt; it’s about <a href="https://www.businessinsider.com/travis-kalanick-ex-uber-misfits-entering-robotics-game-atoms-2026-3" target="_blank" rel="noopener noreferrer">robots for burritos</a> now. Read <a href="https://openai.com/index/accelerating-the-next-phase-ai/" target="_blank" rel="noopener noreferrer">OpenAI’s March 2026 funding announcement</a> next to <a href="https://openai.com/index/announcing-the-stargate-project/" target="_blank" rel="noopener noreferrer">Stargate’s proposed $500 billion in US AI infrastructure over four years</a>: the AI story is an energy and construction story too, heh. Your software should help me get my work done; your hardware should give me a future to get excited about: hardware as religion, perhaps.</p></li></ul><p>Anyways, we live in a weird, near-singularity time. As Athena burst forth from the forehead of Zeus, we are watching, through a livestream that we call reality, a birth-race to bring about our future deity, artificial general intelligence.</p><p>We wait with bated breath for a new LLM goddess to erupt in a data-trained virgin birth from the halls of one of the privately owned techniums and their proprietary training models.</p><p>It is such an interesting time to be alive. I hope this essay helps you market in the meantime.</p><p>Long live stories and such.</p><p>Best,</p><p>Kram</p><p><a href="https://kramnotmark.substack.com/p/near-singularity-marketing-advice">Originally published on Substack</a></p></article></noscript>
