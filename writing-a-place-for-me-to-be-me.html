<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">← archive</a><h1>A Place for Me to Be Me</h1><p>After six years of startups, I want to use the internet a little differently.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!CvJ-!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!CvJ-!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!CvJ-!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!CvJ-!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!CvJ-!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!CvJ-!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!CvJ-!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!CvJ-!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!CvJ-!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!CvJ-!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb33b8506-cebb-44b8-9907-6db9d59cbcd4_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>So I am <a href="https://www.linkedin.com/in/mark-murdock-/" target="_blank" rel="noopener noreferrer">Mark</a> but most of my friends call me <a href="https://kram.bio/" target="_blank" rel="noopener noreferrer">Kram</a>.</p><h2>THE INTERNET, UNTIL NOW</h2><p>In the past, I’ve used the internet as a <a href="https://kram.bio/#archive" target="_blank" rel="noopener noreferrer">library</a> and as a <a href="http://twitter.com/kramnotmark" target="_blank" rel="noopener noreferrer">journal</a>. It has been a place to consume content and a place to jot down half-finished thoughts. Passive and personal. An experience inclined towards scrolling.</p><p>The internet has also been a place associated with <a href="https://kram.bio/#about" target="_blank" rel="noopener noreferrer">work</a> -- ghostwriting blogs and running corporate social media accounts and spinning narrative and such. All stuff I love and that has contained a fair bit of my personality, but has left me feeling a bit ghostly. I have been too long behind the keys for content and opinions I didn’t have to fully own.</p><p>As I take <a href="https://x.com/kramnotmark/status/2088356758083514494" target="_blank" rel="noopener noreferrer">some time off from work</a> -- it’s been six years of startups since dropping out of school, how time flies -- my relationship with the internet is going to change a bit.</p><blockquote><p>It’s time for me to be a bit more, me.</p></blockquote><h2>FROM HERE</h2><p>So, starting today, the internet is a place I am going to be fully authentic, with the aim to <a href="https://kram.bio/#writing" target="_blank" rel="noopener noreferrer">collect</a> and <a href="https://kramnotmark.substack.com/about" target="_blank" rel="noopener noreferrer">distribute</a>. To actively curate content and share thoughts publicly. An experience inclined towards action. </p><p>This means a lot of posts will be erupting from my channels. A lot of them personal. Many of them tinkering with new form factors for ideas and weird words. Only a few about technology?</p><p>Most content will be about the stuff I care about and why.</p><h2>IN GENERAL, I BELIEVE...</h2><ul><li><p>friendship is the most important salve for scrolling</p></li><li><p>life should be lived as if you get one shot at it</p></li><li><p>fiat will eventually be replaced by an algorithmic flatcoin</p></li><li><p>grand romance is alive and well and should be more consistently espoused</p></li><li><p>terraforming is probably the most interesting place to be researching right now</p></li></ul><p>If any of those things bother you, well, I guess I’m posting this so you have time to unfollow this page before I start blitzing content.</p><p>If any of those things interest you or someone you know, well, then hello again. I’m Mark, most of my friends call me Kram, and you will hopefully be seeing a lot more from me in the coming weeks. </p><p class="button-wrapper"><a class="button primary" href="https://kramnotmark.substack.com/subscribe?" target="_blank" rel="noopener noreferrer"><span>Subscribe now</span></a></p><p></p><h2>FIRST UP: KINETIC</h2><p>The first series of posts I have coming up is called <strong><a href="https://kramnotmark.substack.com/s/kinetic" target="_blank" rel="noopener noreferrer">KINETIC</a></strong>. It is a six-part series about my time traveling across Ireland, London, Berlin, Greece, and Liberia earlier this year.</p><p>- Kram</p><p><a href="https://kramnotmark.substack.com/p/a-place-for-me-to-be-me">Originally published on Substack</a></p></article></noscript>
