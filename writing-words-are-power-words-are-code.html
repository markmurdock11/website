onaws.com%2Fpublic%2Fimages%2Fc6d38f40-7117-44d7-a769-d435b919c6f4_1536x1024.jpeg" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!fjSQ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc6d38f40-7117-44d7-a769-d435b919c6f4_1536x1024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!fjSQ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc6d38f40-7117-44d7-a769-d435b919c6f4_1536x1024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!fjSQ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc6d38f40-7117-44d7-a769-d435b919c6f4_1536x1024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!fjSQ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc6d38f40-7117-44d7-a769-d435b919c6f4_1536x1024.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>This is an essay about writing as power transfer technology, founder comms, why novelty matters, and how to execute in the world of marketing without sloppifying yourself. </em></p><h3>Words are Power</h3><p><strong>The thing that most people miss about marketing to humans is that humans have brains and like to use them (the ones that still read).</strong> </p><p>And don’t get me wrong. Most humans don’t read anymore. </p><p>There are articles out there about how the <a href="https://www.adorableandharmless.com/p/college-english-majors-cant-read?r=bglk&amp;utm_medium=ios&amp;triedRedirect=true" target="_blank" rel="noopener noreferrer">average college student can’t get through Dickens</a> and the moral of that story is that you shouldn’t be writing for the college kids who are using ChatGPT to write essays about “Where the Red Fern Grows”, but you should be writing for the few people that actually do still read because that’s how ideas get disseminated.</p><p>Alex Danco from a16z has an article about how “<a href="https://a16z.com/im-joining-a16z/" target="_blank" rel="noopener noreferrer">writing is power transfer technology</a>” that argues that people who do not read, do not matter. Never have. </p><p>More importantly, Danco argues that the people who do read matter more than ever. They will rule the Earth by programming their organizations with memos and recommendations and strategies because they are the tastemakers of words, which are power; which are code.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!BFqM!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!BFqM!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!BFqM!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!BFqM!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!BFqM!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!BFqM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!BFqM!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!BFqM!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!BFqM!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!BFqM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1b57100d-361a-4a81-abde-c278a1593d4a_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>So the entire game of marketing is to write things that change the minds of the most powerful: the people at every company who still read. </p><h3>Words are Code</h3><p>I think a lot about founder comms when I think about words as power transfer technology. </p><p>How persuasive someone like Zuckerberg is when discussing an acquisition of Instagram in an <a href="https://www.techemails.com/p/mark-zuckerberg-i-wonder-if-we-should-consider-buying-instagram" target="_blank" rel="noopener noreferrer">internal email</a>, how Buffett’s <a href="https://www.berkshirehathaway.com/letters/letters.html" target="_blank" rel="noopener noreferrer">shareholder letters</a> are more biblical in their simplicity and charm than professional, about how Elon’s wry sarcasm (see the <a href="https://www.tesla.com/secret-master-plan" target="_blank" rel="noopener noreferrer">secret master plan </a>for Tesla) shapes how his space, social, financial, AI, and boring companies interface with the world. </p><p>A lot of marketing is just downstream repackaging of the words penned by these executives -- I believe entire company brand strategies can be seen between the lines of writing styles. I believe the most successful marketing orgs take the word codes from founder explanations of ideas and products and rewrap them in their most native packaging for each specific medium. This is why Stripe feels so native to the Collison brothers (<a href="https://cheekypint.transistor.fm/" target="_blank" rel="noopener noreferrer">cheeky pint, wow!</a>) and also so sharp overall. </p><p>It’s also why I feel Apple struggled under Tim Cook: forcing his <a href="https://www.apple.com/newsroom/2019/01/letter-from-tim-cook-to-apple-investors/?utm_source=chatgpt.com" target="_blank" rel="noopener noreferrer">corporate writing </a>into a role with Steve Jobs-sized expectations for creativity. Suddenly Apple marketing is executing a campaign with an iPad ad <a href="https://www.youtube.com/watch?v=a3VmgPhGs14" target="_blank" rel="noopener noreferrer">that crushes dreams</a>. This is not what <a href="https://x.com/lulumeservey/status/2008187268922536109" target="_blank" rel="noopener noreferrer">Lulu</a> would’ve recommended and neither <a href="https://www.youtube.com/watch?v=dO2M30zAXuc" target="_blank" rel="noopener noreferrer">was Apple’s apology</a>.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!SFqb!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!SFqb!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!SFqb!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!SFqb!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!SFqb!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!SFqb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!SFqb!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!SFqb!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!SFqb!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!SFqb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fab38550f-9861-4646-a551-0864cdd65ca2_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I believe that how (and which) founder ideas are packaged end up programming the company, which determines who, what, when, where, and why an end consumer will touch the product. </p><h3><strong>Love the human. Be novel.</strong></h3><p>As Dan Koe <a href="https://x.com/thedankoe/status/2010042119121957316" target="_blank" rel="noopener noreferrer">says</a>: multiple deep interest havers will win in the next 2-3 years. Something big is coming, <a href="https://fortune.com/2026/02/11/something-big-is-happening-ai-february-2020-moment-matt-shumer/" target="_blank" rel="noopener noreferrer">says Shumer</a> -- where a handful of AI-enabled people are positioning themselves to drastically change the world. These are the big recommendations going around these days on the personal level. </p><p>These aren’t articles about marketing, but together they describe the kind of person marketing increasingly needs to reach: idiosyncratic, deeply opinionated, high agency, AI-enabled and increasingly difficult to capture through the internet. </p><p>The smartest people you know are going deep on interests, betting on themselves as a micro-sized world changer, and logging off the internet. Marketing strategies must change to get words (power transfer technology) into the hands of these people. It will be hard.</p><p><strong>The machines are getting better at producing everything that looks like marketing at exactly the same moment the most valuable people are getting better at ignoring it.</strong></p><p>It is an inverted world we live in: machines make content cheap and flood the zone of every digital surface with slop. Creating reading material that a living person wants to interact with, that might actually change their mind -- that is the premium content that I think will pay dividends for marketing orgs to create.</p><h3>Slop Is the Antithesis of Novelty</h3><p>As we move into the <a href="https://www.writingsbyraykurzweil.com/a-singularity-q-a" target="_blank" rel="noopener noreferrer">singularity</a>, <a href="https://www.writingsbyraykurzweil.com/the-law-of-accelerating-returns" target="_blank" rel="noopener noreferrer">as the laws of accelerating returns compress decades into minutes</a>, the people in power, the humans that read, want words that are scintillating, words that make them think and step out of time. They do not want slop, things they can scroll through while mindlessly binge watching Netflix and checking their phone for new notifications. </p><p><strong>So stop giving people slop. Give them novelty. So much novelty.</strong> </p><p>A person who wears a bear costume everywhere in public wrote the most insightful take I’ve ever seen on marketing. It goes like <a href="https://x.com/SmokeyTheBera/status/1883226061523271846" target="_blank" rel="noopener noreferrer">this</a>:</p><blockquote><p>“0 teams do marketing well, ourselves included. very low attn span actually means that the best marketing is actually more of a function of having a lot of fresh ideas as opposed to a lot of ‘marketing’”. </p></blockquote><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!bHGh!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!bHGh!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!bHGh!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!bHGh!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!bHGh!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!bHGh!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg" width="1456" height="971" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!bHGh!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!bHGh!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!bHGh!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!bHGh!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9290392c-a7a0-415c-af47-795ad912a71a_1536x1024.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>This gets to the core of marketing in 2026. It is time to only express your products and company and brand and ideas in novel ways, not in expected ways, not in easily LLM’ed ways because, well, everybody can do that.</p><p>If words are power and words are code… it’s probably worth spending A LOT of time creating words because the average decision maker is going to be inundated with slop and will not give your content much of a chance. </p><h3>Conclusion: What to Write, What to Automate</h3><p><strong>2026 is about storytelling in such a way that your LLM would have a conniption fit if you asked it if the piece of content you are working on is publishable. </strong>Or if the event you’re throwing is a good idea. </p><p>The darn technology hasn’t ever had provable new thought: stop allowing the LLM to dictate your marketing strategies -- from copy to experiences.</p><p><strong>Fuck the LLM for the things that are most important:</strong></p><ul><li><p>big ideas,</p></li><li><p>high stakes decisions,</p></li><li><p>big plans,</p></li><li><p>insane scheming,</p></li><li><p>brand campaigns,</p></li><li><p>shitposting.</p></li></ul><p><strong>Use the LLM tastefully for the things that don’t matter:</strong> </p><ul><li><p>low stakes socials,</p></li><li><p>internal memos that are not urgent,</p></li><li><p>emails (all emails),</p></li><li><p>quicker editing,</p></li><li><p>automating writing of execs for ghostwriting,</p></li><li><p>social media stats and performance roundups.</p></li></ul><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!5_TR!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!5_TR!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!5_TR!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!5_TR!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!5_TR!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!5_TR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!5_TR!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 424w, https://substackcdn.com/image/fetch/$s_!5_TR!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 848w, https://substackcdn.com/image/fetch/$s_!5_TR!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 1272w, https://substackcdn.com/image/fetch/$s_!5_TR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4348c20e-05c6-49ee-a2d6-b7ff37337710_1536x1024.jpeg 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><strong>Love the human. Be novel. Read more. Write more.</strong></p><p>-- Kram</p><p>(thank you to <a href="https://x.com/masha_vy?s=21" target="_blank" rel="noopener noreferrer">masha</a> for the edit!!)</p><p><a href="https://kramnotmark.substack.com/p/words-are-power-words-are-code">Originally published on Substack</a></p></article></noscript>
