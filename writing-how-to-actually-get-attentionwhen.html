<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">← archive</a><h1>how to actually get attention…when everyone is viral</h1><p>and the goal of words, human-written words, is to make. people. Actually. pay. ATTENTION.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!SQ9d!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!SQ9d!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 424w, https://substackcdn.com/image/fetch/$s_!SQ9d!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 848w, https://substackcdn.com/image/fetch/$s_!SQ9d!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 1272w, https://substackcdn.com/image/fetch/$s_!SQ9d!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!SQ9d!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png" width="1456" height="542" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!SQ9d!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 424w, https://substackcdn.com/image/fetch/$s_!SQ9d!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 848w, https://substackcdn.com/image/fetch/$s_!SQ9d!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 1272w, https://substackcdn.com/image/fetch/$s_!SQ9d!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F458c3bff-30a8-4ac2-be96-e1f72170534f_2056x765.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Virality and attention need to be <a href="https://x.com/emmajo/status/2104657442735046772?s=20" target="_blank" rel="noopener noreferrer">decoupled</a>.</p><p>The amount of total potential attention is fixed (only so many eyeballs on earth and hours in the day), so more people going “viral” or “creating” actually means that attention has to be further and further fragmented. So more virality = less attention.</p><p>Said another way, today you can have tens of millions of views and still be a nobody. Or your brand can have viral founders but no users. So to the point of posting your idea online, the question becomes how do you stay focused enough for people to understand what your idea is (become legible) and interesting enough that they stick around to learn why they should care (sustain attention).</p><p>Your idea is competing with everything a person would rather be doing on their phone.</p><p>And the goal of words, human-written words, is to make. people. Actually. pay. ATTENTION.</p><p><strong>A few strategies on how to actually grab and retain attention:</strong></p><ul><li><p><strong>Break the Fourth Wall Nostalgically:</strong> Nostalgia gives the reader instant context. People have a huge vocabulary of characters and memes from the history of pop culture-- which means it’s a great way to package an idea for a social algo. So lean into that! My favorite example is Ramp putting <a href="https://ramp.com/blog/ramp-names-october-15-national-expense-report-day" target="_blank" rel="noopener noreferrer">the actor who plays Kevin Malone from The Office in a glass office to process expenses by hand</a>.</p></li><li><p><strong>Give people an argument they can join:</strong> Say the thing most people might disagree with and let them argue. Though the idea has to survive after the initial virality wears off if you want to flywheel attention to followers or repeat content. Roy Lee’s <a href="https://a16z.com/announcement/investing-in-cluely/" target="_blank" rel="noopener noreferrer">interview-cheating software and Cluely launch</a> invited a question anybody could argue over: is using AI to get the answer cheating? Heh. He then consistently did the same thing over and over again (which is hard).</p></li><li><p><strong>Literally seed your idea IRL or in groupchats:</strong> Social networks reward posts that other people interact with. If your posts are not getting traction, it’s probably not because the people that are fans of you IRL don’t love you on the internet… it’s more likely that your post didn’t pop their filter bubble. Solve this by asking for advice on content before posting, sharing in a groupchat as soon as you post it, etc. The worst thing that can happen is for your friends to call you annoying and make a separate groupchat and make fun of your content, so don’t worry… Ben Roy has a good article on the <a href="https://benroy.substack.com/p/the-group-chat-theory-of-everything" target="_blank" rel="noopener noreferrer">power of groupchats</a> if you don’t believe me.</p></li></ul><ul><li><p><strong>Put an outrageous claim or image or both in the title: </strong>Lots of people never get past the title or thumbnail, so put the most interesting part where they <em>cannot</em> miss it. Socials are not for books (alas), so please don’t hide your ideas at the end of an essay. And if you have a novel idea, make it sound crazy. I thought <a href="https://x.com/ktrivs/status/2103506897534128238" target="_blank" rel="noopener noreferrer">Gooner Casino</a> fucking nailed this in that it’s a fantastic essay but SUPER clickable. Note that if you do this, if your actual content sucks, you will lose trust -- the boy who cried wolf, the poster who cried banger, etc etc.. I’m trying my best with this title haha.</p></li><li><p><strong>Be human pretty early on and throughout:</strong> An essay about friendship should start with actual human thoughts, maybe an anecdote and definitely a typo. With AI flattening everything, a return to form for handscribed screeds dressed as blogs and manifestos and obvious human formatting and ideas is a great way to stand out. I think <a href="https://substack.com/@velvetnoise/p-215344155" target="_blank" rel="noopener noreferrer">Maja</a> is the best example of this rn.</p></li><li><p><strong>Let the reader try the idea:</strong> This is the space between essays and software that Henrik Karlsson explores in <a href="https://www.henrikkarlsson.xyz/p/essays-the-size-of-cathedrals" target="_blank" rel="noopener noreferrer">Essays the Size of Cathedrals</a>, which is the idea that software and code are converging through interactive websites that make essays tangible. For example, in <a href="https://ncase.me/trust/" target="_blank" rel="noopener noreferrer">The Evolution of Trust</a>, you learn about cooperation by playing against opponents who cooperate or cheat. For an idea that involves housing, instead of writing about the injustice wrought on millennials by boomers, you might create a map where readers can own homes over decades and explore the consequences.</p></li></ul><ul><li><p>Kram</p></li></ul><p><a href="https://kramnotmark.substack.com/p/how-to-actually-get-attentionwhen">Originally published on Substack</a></p></article></noscript>
