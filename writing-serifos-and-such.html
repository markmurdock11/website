g-normal" alt="Abstract lavender Serifos landscape with a blue orb and hand-drawn horizon lines." title="Abstract lavender Serifos landscape with a blue orb and hand-drawn horizon lines." srcset="https://substackcdn.com/image/fetch/$s_!ezTI!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5c707e1b-efb8-4c1f-bec8-816909a90833_1456x971.png 424w, https://substackcdn.com/image/fetch/$s_!ezTI!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5c707e1b-efb8-4c1f-bec8-816909a90833_1456x971.png 848w, https://substackcdn.com/image/fetch/$s_!ezTI!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5c707e1b-efb8-4c1f-bec8-816909a90833_1456x971.png 1272w, https://substackcdn.com/image/fetch/$s_!ezTI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5c707e1b-efb8-4c1f-bec8-816909a90833_1456x971.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>On Serifos, I put away my phone and paid attention. It was a week of sun, breathing, movement, books, strangers, and Emma.</em></p><p><em>Welcome to <a href="https://kramnotmark.substack.com/s/kinetic" target="_blank" rel="noopener noreferrer">KINETIC</a>, a series about places, but really about love and friendship and experiencing the world through the human lens. Not the lens of a phone.</em></p><div><hr></div><h3><strong>Software Ate the World. Phones Ate My Attention Span.</strong></h3><p><strong>Life without a phone is a life of presence.</strong></p><p>Without a phone, I felt free. I also felt humiliated. Oh, how the device owns me.</p><p>When I left it at the apartment in Serifos, it often took an hour+ for the anxiety to fade. When I brought it with me, it sucked away the special moments Serifos had to offer, tricking me into one more scroll, one quick glance at the notifications. </p><p>From my phone notes:</p><blockquote><p>Thundercloud in my pocket. It smells like rain. Let me check the weather. Oh my brain, my brain it strains.</p><p>Dinner: conversation bouncing, not a screen in sight. Then one lands on the table. A blight, a blight.</p><p>Breeze on my face on a boat. Great day. I pull out my phone and feel that tightening in my throat.</p><p>A moment in between: an empty coffee cup under a tree, and a leaf. Deep green. Emerald in the light, forest in the shadow. I reach to photograph it for future me. My body reacts: fight or flee?</p></blockquote><p><a href="https://www.visitgreece.gr/en/islands/Cyclades/Serifos" target="_blank" rel="noopener noreferrer">Serifos</a> was a place to practice existing without screens. A place to be. A place to notice.</p><p>Technology turned inward: into the body. Unto the body. The body, it felt again.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Igu9!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!Igu9!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!Igu9!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!Igu9!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Igu9!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png" width="1400" height="300" class="sizing-normal" alt="Abstract hand-drawn divider in lavender, orange, and blue representing body, breath, and attention." title="Abstract hand-drawn divider in lavender, orange, and blue representing body, breath, and attention." srcset="https://substackcdn.com/image/fetch/$s_!Igu9!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!Igu9!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!Igu9!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!Igu9!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa0d9f800-9b27-476e-b265-aaa448c27ca1_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><h3><strong>Living Inside Body Futurism</strong></h3><p><strong>On Serifos, I practiced yoga twice a day. I felt self-conscious at first, calm at last. </strong></p><p><em>Below is a note I handwrote in my journal after a morning practice. </em></p><p>I felt the light and followed the energy: at the crown of my skull and in the bottom of my stomach. I breathed. I thought about the wild oregano. How it thrives on the hillside with water, sun, and stars.</p><p>I slowly continued, to the count of four. I pictured behind me everyone who helped me get here; ahead, all the people I have yet to meet. Wrapping myself in memory and love, I felt grateful for the past, excited for the future.</p><p>And I took a half breath, hands up, palms cupped to the sky. And I exhaled fast, over and over, for 45 seconds. And then I thought of nothing. And then I pushed the breath out and out and out and out to the beat of the music. I let my diaphragm work and my gut move: breathe, breathe, breathe, breathe.</p><p>Hands came to my chest. And I thought about the wild oregano again. Slowing down and fading away, slowing down and fading away. It needs so little: sun, rain, stars. I need so little: sun, rain, stars.</p><p>My biggest takeaway after a week of movement practice is that <strong><a href="https://writing.tobyshorin.com/body-futurism/" target="_blank" rel="noopener noreferrer">Toby Shorin is right: body futurism is here.</a></strong></p><blockquote><p>“There is nothing more important to the renewal of culture than the enlightenment of the body itself, the development of a new folk phenomenology, the mysticism and eroticism of the somatic in all its varieties and forms. The cultivation of deep phenomenological insight is the foundation of a new Idea of what life can be. This Idea is very nascent. But if you sit here, listen closely, settle in, feel your forehead, the bridge of your nose, your breathing chest, if you listen to your heart as it beats to you, if you hear what it whispers when you sit, when you stand, when you leave this place, when you meet another’s gaze, you can feel it, as through the gauze of a veil…”</p></blockquote><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!eAIt!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!eAIt!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!eAIt!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!eAIt!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!eAIt!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png" width="1400" height="300" class="sizing-normal" alt="Abstract hand-drawn divider inspired by yoga, breath, and body futurism." title="Abstract hand-drawn divider inspired by yoga, breath, and body futurism." srcset="https://substackcdn.com/image/fetch/$s_!eAIt!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!eAIt!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!eAIt!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!eAIt!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4e15156e-5fff-4959-8b23-ebfbfd6a9d54_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><strong>It took three days of movement and a willingness to feel a little silly while practicing breathing before attention returned to my body.</strong></p><p><strong>Then, I think, the body returned me to the world.</strong></p><h3><strong>People. Life Is About People.</strong></h3><p>I journeyed to Serifos for a week with <a href="https://www.thesacredfig.com/retreats/greece" target="_blank" rel="noopener noreferrer">Sacred Fig</a>. It was a week of yoga and I was excited about designated time to re-learn how to move my body as someone who has a right leg with four knee surgery credits, along with 3-4 fractures along the ankle and the hip.</p><p>But the thing that surprised me most on the trip was…how a lack of phone and learning something new with other people really broke up my personality (usually deeply introverted) more than it did my aching muscles and joints.</p><p>Below are a few notes from my journal of that week that focused on the people I met on this trip. You won’t know them or the context of the trip or anything like that and I am not using last names, but I think it’s still, maybe, interesting.</p><p>As I edit these words now, back in the real world, I’m struck by how detail-forward my notes were, how excited I was about such small interactions. I’m shocked at how… outgoing I seem and how interested in other people I was. </p><p>I lend this to the lack of phone and the joy of learning new movements.</p><div><hr></div><p>Anton and Tony, I think, share a name and a home and a relationship. Or at least the roots of a name, and definitely the roots of a deep love. Anton and Chloe, I think, share a love: a love for teaching and a love for movement and a love for life.</p><p><a href="https://www.thesacredfig.com/about/teachers/anton-brandt" target="_blank" rel="noopener noreferrer">Anton</a> is a hustler by nature, magnetic. A TV character embodied in reality, somehow better than anything fiction could come up with.</p><p>White smile, eyes like an eagle, passionate but sharp-edged and confident while also being welcoming. An interesting combination. When he teaches yoga, it reminds me of reading a hard book. I must pay attention, I must double back to concepts I didn’t quite get, I am stretched and I am working and I know if I do this thing, I will be better for it. Tony is compact and subtle; he moves in a tensile manner, like someone who spent years doing high-flying acrobatics at the circus. His smile reaches his eyes and his voice cracks with sincerity. A yoga teacher by trade, he was there for Anton but also for us: the icebreaker for the group, the glue for the day.</p><p><a href="https://www.thesacredfig.com/about/teachers/chloe-kernaghan" target="_blank" rel="noopener noreferrer">Chloe</a> is pregnant, near bursting, and when she teaches yoga it feels like a conversation over a warm cup of coffee on a Sunday afternoon.</p><p>I want to stretch and sigh and I find myself thinking pleasant thoughts that gently push me toward a better life, a feeling of optimism. Her smile is BIG and it makes you feel like the only person in the room, despite it obviously being a class with 40 people. These were the two men and one woman who spent the better part of three hours every day sharing their practice of movement, of yoga, and also of presence.</p><p>I spent a week learning to practice yoga with a group of people who were beautiful and powerful and strong and interesting but, most importantly, they were, meaning they are. Meaning these people were present and full and so much fuller than any adjectives I could use to describe them.</p><p>There was Sarah with an H, who had just quit her job to found her second business. She is a mother of two and a partner of one. Sarah glows with authority: rosy with passion, sweet and understated. She is French and was cautious at first... but that didn’t last long. Her business will be a physical space in Paris, something to do with premium luxury: perhaps wine, perhaps a retreat. It could be anything because Sarah, I have no doubt, will turn any idea worthy of sinking her teeth into a reality.</p><p>And then there was Michele, glowing with life. She consistently dodged questions about her background, calling everything she had accomplished small and tiny, which was such a giveaway that those things were big and important. I have Southern roots and know how to converse in humility. A few years ago, Michele survived a serious health crisis. Emma cried when she heard the story on the second-to-last night. Everybody is deeper than they first appear.</p><p>I could go on and on and on about the people I met here. Patrick likes ice cream, like a lot. Ann and Brady are star-crossed besties. Donna, well, Donna is Donna! Jo is questing around Greece. Melina is a mother and is best friends with Tori and Bri, and they absolutely made me laugh, swimming from shore to boat while carrying, just above the break of the waves, a bottle of tequila.</p><p>I don’t know. These are little details, but I remember these small details so crisply.</p><p>I bet I know more about these people than about most of my co-workers. Hm.</p><div><hr></div><p>Re-reading these notes, I am excited to challenge myself to bring this type of engagement back to Vancouver and such.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!82_p!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!82_p!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!82_p!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!82_p!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!82_p!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png" width="1400" height="300" class="sizing-normal" alt="Abstract hand-drawn divider marking the return from the retreat to everyday life." title="Abstract hand-drawn divider marking the return from the retreat to everyday life." srcset="https://substackcdn.com/image/fetch/$s_!82_p!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!82_p!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!82_p!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!82_p!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fac562003-9491-4f7a-b33d-8d2fb9ff686c_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><div><hr></div><h3><em>Infinite Jest</em> and Breathing</h3><p>Books often find me at the right time. I buy a lot of them and start a lot of them, but leave many strewn around the apartment (sorry Emma), unfinished but with their ideas percolating.</p><p>I bought <em>Infinite Jest</em> in London and thought it was a London book. It was not. Then Berlin: surely <em>Infinite Jest</em> was a Berlin book, psychedelic and such. No. I couldn’t get past the first page.</p><p>But on Serifos, with work on the back burner and my phone mostly off, my usual addictions were far enough away that I could finally deal with it.</p><p><em>Infinite Jest</em> is a book that doesn’t end. A book that loops. Simple moral platitudes (honesty is good, drugs are bad, family is important, hard work pays off) hide behind too many characters, acronyms, and footnotes. It forces the reader to follow, think, guess, double back, reread. I dreamed a lot while reading it. Weird dreams I don’t remember, though I remember dreaming, and I rarely dream.</p><p><em>Infinite Jest</em> rewrites your brain if you allow it: fiction that hides facts of life. The parallels to Hal’s sports upbringing rang true for me, a kid whose dad played quarterback at the University of Texas. And as someone whose job often involves trying to control algorithms while remaining a slave to the always-on chase for sentiment among the scrollers, it was a book for me. A novel that treats reading as a drug was perfect for a week unplugged. </p><p>The book and a lot of the movement and breathing practices I learned asked the same thing: pay attention.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!zM8I!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!zM8I!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!zM8I!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!zM8I!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!zM8I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png" width="1400" height="300" class="sizing-normal" alt="Abstract hand-drawn divider inspired by Infinite Jest, loops, and sustained attention." title="Abstract hand-drawn divider inspired by Infinite Jest, loops, and sustained attention." srcset="https://substackcdn.com/image/fetch/$s_!zM8I!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!zM8I!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!zM8I!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!zM8I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5320b869-dcb6-4fe3-9c63-5b26d9d618f1_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><h3>And Emma</h3><p>For Emma and me, Serifos was our first time alone together with neither of us having a job calling for our attention. We relished and relaxed in each other’s presence. We sat by the water and we read our books and we sat on our patio and we laughed and we walked everywhere and we did yoga with our mats right next to each other.</p><p>And I fell in love with her even more than I had imagined I could.</p><p>One night, after a dinner upon a hill overlooking the ocean, we walked home. It was a 45-minute walk, and it was dark, so dark, and there were no streetlights and very few cars and it was just us and it was after midnight and we walked. And the stars shone so bright and we talked and we walked and I do not remember what we spoke of but I remember that she was wearing my favorite dress of hers and she looked so beautiful and she made me smile and it was a night, under those bright, bright stars on the island of Serifos, that I wished I could’ve frozen forever.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!9Fi6!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa822d9b6-f5d4-4132-a728-c4018d85b386_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!9Fi6!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa822d9b6-f5d4-4132-a728-c4018d85b386_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!9Fi6!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F
