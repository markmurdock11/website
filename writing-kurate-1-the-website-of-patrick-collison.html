-a1dc-0ad9969ab541_510x532.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h3><em><strong>His website is the apex predator of the millennial internet.</strong></em></h3><p>This should come as no surprise because…<br><br>• Patrick Collison is at the helm of a company with the mission to increase the GDP of the internet… making him essentially whatever the head of the Federal Reserve is of the Internet.<br><br>• Patrick Collison was born in the year before Taylor Swift, a date every reader here unwillingly memorized. Millennials are a weak generation, but Collison's strong command of the personal website should come as no surprise as a man born in the Atlman-Swift gap of 85-89, which also includes AOC, PewDiePie, Whitney Wolfe, Kendrick Lamar, and Vivek Ramaswamy.</p><h3><em><strong>Patrick is a plaintext maxi and hyperlink king. </strong></em></h3><p>His is not a website for fans of picture books. If you were to go to <a href="http://patrickcollison.com" target="_blank" rel="noopener noreferrer">patrickcollison.com</a>, here is what you would find:</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!Q5Q5!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 424w, https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 848w, https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 1272w, https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png" width="600" height="454" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 424w, https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 848w, https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 1272w, https://substackcdn.com/image/fetch/$s_!Q5Q5!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F09dbad49-a01f-4a4a-b60c-74a04d80cf4e_600x454.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><br>Do not be deceived by its sheer simplicity. These categories encapsulate the lifetime of a curator in their prime.</p><h3><em>For today, the recommendation is to click on four links:</em></h3><ul><li><p><a href="https://patrickcollison.com/advice" target="_blank" rel="noopener noreferrer">Advice</a> – fifteen bullet points of advice for people ages 10-20. My favorite: “More broadly, nobody is going to teach you to think for yourself. A large fraction of what people around you believe is mistaken. Internalize this and practice coming up with your own worldview. The correlation between it and those around you shouldn't be too strong unless you think you were especially lucky in your initial conditions.”</p></li><li><p><a href="https://patrickcollison.com/bookshelf" target="_blank" rel="noopener noreferrer">Bookshelf</a> – autists know that Patrick used to highlight books that he liked on this page, but it appears he stopped doing so and has updated it to a list of 780 books that he physically owns. Whenever I find myself looking for a book to read, this is one of my first stops. It is one of those places on the net makes me so thankful it is free. Imagine being able to go into Steve Jobs’s personal library and borrow any book you want at any time. This link will also let you find Stripe Press, which deserves its own Curate later on.</p></li><li><p><a href="https://patrickcollison.com/links" target="_blank" rel="noopener noreferrer">Links</a> – this link is how I found Gwern. If you haven’t found Gwern, it might be too late to escape the permanent underclass. But you will at least have a thrilling weekend.</p></li><li><p><a href="https://patrickcollison.com/questions" target="_blank" rel="noopener noreferrer">Questions</a> – twenty three of them to be exact, with attempts at answers. The following questions are covered if you dare to click: “How can we better understand the dynamics of progress in science?” “What's the successor to the book? And how could books be improved?” “What does religion cause?”</p></li></ul><h3><em>This is my favorite website on the internet.</em></h3><h3>And it is Kurate #1, receiving a score of…<em><strong>4.9/5</strong></em></h3><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!NSeJ!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!NSeJ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 424w, https://substackcdn.com/image/fetch/$s_!NSeJ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 848w, https://substackcdn.com/image/fetch/$s_!NSeJ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 1272w, https://substackcdn.com/image/fetch/$s_!NSeJ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!NSeJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png" width="846" height="584" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!NSeJ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 424w, https://substackcdn.com/image/fetch/$s_!NSeJ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 848w, https://substackcdn.com/image/fetch/$s_!NSeJ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 1272w, https://substackcdn.com/image/fetch/$s_!NSeJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0e88bfbb-3e8a-4c6f-8d70-29f275c5ee34_846x584.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a><figcaption class="image-caption">If you take the time to truly grapple with each page of Patrick’s website, it could lead to a lifetime of learning.</figcaption></figure></div><p>Patrick has taken the time to document book recommendations, surface unanswered questions, and curate a list of topics and ideas that range from the history of Silicon Valley to the problem of air pollution to advice for 10-20 year olds.</p><p>If you take the time to truly grapple with each page of Patrick’s website, it could lead to a lifetime of learning.</p><div><hr></div><h2>More Like This</h2><p>– <a href="https://paulgraham.com/" target="_blank" rel="noopener noreferrer">Paul Graham’s Website</a><br><br>– <a href="https://vitalik.eth.limo/" target="_blank" rel="noopener noreferrer">Vitalik Buterin’s Website</a><br><br>– <a href="http://Gwern.Net" target="_blank" rel="noopener noreferrer">Gwern.Net</a></p><div><hr></div><h2>About Kurate</h2><p>The internet is full of corners. It is a library of sorts, but with a Dewey Decimal system built for machines. Not for mankind. There are endless paths to walk upon, to holes to burrow into. The vast circuitry of the worlds information is ever unfolding.<br><br>Curation is the keystone for the human experience on the internet going forward. The ephemeral sense of taste melded with trend-tracking today’s reality, combined with references across both subject and time. Vertical, horizontal, deep must the curator go.<br><br>This is a newsletter about the internet. It is part museum, part food-blog but for blogs. It is a place to find other places so that the time you spend on the internet is not wasted on YouTube recommendations that entrance you but leave feeling empty. Or instagram or TikTok reels that teach you a shallow lesson or imbue you with a shallow laugh.<br><br>Every once in a while (though many times this week), you will find a small note from Kurate. It will contain a recommended link to click. It will then give a description of the link in the form of a movie or art review. </p><p>I believe that the internet is an art form and that links are a canvas and what goes into the links – the text, media, and code of a website or a file sitting on a website – is the paint and that the creator of the link is an artist.<br><br>This was the first version of Kurate, I hope you enjoyed.</p><div><hr></div><p><a href="https://kramnotmark.substack.com/p/kurate-1-the-website-of-patrick-collison">Originally published on Substack</a></p></article></noscript>
