" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!56hX!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F60f486a3-6190-49a4-b4ed-1326a80a064c_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!56hX!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F60f486a3-6190-49a4-b4ed-1326a80a064c_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!56hX!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F60f486a3-6190-49a4-b4ed-1326a80a064c_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!56hX!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F60f486a3-6190-49a4-b4ed-1326a80a064c_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><strong>Stablecoins collapse payments</strong></h2><p>The entire crypto industry is up in arms about stablecoins. About how the world will change through the might of digital dollars separated from time and space.</p><p><em>Instant payments. Cheap settlement. Banking the unbanked.</em></p><p>Think about the existing plumbing for moving dollars: FedNow, ACH, SWIFT, PayPal, Visa. All of these platforms exist only because the underlying unit of value was trapped in legacy systems that could not move at internet speed. </p><p>Stablecoins collapse that entire stack into the token itself. </p><p>A dollar becomes a package of data. It moves for cents in seconds. It settles across networks on a level playing field where the medium is the money. No slippage at size, no middlemen, no clearing windows.</p><p>That’s why tokenized dollars are now a $250B market growing at double-digit rates (where even <a href="https://x.com/SecScottBessent/status/1935027160374210573" target="_blank" rel="noopener noreferrer">Bessent is calling for trillions</a>). </p><p>But stablecoins and tokens solve only one side of money: value in motion.</p><p>The other side -- the larger pot -- is value at rest.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!WDgC!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!WDgC!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!WDgC!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!WDgC!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!WDgC!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!WDgC!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!WDgC!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!WDgC!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!WDgC!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!WDgC!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff18c96c2-1dcd-4c89-82e9-cd18dc03025d_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><strong>Vaults collapse deposits</strong></h2><p>If stablecoins collapse the infrastructure built for moving dollars, vaults collapse the infrastructure built for storing them.</p><p>When money isn’t in transit, it is in stasis. </p><p>Deposits. Savings accounts. Certificates of deposit. Repos. Money market funds. These are all wrappers around the same basic idea: you put capital in, you lock it, and you get a claim on yield. </p><p>TradFi built entire industries around these forms of deposits – just as it built FedNow, ACH, SWIFT, and PayPal around payments.</p><p>Consider the scale:</p><ul><li><p>$110B in DeFi vaults today across lending, staking, yield, and liquidity.</p></li><li><p>$1T in U.S. margin debt secured against stocks.</p></li><li><p>$3–10T in time deposits, CDs, repos, and money market funds globally.</p></li><li><p>$43T in locked into 401Ks (not a 1:1, I admit)</p></li><li><p>$100T+ sitting in bank accounts worldwide.</p></li></ul><p>A vault follows the same functions as the products above, just expressed in code. </p><p>Vaults are smart contract that accepts deposits and issue receipt tokens (rather than just the claim on yield). Just as stablecoins embed the payments stack into a token, vaults embed the deposit stack into a contract.</p><p>Instead of needing separate rails for savings accounts, checking accounts, term deposits, MMFs, or repo, you have one programmable primitive: deposits plus receipt issuance.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!guoP!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!guoP!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!guoP!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!guoP!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!guoP!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!guoP!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!guoP!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!guoP!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!guoP!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!guoP!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa677bfef-c6ea-4d56-a306-c5a022d52c32_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Vaults were a major catalyst for DeFi’s 0→1 moment. Vaults simply enable tokens to be deposited, a receipt to be issued, and, most importantly, value to be looped<strong>. </strong></p><p>This type of smart contract gave birth to Aave, Uniswap, Ethena, EtherFi — decentralized applications that allow anyone anywhere to borrow, lend, swap, and earn yield without a physical bank.</p><p>It is clear now, a few years after DeFi summer, that a single vault on a single chain is more powerful than a bank account because the receipt is programmable and composable and access is permissionless. You can lend, stake, collateralize, or move it without needing banking hours or an accountant. The receipt token in particular is special, as it is something banks do not give depositors. You don’t walk away from a savings account with a token you can reuse elsewhere: your debt isn’t liquid. In TradFi, only banks package and move those claims. In DeFi, every depositor gets a receipt they can use directly.</p><p>In other words, vaults transform the messy, jurisdiction-bound infrastructure of deposits into a single rail where the receipt itself is liquid and usable.</p><h2><strong>Stablecoins Are the 0-1 for Money Movement and Vaults Are 1-100 for Money Storage</strong></h2><p>Vaults will win for the same reason tokenization will win: financial primitives only realize potential when they are not bound by border.</p><p>Stablecoins captured the spotlight because payments are obvious. But they were also the Trojan horse: in making money in motion programmable, they paved the way for deposits to become programmable too and the receipt tokens to be liquid. </p><p>The stablecoins are beautiful trees, vaults are the forest (hence the fish and pond title).</p><p>Overall, deposits are a $100T opportunity capped only at the amount of value that can sit in any account, in any bank, in any jurisdiction. Stablecoins are an opportunity capped somewhere in the tens of trillions: in how many dollars are demanded for payment or storage of value. </p><p>And as we go forward, more efficient motion and more accessible stasis reinforce each other in terms of making the entire money system better. </p><ul><li><p>Cheap, instant settlement makes deposits and withdrawals easier. </p></li><li><p>Open, global deposits give settlement a deeper surface to land on.</p></li></ul><p>This is the effect of crypto rails -- this technology is built so that money can be coordinated by humanity better. </p><blockquote><p>Stablecoins are the fish. But the pond, vaults, is far larger. It is what gives life to the fish. Together, they will rewire finance itself. </p></blockquote><p>Best,</p><p>Kram</p><p class="button-wrapper"><a class="button primary" href="https://kramnotmark.substack.com/subscribe?" target="_blank" rel="noopener noreferrer"><span>Subscribe now</span></a></p><p><a href="https://kramnotmark.substack.com/p/the-fish-stablecoins-are-much-smaller">Originally published on Subs
