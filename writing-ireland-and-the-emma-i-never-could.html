normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!F4sz!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0cb8c7cc-4a7f-4b9e-8179-df1f21129c89_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!F4sz!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0cb8c7cc-4a7f-4b9e-8179-df1f21129c89_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!F4sz!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0cb8c7cc-4a7f-4b9e-8179-df1f21129c89_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!F4sz!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0cb8c7cc-4a7f-4b9e-8179-df1f21129c89_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>Welcome to <a href="https://kramnotmark.substack.com/s/kinetic" target="_blank" rel="noopener noreferrer">KINETIC</a>, a series about places, but really about love and friendship and experiencing the world through the human lens. Not the lens of a phone. This is the first post.</em></p><p><em>I visited Ireland with <a href="https://x.com/emmajo" target="_blank" rel="noopener noreferrer">Emma</a> in June, while on a sabbatical from work that has turned into unemployment (positive). </em></p><p><em>It was in Ireland that I was able to shed the weight of screens for the first time in five years, yes. But more importantly, it was here that…</em></p><div><hr></div><p>I met the Emma I never could have known in sunny Ireland, in rainy Ireland, in the streets of Cork, her childhood home, her home away from her home in Vancouver.</p><p>We spent the week walking and driving and stumbling and eating and drinking down the roads of memories past and stories told.</p><p>It was a week of nostalgia crossed with the sparkle of romance. It was old made new again as Emma danced across the stones embedded with some of her most cherished memories on the long walk from <a href="https://www.maryborough.com/" target="_blank" rel="noopener noreferrer">The Maryborough Hotel</a> to Cork. It was new made old as we drove past Emma’s childhood home, an adorably shaded two-story in the heart of a green, green neighborhood, now twenty-seven years past being hers.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!DlJI!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!DlJI!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!DlJI!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!DlJI!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!DlJI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!DlJI!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!DlJI!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!DlJI!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!DlJI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb6fb92f0-263e-49a0-a41e-348fdb7a4b9d_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>There is a spa at The Maryborough Hotel, the famous-in-our-relationship hotel where Emma worked as a teenager, where the Johnson family stayed upon arriving in Ireland, and where the O’Sullivan family hosted us in June. It is the Irish version of the hotel from <em>The Suite Life of Zack &amp; Cody</em>, and it is ideal.</p><p>The spa is adjacent to the gym and gives Maryborough guests a sauna, a shower, what has to be an award-winning steam room, and a pool, all shadowed in a sparsely lit three-room compound. I spent hours there, in the dark, in the hot, without a screen. This trip was part of my sabbatical, which meant no work, and this was the first place in a long time where I actually let go of the stress and just allowed the brain to wander, without presumption.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!_YzY!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!_YzY!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!_YzY!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!_YzY!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!_YzY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!_YzY!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!_YzY!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!_YzY!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!_YzY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe4275089-b062-4ac4-a82a-e5d934806952_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>Hosting is of first nature to the Irish.</p><p>There is conversation and then there are <em>conversations</em> and then there are <em><strong>conversationalists</strong></em> and then there is the <strong>Irish lad named Ben</strong> who picked me up from the airport in Dublin, took me to breakfast, drove me across country to Cork, and then hosted me and Emma for dinner. Five hours, no lulls, and a lot of Irish music.</p><p>An old friend of Emma’s, Ben was the start of my trip to Ireland and a perfect embodiment of what I feel Ireland does best: long friendship, genuine hosting, sarcastic conversation, and so much love for life.</p><p>From there, Emma and I shared the table for dinner with a new couple almost every night. Indian at the Carroll family home, right off the plane. <a href="https://isaacsrestaurant.ie/" target="_blank" rel="noopener noreferrer">Isaac’s</a> with the O’Sullivans. A four-course, home-cooked meal across the street from Blarney Castle. Too many stouts with an Irishman named Danny across the pubs of Cork. </p><p>The thing with the hosting is that it seems to be second nature to the Irish, from the way their houses are set up to the coziness of their bars to their upbringing to the way they build their cities. It is a place to share experiences and to chat. I loved it.</p><p>I visited two homes and whiled away a the minutes before dinner in perfectly constructed sitting rooms, with no TV, conversing apart from the kitchen. A small detail, but I find the architecture of such things quite important — that the sitting rooms of Irish households are still used, untouched by screens. It is a country of soft edges and big cushions, where family scrapbooks beg to be opened.</p><p>I found the pace of play in Ireland such a delight, with multiple courses and an understatement of the food on the table. I learned quickly that “just a bit” means quite a lot and a “quick, thrown-together meal” means a four-course, home-cooked lasagna. The only answer to “would you like more?” is “absolutely,” even if your stomach is bursting at the seams.</p><p>What a beautiful introduction to a new country: the gift of being hosted.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!sfwb!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!sfwb!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!sfwb!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!sfwb!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!sfwb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!sfwb!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!sfwb!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!sfwb!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!sfwb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe9324866-9aa3-4666-9f3c-b441ef27004c_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>Ireland is a chatty place.</p><p>Emma and I sat in the bar of the Maryborough for hours. She was working, I was reading. There was a constant uplifting babble going on that was optimistic and endearing and always on -- a far cry from what you hear in North American places.</p><p>The conversations I encountered and overheard in Cork itself were personal and gloriously unprofessional and detail-oriented. I think I met two people with near-perfect memories, Ben and Joe, who ingested and remembered each name and nuance of a story and then embedded those details into later topics. </p><p>Everybody I met remembered everything about the Johnson family and Emma’s parents. They asked after Mayne Island and then fake-hesitated, as if they couldn’t remember the age, before asking about Emma’s “three-year-old nephew.” </p><p>There were many exclamations about Emma’s sister Chantal and her fiancé Doug, the future parents of one of the luckiest girls in the world. When it came to me, the dumb American, questions about Houston, my brothers, and Texas were folded quite nicely into the conversation, involving me and welcoming me to the country.</p><p>There is a certain bounce to an Irish conversation that is different from what I find in North America, which is usually tête-à-tête or linear. One topic, both speakers hit it; a new topic, both speakers share an opinion; etc., etc.</p><p>In Ireland, there is an opinion, then a story, then a follow-up question, then another story, then a side comment, then, and this is where they show such care and earn their title as conversational extraordinaires, they come back and ask for your opinion on the original topic again based on all the information now shared. </p><p>This then sets off a new set of rabbit holes to dig and escape and by the time you finish your drink you realize that a question about the weather in Texas somehow ended up as a debate about the difference between the taste of Beamish and Murphy’s and the history of why the Irish do not like the English — except how sometimes the English are fine — except also the English are sort of crummy.</p><blockquote><p>Conversation is certainly an art form in Ireland. The gift of the gab.</p></blockquote><p>Ireland is a place to talk about anything but ourselves, and often to explain the world through the lens of family. Kids, cousins, aunts, uncles, parents, anyone with blood relations are fair game. Heritage and community: family seems to be the pride of the Irish. </p><p>I found myself excited to be a brother and a son and a friend in Ireland and to share that excitement.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!nMYj!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!nMYj!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!nMYj!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!nMYj!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!nMYj!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!nMYj!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!nMYj!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!nMYj!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!nMYj!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1a460fd5-c307-4257-a1c9-2df0184e63e6_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>It seems, in Ireland, friendship runs deep, like family.</p><p>Another thing that amazed me about Ireland is how the Johnson family created such strong roots in the four short years they lived there before returning to Vancouver, and also how much effort the Irish seem to put into maintaining ties across time and space. It is an effortful country for friendship. </p><p>These are people who had gone years without seeing each other, who had little reason to stay in touch across the Atlantic and the years gone by, but who met each other with something akin to love. It was such a thing to behold.</p><p>So many people went out of their way to spend extravagantly slow time with Emma and me during our trip: to walk us around, share their homes with us, and, somehow, always, ALWAYS pick up the check. I don’t think I paid for a single thing in Ireland -- and in the US, I am usually the one who prides himself on picking up the dinner bill with friends, as that is the point in life.</p><p>I truly have never been around such grand hospitality and friendship. </p><p>Emma makes much, much more sense after a week in Cork. </p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Ehw3!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!Ehw3!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!Ehw3!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!Ehw3!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Ehw3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!Ehw3!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!Ehw3!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!Ehw3!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!Ehw3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faf8ff95c-112a-4c2c-815f-fcc7b459d1f5_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>I had dinner with the proprietors of Longueville House, a four-course meal followed by a pint of Murphy’s at their local pub. Murphy’s, Guinness, Beamish: the only correct ranking of stouts. Murphy’s is like maple syrup, and I already miss it. </p><p>On the road back from dinner there in Blarney, at 10 p.m. -- it stays light that late on Irish summer evenings -- we passed the Apple campus in Cork.</p><p>A compound upon a hill: even Cork cannot withstand the reach of technology.</p><p>Yet despite that one scene, nowhere have I ever felt more detached from technology than Ireland. Many restaurants and rooms did not have TVs and if they did, they were tuned to sports, not the news or a movie. People were not glued to their phones in public, and conversations did not bounce toward doom-and-gloom tech.</p><p>There was a brief bit about AI mentioned here or there, but never Claude versus ChatGPT or AI versus the environment or something like that, mostly just, “Wow, it feels like something crazy is happening that we don’t understand, but okay.”</p><p>I really loved that there was not a single mention of the <a href="https://ir.spacex.com/updates/releases-details/2026/Space-Exploration-Technologies-Corp--Announces-Pricing-of-Initial-Public-Offering/default.aspx" target="_blank" rel="noopener noreferrer">SpaceX IPO</a>, despite it happening while we were there.</p><p>In general, Ireland felt 10 years culturally behind the US: acai bowls, restaurants built for 2017 Instagram, and conversations about tech and culture where Katy Perry and Justin Trudeau came up multiple times.</p><blockquote><p>Lots of people said, separately, that things felt like 2008: people in Ireland were getting ahead of their skis regarding purchases, that house prices couldn’t hold, and a big crash might be coming. Many people worried about a big crash coming. </p></blockquote><p>But enough about the world. </p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!1Dqx!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 424w, https://substackcdn.com/image/fetch/$s_!1Dqx!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 848w, https://substackcdn.com/image/fetch/$s_!1Dqx!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 1272w, https://substackcdn.com/image/fetch/$s_!1Dqx!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!1Dqx!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!1Dqx!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 424w, https://substackcdn.com/image/fetch/$s_!1Dqx!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 848w, https://substackcdn.com/image/fetch/$s_!1Dqx!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 1272w, https://substackcdn.com/image/fetch/$s_!1Dqx!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F561d8bf8-071c-45bb-911d-22de69f150be_1400x300.webp 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>At the end of the week, I kept thinking about how much of a person is built by the place that knew them before you did.</p><p>I met Emma in Vancouver, but I met another Emma in Cork, the city where she was born, in the sitting rooms and bars and hotel corridors and long walks and too much food and five-hour conversations with no lulls. I met the Emma who belonged to stories I had only heard and streets I had never walked and families who knew her parents and old friends who could pick us up at the airport and drive us across Ireland as though no time had passed.</p><p>I loved Ireland for the hosting and the chatting and the stout and the rain and the sun and the coziness and the strange feeling that the whole country had quietly agreed to keep some parts of life sacred. </p><p>But really I loved Ireland because it let me see Emma as old made new and new made old.</p><p>Oh Ireland and the memory I now have, of Emma walking through a place that knew her before I did, and me getting to walk beside her.</p><div><hr></div><h6>Thanks for reading and thank you Ireland and sorry for the sweeping generalizations, but it was a country that swept me away. </h6><h6>Next up is Crete, which will have a bit more technology and such embedded into the narrative. </h6><h6>- Kram</h6><p class="button-wrapper"><a class="button primary" href="https://kramnotmark.substack.com/subscribe?" target="_blank" rel="noopener noreferrer"><span>Subscribe now</span></a></p><p></p><p><a href="https://kramnotmark.substack.com/p/ireland-and-the-emma-i-never-could">Originally published on Substack</a></p></article></noscript>
