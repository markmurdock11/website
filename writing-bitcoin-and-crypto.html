<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">← archive</a><h1>Bitcoin Is Gold, but Better (and Crypto Is Just Better)</h1><p>From the Archive — gold but better, orange coin, and the onchain future.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!Ev29!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!Ev29!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!Ev29!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!Ev29!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!Ev29!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!Ev29!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!Ev29!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!Ev29!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!Ev29!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!Ev29!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5800541-0a0e-4209-a09e-16628c018f11_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Here is a four-part essay, structured as follows.</p><div class="pullquote"><p><em>1. Bitcoin</em></p><p><em>2. And</em></p><p><em>3. Crypto</em></p><p><em>4. Bitcoin and Crypto</em></p></div><h2>Bitcoin</h2><p>My most basic belief is that a single bitcoin will be worth $1 million before 2030.</p><p>It is the easiest 10x of a generation, the Gen-Z version of going to college for $100 or buying a house for $25K -- opportunities that existed for our parents, but not for us. If you fast forward 30 years, kids will be gasping in disbelief at how lucky we are for being able to afford .1 BTC after only saving for a year. This is just how the world goes. </p><p>I have two reasons for why bitcoin will continue to rise:</p><h3>Part One…</h3><p>of the thesis is that BTC is comparable to gold in that it is obviously better. The supply of Bitcoin is capped. It is easier to hold, buy, and sell than gold. Governments cannot control it as easily (as most of the supply is already mined and not owned by the government, unlike gold). Bitcoin is digitally native. The world is only in the first inning of being online. Native internet existence is only going to trend up as the years go by. Fading Bitcoin, the best internet money, as the internet moves from infancy to youth, is the dumbest trade you can make. </p><p>The million dollar BTC number is rooted in gold’s valuation of roughly $10T. Poetically, <a href="https://www.piratewires.com/p/biggest-names-crypto-trump-and-bitcoin-predictions" target="_blank" rel="noopener noreferrer">when Bitcoin reaches a market cap of $10T in parity with gold, a single BTC will be around $900K</a>. $1M bitcoin gets bonus points for memetic value in a memetic world (tis so ridiculous it has to become true). Memes win and orange coin good; only 21 million bitcoins exist; money printer goes brrr; Bitcoin not blockchain; etc etc. </p><h3>Part Two…</h3><p>of the thesis is that I think the US government is going to do two things:</p><ol><li><p>buy bitcoin and create a strategic reserve</p></li><li><p>print more money.</p></li></ol><p>Both will be good for the price of bitcoin, with the strategic reserve likely being pushed ahead by Elon Musk, <a href="https://www.coindesk.com/tag/elon-musk/" target="_blank" rel="noopener noreferrer">who holds Bitcoin personally and on the balance sheet of both Tesla and SpaceX</a>. The government is just his next company and it makes sense that he will add crypto’s gold to the balance sheet. Trump himself also seems to be pushing forward with crypto favoritism. Having already <a href="https://www.wired.com/story/trump-world-liberty-financial-crypto-defi/" target="_blank" rel="noopener noreferrer">launched a DeFi app,</a> he is rumored to be<a href="https://www.cnbc.com/2024/11/18/trump-media-in-reported-talks-to-buy-crypto-trading-platform-bakkt-sending-shares-soaring.html" target="_blank" rel="noopener noreferrer"> looking at the purchase of a crypto</a> exchange (Bakkt). He also hinted that “<a href="https://www.coindesk.com/business/2024/06/12/trump-we-want-all-remaining-bitcoin-to-be-made-in-usa/" target="_blank" rel="noopener noreferrer">all bitcoins will be made in america</a>” earlier this year at a crypto conference (what a meme!). Orange man like orange coin, so it appears.</p><p>On the printing side of things and government stuff, it’s just a matter of time, as explained by Arthur Hayes (to be clear, this is a bit pie in the sky to get debt/gdp ratio this low. If u want something more realistic as a mental model, just think about whether the government will or will not print more dollars in future and whether u want to hold an inflating currency during this time period):</p><blockquote><blockquote><p><em>“It took $4 trillion to decrease the debt-to-nominal GDP ratio from 132% to 115%. Let’s say the US reduces it further to 70%, which is where the ratio was in September 2008. Just using a linear extrapolation equates to $10.5 trillion of credit that must be created to accomplish this deleveraging. This is how Bitcoin goes to $1 million, because prices are set on the margin. As the freely traded supply of Bitcoin dwindles, the most fiat money in history will be chasing a safe haven from not just Americans but Chinese, Japanese, and Western Europeans. Get long, and stay long. If you doubt my analysis of the impact of QE for poor people, just read up on the Chinese economic history of the past thirty years, and you will understand why I call the new economic system of Pax Americana, “American Capitalism with Chinese Characteristics.”” -- <a href="https://cryptohayes.substack.com/p/black-or-white?utm_source=post-email-title&amp;publication_id=1616843&amp;post_id=151515391&amp;utm_campaign=email-post-title&amp;isFreemail=true&amp;r=ixg2v&amp;triedRedirect=true&amp;utm_medium=email" target="_blank" rel="noopener noreferrer">Arthur Hayes</a></em></p></blockquote></blockquote><p>Again, that’s just a basic thesis.</p><p>Far more boring ideas are written down elsewhere that have things to do with network strength, austrian economics, more trump, and BTC as the reserve currency of DeFi, DeFi on Bitcoin, but those are essays for another day and another audience. </p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!RmbV!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!RmbV!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!RmbV!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!RmbV!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!RmbV!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!RmbV!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!RmbV!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!RmbV!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!RmbV!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!RmbV!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F388b474b-6eff-44b5-b8b9-06c58ab0a675_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2>And</h2><p>Overall, crypto is about to explode. Bitcoin is now a $2 trillion asset and the 8th largest asset in the world, surpassing silver just two weeks ago. Crypto itself is a $3 trillion asset class and will be closer to $4T by the time you finish reading this essay.</p><p>There are just so many damn use-cases that make crypto better than what exists in the “real world” -- that stodgy place of bankers and middlemen and fintech platforms, the soul sucking stuff that the anti-crypto crowd accidentally champions because they are scared of something new.</p><h6>(side note: anti-crypto is an addiction to what is, stopping you from excitement about what could be. Remember that the next time you scoff at Bitcoin: a scoff at crypto is the same as cheering for JP Morgan, which is just weird as hell.)</h6><p>On crypto being better than what exists in the real world. <a href="https://www.coinbase.com/en-ca/learn/crypto-basics/what-is-a-stablecoin" target="_blank" rel="noopener noreferrer">Stablecoins</a> like USDC let you send money in the world without needing a bank. Lending markets like <a href="https://aave.com/" target="_blank" rel="noopener noreferrer">Aave</a> let you take out loans without asking for anyone’s permission. Swapping projects like <a href="http://uniswap.org/" target="_blank" rel="noopener noreferrer">Uniswap</a> lets me trade tokens, any tokens, 24/7, 365. <a href="http://superrare.com/" target="_blank" rel="noopener noreferrer">NFTs</a> allow you to buy digital art, which makes more sense than physical art. Onchain you can buy shitcoins, monetizing your own attention by speculating on the very memes that you’re scrolling through. Anyone <a href="http://pump.fun/" target="_blank" rel="noopener noreferrer">can launch a token</a>. Anyone can build a project. You can use all of this stuff without asking your government or banker. Money moves whenever and wherever, with far, far fewer intermediaries. It is a magical experience, using crypto, if you just sit down for an hour to experiment. </p><p>Of course, the best crypto experience for the average person at the moment is Polymarket, a betting app that showcased the power of crypto by calling the election before any mainstream media organization could blink. </p><blockquote><blockquote><p>“In the past week, Polymarket has been a very effective source of information about the US election. Not only did Polymarket predict Trump would win with 60/40 odds while other sources predicted 50/50 (not too impressive by itself), it also showed other virtues: when the results were coming out, while many pundits and news sources kept stringing viewers along with hope of some kind of favorable news for Kamala, Polymarket showed the direct truth: Trump had a greater than 95% chance of victory, and a greater than 90% chance of seizing control of all branches of government at the same time.” -- <a href="https://vitalik.eth.limo/general/2024/11/09/infofinance.html" target="_blank" rel="noopener noreferrer">Vitalik</a></p></blockquote></blockquote><h2>Crypto</h2><p>It’s really time to stop making fun of crypto and start to experiment.</p><p>It is not IF, it is not WHEN, it is HOW. </p><p>Much of the crypto content that makes it out into the real world is still messy. It is still tied to 2018-2021 events. My normie friends think crypto is for speculation. My grandparents think it’s a scary internet thing for criminals. My parents’ friends think crypto is a scam. These are all ok reactions to crypto -- fixable. My normie friends will try it out to speculate. My grandparents will not be affected by ignoring crypto, they had many other money making events (shoutout internet bubble). My parents’ friends still trust mainstream media too much. They say they don’t, but, hell, there is a lot of inertia to turning on the TV to the news to check out what’s going on. </p><p>The less fixable problem is that a lot of the smartest people in my life still feel aloof to crypto. I’m talking about the professors, consultants, and tech bros that I get drinks with outside of my crypto bubble. I can’t quite put my finger on the exact right description of how they think about crypto, but the essence of their disbelief in crypto usually sounds like this Matt Levine article from 2018:</p><blockquote><blockquote><p>“We talk a lot around here about the blockchain for banking, and one obvious thing about the blockchain for banking is that it goes pew-pew. You can bring senior executives into a room and tell them that you’re upgrading the infrastructure that you use to reconcile trade settlement data with counterparties, and their eyes will glaze over and they will start nodding off, and you can shout “blockchain! blockchain! blockchain blockchain blockchain!” and they will perk up and hand you a stack of money. The blockchain is exciting in ways that improving database architecture is not.” -- <a href="https://archive.is/MaUfs#selection-3949.0-3964.0" target="_blank" rel="noopener noreferrer">Matt</a> Levine</p></blockquote></blockquote><p>Crypto is still “pew-pew” for these people. Too small or too scammy or too hard to use is the common complaint.</p><p>And that’s just wrong in 2024.</p><p>Crypto is an industry of tens of thousands at this point, with 100s of real companies, creating products that are actually not hard to use and obviously better than what exists.</p><p><a href="https://phantom.app/" target="_blank" rel="noopener noreferrer">Phantom</a> wallet is comparable to Venmo now. Taking a loan on Aave requires far less clicks and time than going to the bank. <a href="https://robinhood.com/us/en/support/articles/robinhood-wallet/" target="_blank" rel="noopener noreferrer">Robinhood Wallet</a> is literally using Uniswap (and other DEXs (for the crypto natives…it uses an aggregator)) on the backend to power swaps -- so Uniswap is just as easy to use as Robinhood because it is powering Robinhood. Coinbase is slick as hell, making onboarding a breeze even for millenials. There are ETFs for the boomers to pick up and other funds from teams like Bitwise and Grayscale that can get accredited investors exposure to crypto assets. I can get paid in stablecoins in 8 seconds anywhere in the world for less than $.01-- while wires take days and $10. I cannot pay Venmo dollars to someone with CashApp, I can use any crypto to pay anyone, anywhere, across platforms. </p><p>Not to mention that tokenization is here. <a href="https://www.msn.com/en-us/money/technologyinvesting/paypal-s-pyusd-stablecoin-now-supports-cross-chain-transactions-via-layerzero-integration/ar-AA1tZFoN?ocid=finance-verthp-feeds&amp;apiversion=v2&amp;noservercache=1&amp;domshim=1&amp;renderwebcomponents=1&amp;wcseo=1&amp;batchservertelemetry=1&amp;noservertelemetry=1" target="_blank" rel="noopener noreferrer">PayPal USD</a> is a stablecoin created by PayPal that exists on both Ethereum and Solana (two different blockchains). It can be moved without a bank! BlackRock has created a tokenized fund called <a href="https://www.theblock.co/post/327137/blackrocks-buidl-token-first-to-go-live-on-securitizes-new-platform-for-minting-synthetic-dollars-while-still-earning-rwa-yield" target="_blank" rel="noopener noreferrer">BUIDL</a> that is on Ethereum. Franklin Templeton’s <a href="https://www.franklintempleton.com/about-us/our-teams/specialist-investment-managers/digital-assets/digital-assets-technology" target="_blank" rel="noopener noreferrer">BENJI</a> is on multiple chains and Franklin to the Templeton has over <a href="https://defillama.com/protocol/franklin-templeton" target="_blank" rel="noopener noreferrer">$300M secured onchain</a> via smart contracts. This is real and it is now. </p><h2>Bitcoin and Crypto</h2><p>If you are not paying attention to crypto, you should be ashamed of yourself.</p><p>The time is now to build better systems. Not taking crypto seriously is the same as taking our current banking system seriously, which is ridiculous. It is 2024 and banks close on weekends and I cannot trade stocks on holidays. Like, I am using an AI bot to edit this article but Wells Fargo can’t figure out how to settle my weekend transactions in real-time? Build better. </p><p>And crypto is building better. Systems that are automated, onchain, and rely on no intermediaries: that is the endgame and the endgame is here. </p><p>Buckle up, put on a hoodie, and buy digital assets.</p><p>The intangible future is tangible in that it’s just a few clicks away on an app you can download right now. Exit the system that is inflating your assets without your permission and start experimenting with crypto -- a system that respects your sovereignty and intellect enough to make finance open source, rather than opaque and full of guardrails. </p><p>Get onchain. Live a little. The time to do so was three years ago, but, at the very worst, the time is now.</p><p>And while you’re at it, it is 2024: go heavy on AI (pay for your chat GPT subscription), go long Bitcoin (duh), try to live forever (longevity research is here), try to live on mars (shoutout the new space age), and try to live without using fossil fuels (nuclear renaissance). </p><div><hr></div><p>- kram </p><h6>(sorry in advance for being a local top signal for btc. this essay will definitely cause the bitcoin price to drop 15-30%. of course, if you have any sort of conviction, this won’t matter because bitcoin is going to $1M by 2030)</h6><h6>disclosure: i hold BTC. not to be considered financial advice. </h6><p><a href="https://kramnotmark.substack.com/p/bitcoin-and-crypto">Originally published on Substack</a></p></article></noscript>
