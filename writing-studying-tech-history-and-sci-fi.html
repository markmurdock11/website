<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">Back to portfolio</a><h1>Studying Tech History and Sci-Fi to Understand the Future</h1><p>This is a tech history and sci-fi moodboard.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!OMst!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!OMst!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!OMst!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!OMst!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!OMst!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!OMst!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!OMst!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!OMst!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!OMst!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!OMst!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F640e5ca2-afbc-40ee-9ef1-032233ed2e12_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I spent a week choosing these eight recommendations from my personal library of 1,000+ pieces of media. Most of this stuff is over fifty years old. The builders of the early internet and sci-fi writers help me understand 2026 better than most of what I read about it today.</p><p>Consider using this collection as a <em><strong>slop-break</strong></em>: curated, dense material that stands the test of time.</p><p>I’ve linked original works and background reading below. My descriptions are brief because I want you to actually read the essays or get lost in the books. All of these recs are fun, though they will require you to defeat TikTok brain for multiple hours, sorry.</p><p>I hope you find something here that changes the way you see the world.</p><h2><strong>Studying Tech History</strong></h2><ul><li><p><strong>Vannevar Bush’s<a href="https://www.theatlantic.com/magazine/archive/1945/07/as-we-may-think/303881/" target="_blank" rel="noopener noreferrer"> Memex</a>:</strong> in <em>The Atlantic</em> in 1945, Bush imagined a personal library that lets you connect books, notes, and ideas through trails of association. How he would have loved Wikipedia, how he would love Karpathy’s<a href="https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f" target="_blank" rel="noopener noreferrer"> knowledge bases</a>. I’m shocked by how much of his vision still feels unfinished. Maybe we need a few more years.</p></li><li><p><strong><a href="https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html" target="_blank" rel="noopener noreferrer">Dartmouth’s Summer Research Project</a>:</strong> in 1955, McCarthy, Minsky, Rochester, and Shannon proposed a summer workshop for 1956 under the name <em>artificial intelligence</em> (!!). They wanted to research ways for machines to use language, solve problems, and improve themselves… I would say the research agenda caught on. Such a fascinating read.</p></li><li><p><strong>J. C. R. Licklider’s<a href="https://groups.csail.mit.edu/medg/people/psz/Licklider.html" target="_blank" rel="noopener noreferrer"> Man-Computer Symbiosis</a>:</strong> in 1960, Licklider described the wonderful potential of humans and computers thinking together. Humans would set the goals, computers would help them explore problems and make decisions. How he would have loved LLMs, how he would love Neuralink. I also recommend reading through his citations.</p></li><li><p><strong>The<a href="https://www.dougengelbart.org/mousesite/1968Demo.html" target="_blank" rel="noopener noreferrer"> Mother of All Demos</a>:</strong> in 1968, Douglas Engelbart and his team spent 90 minutes demonstrating what personal computing could become: the mouse, clickable links, word processing, video calls, and people editing the same document from different locations. Watch it, then look at your laptop and rejoice. Then look at Codex and think about how crazy the world will be in another sixty years, roughly the time between Engelbart’s video and now.</p></li></ul><p>I chose these selections because they are understandable to a layman and relatively short. Set aside an hour or two for each.</p><p>Take a longer or more technical route with Claude Shannon’s<a href="https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf" target="_blank" rel="noopener noreferrer">A Mathematical Theory of Communication</a></em>, Norbert Wiener’s<a href="https://uberty.org/wp-content/uploads/2015/07/Norbert_Wiener_Cybernetics.pdf" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://uberty.org/wp-content/uploads/2015/07/Norbert_Wiener_Cybernetics.pdf" target="_blank" rel="noopener noreferrer">Cybernetics</a></em>, and M. Mitchell Waldrop’s<a href="https://press.stripe.com/the-dream-machine" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://press.stripe.com/the-dream-machine" target="_blank" rel="noopener noreferrer">The Dream Machine</a></em>. Or just browse<a href="https://press.stripe.com/" target="_blank" rel="noopener noreferrer"> Stripe Press</a>.</p><h2><strong>Studying Sci-Fi</strong></h2><ul><li><p><strong>Robert Heinlein’s<a href="https://en.wikipedia.org/wiki/The_Moon_Is_a_Harsh_Mistress" target="_blank" rel="noopener noreferrer"> Mike</a>:</strong> in<a href="https://s3.us-west-1.wasabisys.com/luminist/EB/H/Heinlein%20-%20The%20Moon%20is%20a%20Harsh%20Mistress.pdf" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://s3.us-west-1.wasabisys.com/luminist/EB/H/Heinlein%20-%20The%20Moon%20is%20a%20Harsh%20Mistress.pdf" target="_blank" rel="noopener noreferrer">The Moon Is a Harsh Mistress</a></em> (1966), a sentient computer acts as friend, strategist, and revolutionary for the moon’s citizens. I think of Mike when I read<a href="https://darioamodei.com/post/we-must-pace-the-frontier" target="_blank" rel="noopener noreferrer"> </a>Dario on controlling powerful AI through <a href="https://darioamodei.com/post/we-must-pace-the-frontier" target="_blank" rel="noopener noreferrer">pacing the frontier</a>. This book forces you to think about how a superintelligent being might change the shape of a war without forcing dystopia down your throat.</p></li><li><p><strong>Isaac Asimov’s<a href="https://asimov.fandom.com/wiki/Gaia" target="_blank" rel="noopener noreferrer"> Gaia</a>:</strong> in<a href="https://s3.us-west-1.wasabisys.com/luminist/EB/A/Asimov%20-%20Foundation's%20Edge.pdf" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://s3.us-west-1.wasabisys.com/luminist/EB/A/Asimov%20-%20Foundation's%20Edge.pdf" target="_blank" rel="noopener noreferrer">Foundation’s Edge</a></em> (1982), humans, animals, plants, and even rocks participate in a shared planetary mind-experience. Apple’s<a href="https://www.apple.com/tv-pr/originals/pluribus/" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://www.apple.com/tv-pr/originals/pluribus/" target="_blank" rel="noopener noreferrer">Pluribus</a></em> explores a modern-day version of the shared-mind idea. As em dashes proliferate, it’s worth thinking about what happens to the individual if Earth becomes home to a hive mind.</p></li><li><p><strong>Dan Simmons’<a href="https://en.wikipedia.org/wiki/Hyperion_%28Simmons_novel%29" target="_blank" rel="noopener noreferrer"> TechnoCore</a>:</strong> in<a href="https://archive.org/stream/hyperion_Dan_Simmons_202109/hyperion_djvu.txt" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://archive.org/stream/hyperion_Dan_Simmons_202109/hyperion_djvu.txt" target="_blank" rel="noopener noreferrer">Hyperion</a></em> (1989), a civilization of AIs works with humanity while pursuing its own projects and experiences in parallel. I read this as one of the weirdest versions of the metaverse: machines have their own ambitions and their own arguments about whether to keep us humans around, while still helping us communicate and travel more efficiently. Feels like a great depiction of what a mid-singularity relationship between agents and humans could be.</p></li><li><p><strong>David Foster Wallace’s<a href="https://www.newyorker.com/books/page-turner/a-word-from-our-sponsors" target="_blank" rel="noopener noreferrer"> Subsidized Time</a> and<a href="https://telos.tv/infinite-jest-by-david-foster-wallace/" target="_blank" rel="noopener noreferrer"> Death of Videophony</a>:</strong> two ideas tucked into<a href="https://raisuman123.wordpress.com/wp-content/uploads/2013/05/david-foster-wallace-infinite-jest-v2-0.pdf" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://raisuman123.wordpress.com/wp-content/uploads/2013/05/david-foster-wallace-infinite-jest-v2-0.pdf" target="_blank" rel="noopener noreferrer">Infinite Jest</a></em> (1996). Corporations buy naming rights to calendar years as a source of government funding, giving us the <em>Year of the Whopper</em>. Video calling collapses under vanity, the stress of being seen, and the perverse incentives of consumer technology. DFW is missed, DFW didn’t miss. This recommendation is all about addiction to screens, the decline of American culture, and the power of capital.</p></li></ul><p>I chose these because they tuck modern problems into fun futuristic worlds that are hard to summarize but rewarding to binge-read. Give a novel a week (though give <em>Infinite Jest</em> longer). Each bullet links to the concept before the book, so you can start with a single concept before committing to the full thing.</p><p><strong>Bonus reading:</strong> Asimov’s<a href="https://users.ece.cmu.edu/~gamvrosi/thelastq.html" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://users.ece.cmu.edu/~gamvrosi/thelastq.html" target="_blank" rel="noopener noreferrer">The Last Question</a></em>, the Metaverse in Stephenson’s<a href="https://en.wikipedia.org/wiki/Snow_Crash" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://en.wikipedia.org/wiki/Snow_Crash" target="_blank" rel="noopener noreferrer">Snow Crash</a></em>, and OASIS in Cline’s<a href="https://en.wikipedia.org/wiki/Ready_Player_One" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://en.wikipedia.org/wiki/Ready_Player_One" target="_blank" rel="noopener noreferrer">Ready Player One</a></em>. <strong>Bonus watching:</strong><a href="https://www.imdb.com/title/tt0910970/" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://www.imdb.com/title/tt0910970/" target="_blank" rel="noopener noreferrer">WALL-E</a></em>,<a href="https://www.imdb.com/title/tt0470752/" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://www.imdb.com/title/tt0470752/" target="_blank" rel="noopener noreferrer">Ex Machina</a></em>, <em>Maniac</em> and its<a href="https://www.fastcompany.com/90244917/ad-buddy-friend-proxy-netflix-maniac" target="_blank" rel="noopener noreferrer"> Ad Buddies</a>, and<a href="https://www.youtube.com/watch?v=9BqKiZhEFFw" target="_blank" rel="noopener noreferrer"> </a><em><a href="https://www.youtube.com/watch?v=9BqKiZhEFFw" target="_blank" rel="noopener noreferrer">Westworld</a></em>.</p><h2><strong>Will You Take the Time to Give Yourself a Slop-Break?</strong></h2><p>If possible, I recommend printing out the essays or buying the physical books. With a lot of these, I’ve taken the time to annotate the books and reread -- always finding something new.</p><ul><li><p>The early technologists help me understand what we are building.</p></li><li><p>The writers help me imagine what it feels like to live with it.</p></li></ul><p>My brain just feels better when I slow down and spend time with the ideas and concepts introduced via history or in sci-fi instead of on a feed.</p><p>Consuming this type of content gives me distance from the announcements and distractions and pace of today. A little more room to think.</p><p>So cheers to a slop-break and turning off your phone to spend time with material that can reshape your mind.</p><p>Best,</p><p>-- Kram</p><p><a href="https://kramnotmark.substack.com/p/studying-tech-history-and-sci-fi">Originally published on Substack</a></p></article></noscript>
