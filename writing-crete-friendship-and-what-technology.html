<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">← archive</a><h1>Crete, Friendship, and What Technology Wants</h1><p>What are the odds? The odds are good and getting better. </p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!95OA!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!95OA!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!95OA!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!95OA!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!95OA!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!95OA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!95OA!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!95OA!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!95OA!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!95OA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafb4be0b-aca7-4e03-a1c5-80b4cba91d1e_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>Welcome to <a href="https://kramnotmark.substack.com/s/kinetic" target="_blank" rel="noopener noreferrer">KINETIC</a>, a series about places, but really about love and friendship and experiencing the world through the human lens. Not the lens of a phone. This is the second post. </em></p><p><em>I visited Crete with <a href="https://x.com/emmajo" target="_blank" rel="noopener noreferrer">Emma</a> and <a href="https://x.com/arjunnchand" target="_blank" rel="noopener noreferrer">Arjun</a> while on a sabbatical from work that has now turned into unemployment (positive). It was a walking trip inspired by <a href="https://colossus.com/article/flounder-mode/" target="_blank" rel="noopener noreferrer">Kevin Kelly</a>, and it gifted me with many surprising, beautiful moments…</em></p><div><hr></div><p>I didn’t think that I would end up in Greece under the hot sun, down to my last half-liter of water 4 km away from civilization with my partner and my best friend when I started to read <em><a href="https://kk.org/books/what-technology-wants/" target="_blank" rel="noopener noreferrer">What Technology Wants</a></em>. It is weird how information seems to flow through my life like water over rock. Enjoying a book turned into further research into the author. That led me to the idea of a <a href="https://craigmod.com/ridgeline/176/" target="_blank" rel="noopener noreferrer">walking trip</a>, which, months later, crept into my imagination when trying to figure out what to do this summer. And so there I was, walking across Crete with my partner and my friend -- what technology wanted was for me to detach and to slow down and to feel the grit of the Earth.</p><p>It was just a moment of being uncomfortable, early in the trip, but after so long being inside and on screens, a physical problem felt foreign. Four kilometers is so short, but also just long enough for us tech-natives to get nervous. We trudged on and made it back, exhausted and perhaps a bit dehydrated, but so fine and, really, better for it. That’s the interesting thing about physical versus digital obstacles: the human body craves exertion and colors it with positive remembrance. I find the opposite is true with technology: I am addicted and cannot put it down, but once I do, the world finally is revived of its color.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!4WNZ!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!4WNZ!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!4WNZ!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!4WNZ!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!4WNZ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!4WNZ!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!4WNZ!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!4WNZ!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!4WNZ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F816b8eca-312d-4b80-9447-b265aeabaf43_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><strong>Yet, this trip would not have been possible without technology.</strong> Because of communication technology, Arjun and I can keep in touch over long distances. Because of the internet, we were able to find a hike in Greece and book it with minimal effort. </p><p>I think technology wanted me to log off for long enough to appreciate its beauty again: to reset my relationship with screens as I spent time with nature, the polar opposite of technology but really more like a subverted twin, so that I could come back and use the digital tools at my disposal to create and live and enjoy again.</p><p class="button-wrapper"><a class="button primary" href="https://kramnotmark.substack.com/subscribe?" target="_blank" rel="noopener noreferrer"><span>Subscribe now</span></a></p><p>Beside me on this trip was, as always, Emma, an outdoorswoman. She is built to move. Potential energy is against her nature; <em><strong>she is kinetic.</strong></em> This trip was a perfect encapsulation of our relationship. She is fast to say yes and I am fast to say no. I’ve always pushed back against hiking and she always rebuts with even wilder ideas -- like horseback riding in Kyrgyzstan or an eight-day trek in Nepal. A walk around Greece was a compromise that fit our relationship, somewhere in the middle.</p><p>And there was also Arjun, a friend I made by complete and utter chance. We started working together as interns at a company in South Korea, of all places, on the same day six years ago. Me working from Houston, him from Delhi — both working out of our parents’ basements. We don’t remember <em>when</em> we became friends, but we are now inseparable, tied by something bigger than happenstance. The first thing he said to me when he landed in Crete was, “It’s just me?” Then he laughed and said, “Of course,” and we went on with the trip. The entire plan was me sending Arjun <a href="https://craigmod.com/ridgeline/176/" target="_blank" rel="noopener noreferrer">Craig Mod’s essay about a walking trip with Kevin Kelly</a> (which implied this would be a trip of at least five people, not just three), plus the dates.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!bWf2!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!bWf2!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!bWf2!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!bWf2!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!bWf2!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!bWf2!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!bWf2!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!bWf2!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!bWf2!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F446121bc-eef8-4140-8dbd-4b18af43a1e6_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><blockquote><p>Pink flowers like snowflakes, strewn about the chalky, broken rock.</p><p>Waves crashing on rocks sound like thunder.</p><p>The smell of thyme under pine.</p></blockquote><p>On Crete, I walked over red clay, brick-cracked, earth-caked lands, on the edge of a cliff overlooking the deepest blue water as the sky, barren of clouds, showed me its grandeur in full.</p><p>I trudged over craggy hills as the sun beat down upon me, reminding me of how much I love being alive, looking as far as my eyes could see to find rolling greens and yellows interspersed with lush purple. These were the hills of Greece, welcoming me, taunting me, reintroducing me to the world.</p><p>I splashed through gorges, with those great-god-gifted rocks, dark and ruddy with age, towering narrowly to either side of me. The only noises were the crunch of boots on gravel, breath leaving lungs, and the wind whispering sweet nothings to the rock or the tree or the goat, the sound of endless erosion as light as can be.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!sfzs!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!sfzs!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!sfzs!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!sfzs!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!sfzs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!sfzs!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!sfzs!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!sfzs!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!sfzs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8a18d820-b242-4c24-bfd0-0db15b535b45_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><strong>In Crete, we walked 90 kilometers in 5 days.</strong></p><p>We -- Emma, Arjun, and I -- flew into Crete and spent the night in Chania before taking a taxi to Palaiochora. There we found our first walk: down the Anidri Gorge for an easy 10.5-kilometer trek. It was in Palaiochora that Arjun had the best gyro of his life in a place that we cannot remember the name of.</p><p>From there, we walked to Sougia on what was supposed to be an easy 15-kilometer walk that, leaving at 9 a.m., turned into a scorcher. It included 415 meters of elevation and no stops for water. Emma was sick -- from travel, maybe. I think it was because she had finally taken a vacation: the body knows when it can steal time to really rest. It is interesting that the body spoke and thought that a hike in hot, hot Greece was a safer place to be sick than behind a screen.</p><p>From Sougia, it was 1,000 meters of elevation gain up the Agia Irini Gorge to the Omalos Plateau. This was my favorite walk: the gorge was mostly shaded for the first three hours, and then the walk required trekking over the empty hills of Crete, replete with green and pink and purple vegetation. </p><p>At one point, Arjun, Emma, and I trekked for more than an hour, which we all agreed felt like five minutes. This led to Emma explaining to us the definition of Stoke: the brain’s way of rewarding physical exertion, of risk, rhythm, and immersion in the now with a natural high.</p><p>From Omalos, what went up must go down. We found our way down the Samaria Gorge, ending with a stumble through the Iron Gates -- a narrow gap between the cliffs that leads into a flowered and rivered area where nature itself speaks Pan and Dionysus and the Nymphs and the Muses into existence through erosion alone. Here we stopped at Agia Roumeli.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!D3dL!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!D3dL!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!D3dL!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!D3dL!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!D3dL!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!D3dL!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!D3dL!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!D3dL!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!D3dL!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb7e02706-ea6a-40e6-956f-3aa7fe2c1890_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>Our last day of hiking was a 15-kilometer trek from Agia Roumeli to Loutro, a walk that felt super easy until kilometer 10: we marched up a full hill with no shade and then scrambled down. Our trip ended in Loutro, a carless town of all white, where we ate a sweaty meal by the seaside involving a shrimp saganaki I will be dreaming of forever.</p><p><strong>And the food, my goodness, the food.</strong> Crete brought successive best meals ever. Chicken, lamb, shrimp, tzatziki, stuffed tomatoes, zucchini flowers, goat, moussaka. Always fresh. Always with a side of olive oil. Pure. Never too much.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!rNcF!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!rNcF!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!rNcF!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!rNcF!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!rNcF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!rNcF!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!rNcF!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!rNcF!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!rNcF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9e47529-d9d0-4278-ab0d-eedfb422ea34_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><em>What Technology Wants</em> argues technology is a living thing, an organism working in parallel to humanity. I would argue that technology, like the waves and the winds and the silence of nature, is not sentient but opinionated, a medium that warps a message. It changes you -- for better or for worse.</p><p>I thought about Kelly’s chapter on the <a href="https://kk.org/wp-content/uploads/2010/06/Wired-Co-Founder-Kevin-Kelly-on-What-Technology-Wants-_-7x7.pdf" target="_blank" rel="noopener noreferrer">Amish</a> constantly during this trek: it was a brainworm. The Amish live with technology not through instant adoption, but through slow, selective adoption. They ask whether a tool will strengthen or weaken their community. Then they either distribute it everywhere or outlaw it.</p><p>Being in nature on this little walking trip reminded me that technology is a force as powerful as the sea and the wind and the water. It is a force that deserves to be reckoned with.</p><p>Since Crete, I walk more. I put my phone away when I go to the grocery store. I am attempting to spend my nights reading instead of scrolling. I am thinking more about how my relationship with technology can be symbiotic rather than parasitic. I am also more and more intrigued by the thought that nature and technology are converging through us, and that part of life is finding the balance between the worlds we live in, digital and physical, that want to shape us so, so differently.</p><p>Big thoughts and such — better explained by Mr. Kelly in his book, which I recommend you purchase immediately. </p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!lUiq!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!lUiq!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!lUiq!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!lUiq!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!lUiq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!lUiq!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!lUiq!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!lUiq!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!lUiq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe43f003f-00a3-4cb5-89ad-9b48ac764a50_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>This will not be our last walking trip. More and more and more.</p><p><strong>For Emma and me, this trip felt so very us.</strong> Friendship, food, conversation, the outdoors. A relationship of abundance. I love how much I get to learn from her and the places in the world I will get to see because we decided to adventure together. And I love that I get to push her in different ways too: to slow down and enjoy the actual walk, not the planning of it, not the next thing, but the moment itself. Going forward, I think I’ll be more adventurous and ready for Nepal. And I think Emma will be more willing to slow down and enjoy something like Greece: this is the beauty of a relationship with multiple poles.</p><p>This was also a trip where Arjun and I officially went from friends to great friends. </p><p>It was the silence that spoke this truth. 30 or 45 minutes might pass on walks when Arjun, Emma, and I felt no need to utter a word. We were basking in each other’s presence, comfortable enough to allow the world to speak to us as it is. With a lesser friend, I think I would have felt the pressure to keep up the conversation or to check in that he was having a good time. </p><p>This trip cemented complete trust: the two of us, separate people aligned in a moment. We are good complements, Arjun and I. Where I am impulsive, he is calm. Where I am creative, he is strategic. When we write, he brings structure and I bring style. It just sort of melds. It works.</p><p>Arjun and I have a running joke in our friendship: anytime we go do anything, anywhere, we smile big and wide and say, “What are the odds?” At the airport in Chania, what were the odds of him, a kid from Delhi, and me, a kid from Texas, meeting at a company in South Korea, becoming friends, and going on a trip to Greece together? Since we know each other so well now, the odds are good and getting better, but they were oh so low.</p><p>The odds of anything in life. But getting a friend like Arjun? That’s really, really low.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!T1_W!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!T1_W!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!T1_W!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!T1_W!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!T1_W!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!T1_W!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!T1_W!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!T1_W!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!T1_W!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbffc12b4-8931-4a35-acc3-6bdf8b0ea3a4_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><strong>Arjun, afterward:</strong></p><blockquote><p><em>Crete was special. I have a new rule for living life -- when Kram is in your DMs with a plan he can’t explain in a different country, you should say yes. The process of finding paths, finding yourself, and finding a deeper friendship in hardship. I live for experiences like this with friends and with family, and especially with friends that are now family. To saying yes to unfigured-out plans, to doing hard things, and to many more such experiences with Kram and Emma.</em></p></blockquote><p>The irony is that a book about what technology wants sent me into nature to reckon with what I want from technology.</p><div><hr></div><h6><strong>Thanks for reading and thank you Crete. </strong></h6><h6><strong>Next up is Croatia, which will have a bit more friendship and family. </strong></h6><h6><strong>- Kram</strong></h6><p><a href="https://kramnotmark.substack.com/p/crete-friendship-and-what-technology">Originally published on Substack</a></p></article></noscript>
