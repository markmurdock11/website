ng" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!VpMS!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faafb3c26-5bce-4b66-8a79-f33e78367ae1_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!VpMS!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faafb3c26-5bce-4b66-8a79-f33e78367ae1_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!VpMS!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faafb3c26-5bce-4b66-8a79-f33e78367ae1_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!VpMS!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Faafb3c26-5bce-4b66-8a79-f33e78367ae1_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>the year is already a fourth of the way over, which is pretty crazy.</em></p><p><em>it has been a fun year so far. my new job really got going — i’ve been writing a lot and reading a lot and planning a lot and generally have had no time to be bored. no complaints there.</em></p><p><em>extracurricular writing and i have had a pretty tenuous relationship thus far into 2024. what used to be a day to day love affair filled with much texting back and forth has turned into month-to-month long distance friendship phone call, where much must be updated at once in a long-winded spiel with far too many details and far too little context.</em></p><p><em>alas, you work with what you have and what i have is a few hours in this starbucks and <strong>an urge to write a new post about the last few months of my existence, focusing on what I have read/watched/listened to, living in Canada, and a few pithy remarks about life</strong>. this isn’t going to be the most entertaining nor the most educational post you have ever read, but it should, at the bare minimum, make you shake your head with a smile at least (!) twice in some form of exasperation, admiration, exhaustion, admonition, and/or appreciation. in fact, i think the last sentence alone will likely account for at least one shaking-head-smile from at least 50% of my readers.</em></p><p>enjoy.</p><div><hr></div><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!buRy!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!buRy!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!buRy!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!buRy!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!buRy!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!buRy!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!buRy!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!buRy!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!buRy!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!buRy!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F871bc5e1-e77f-40a4-add9-28cb97229748_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h3>Books Consumed by Kram in Q1</h3><ul><li><p><a href="https://www.amazon.com/Atlas-Shrugged-Ayn-Rand-ebook/dp/B003V8B5XO/ref=sr_1_1?crid=6C3SRBQQM1CM&amp;dib=eyJ2IjoiMSJ9.Zf9wS6Rc_JVJSJd6Llz29XESviy-tfbU4lXI4OfEecaY22hCFvP8uT6ampbC59v30Zp7IddRMRj-iFPIozj-6dkFo-BJOaHGBHmgITPfJLlKNq2T-70LzBZsWVtaQcvM4-7OZU8LQJRbM2XnHOziE95ySq9H-vPaKyTF9C3qsea7u8WHpEhqM7LKcZkYKicZ8ZQOZkk4jFKx3OYw0oOqlLZQ94AdxmgaS-33vMqQD1s.53lcYoY8xnKoiuxlS4tpGZvuhPiIDFqhG-W_mrWI4NM&amp;dib_tag=se&amp;keywords=atlas+shrugged&amp;qid=1711198633&amp;sprefix=atlas+shrugged%2Caps%2C907&amp;sr=8-1" target="_blank" rel="noopener noreferrer">Atlas Shrugged</a> — Harry Potter for Libertarians. I enjoyed it so much I offered family members up to $1 per page to read it. So far, nobody has taken me up on the offer.</p></li><li><p><a href="https://www.amazon.com/Fountainhead-Ayn-Rand-ebook/dp/B002OSXDAU/ref=sr_1_1?crid=218TL6X3K4L3W&amp;dib=eyJ2IjoiMSJ9.98ohXabWcRSSkLc6GvVqsdquPIe6yKqQRxMIOriHPDQwSUtvHZoWbWz5HilIE7MV6DXPBgpzP7X8SzYw2Ww79iXcU_fg0BTmII6lJW7ph7ZeOCQp7_JZX8Wn4e8nqTbsIjMvw4zZE1zGvhmNH8fNBY-oH2J7b6j165HyVu7CO2-G5iywCAVUsZhsSzcmY2D-XEXYXmob4BZ6zuKInLlYMmLm5WC8Vdzc7xMdJIKMdns.PZWgHu6Xp38z1jf34UZEgomUkKN4FqLJ4WInVadSwYs&amp;dib_tag=se&amp;keywords=the+fountainhead&amp;qid=1711198650&amp;sprefix=the+fountain+h%2Caps%2C788&amp;sr=8-1" target="_blank" rel="noopener noreferrer">The Fountainhead</a> — an analysis of a great man amidst a dying society.</p></li><li><p><a href="https://www.amazon.com/Sovereign-Individual-James-Dale-Davidson-ebook/dp/B00AK9IXXM/ref=sr_1_1?crid=GV414YXN8JID&amp;dib=eyJ2IjoiMSJ9.rO1mbf54ZSTT6LyOESSt6HmEIeYf8GgGkBttxwnwxtiTxy9yqvHy1yn4m__jgSNGSxgnb0ZeENz4ReKMG2br2ep0a1ePTcQsPH2Z8CUwtk_Fqne85qBRelM5jHDOn9m9ukziQ_sRXIaKVAxnr7Mv2TERzG4esBwTarxaZorVMviX_uRzbKlbRnQzpf33WS0SrMZvECFVQeO6f6IIOIpA2y1f4m1JwIzIvWQtCNdpdUk.6YEYYf9aL14ANIu_F8QJb7yVMC5WTCXOEUC_A05F2zM&amp;dib_tag=se&amp;keywords=sovereign+individual&amp;qid=1711198673&amp;sprefix=sovereign+individual%2Caps%2C193&amp;sr=8-1" target="_blank" rel="noopener noreferrer">Sovereign Individual</a> — containing great mental models for how to position oneself as the world further digitizes.</p></li></ul><p>There is truth in the cliche that you are some amalgamation of the five people you spend the most time with. A similar idea thrown around is “you are what you eat.”</p><p>I agree with both -isms and will go even further —what you think is likely correlated to what you read.</p><p>And in Q1, from a book perspective, I consumed a rather limited perspective of ideas centered on the ideals of libertarianism. Which means my brain is currently flowing with ideas of How Great Men are Good, and Why Government Should Be Limited, and What a Great Thing Capitalism Is.</p><p>This is quite interesting, as I have usually centered myself upon the political spectrum — yet, due to the writing I have recently read, I find my thought patterns shifted quite sturdily to right of center.</p><p>In Q2, we’re definitely going to take a break from Ayn Rand and imbibe some more progressive content. I’m quite interested to see where and how my beliefs shift after doing so.</p><div><hr></div><h3>On the Silliness of Living in Canada (5 Things)</h3><ol><li><p>To receive my Canadian Work Visa, I ubered to the border, exited Canada, walked across <a href="https://bcparks.ca/peace-arch-park/" target="_blank" rel="noopener noreferrer">Peace Arch Park</a>, entered the United States, touched an American flag, exited the United States, walked across Peace Arch Park, entered Canada, asked for my work permit very nicely (eh), ubered back to my apartment. I am now allowed to work in Canada for two years. Laugh out loud.</p></li><li><p>Canadian Bacon is not a thing — as far as I can tell.</p></li><li><p>Instead of friends who live down the street, I have friends who live in entirely different countries. So on Tuesdays and Wednesdays, I have a standing call w/ the amigos of India and when it crosses my mind I throw a call over to Italy or Slovenia between 6 am-9 am (European time) to say hello and, well, for my American friends, I usually call you guys around midnight and you never pick up — let’s work on that in Q2.</p></li><li><p>I get paid in CAD, a laughable form of fiat. I also pay for things in CAD. This means everything I purchase in this country of red, white, and not blue is roughly 25% off when contextualized against the dollar. I like this.</p></li><li><p>Film (and that’s Hollywood, baby) is a major industry in Vancouver. A film crew knocking out a Hallmark move is not an unfamiliar site on a Tuesday afternoon. The building I work at, in fact, has housed two Christmas movie sets since I’ve worked there. If you squint quite hard at the Hallmark channel this year, you might see me in sweats, a green puffy jacket, and a sweet Texans beanie walking behind some version of the Grinch stealing Christmas.</p></li></ol><div><hr></div><h3>TV Shows Purveyed by Kram in Q1 Even Though He Said He Wouldn’t Watch TV in 2024</h3><ul><li><p>Avatar the Last Airbender (Live Action) — the animated show is perfect. The live action show? It’s fine.</p></li><li><p>3-Body Problem — the book series sits inside my top 5 all time. The TV show? I would recommend it to a friend.</p></li><li><p>House of Cards — two episodes I watched whilst cooking dinner on a Tuesday night. Not necessarily my normal vibe. It is far too serious and requires far too much attention, but I find myself looking forward to episode three.</p></li></ul><p>Despite making a 2024 New Years Resolution of “no TV” (for the sole reason of telling other people about it so they know I’m better than them), I slipped up and kinda sorta maybe drained two full seasons of two full shows (Avatar and 3-Body Problem). Do I have any regrets? No.</p><div><hr></div><h3>From Kram’s Notepad Beside His Bed, Likely on a Stormy Night in Vancouver.</h3><h3>Date, Unknown.</h3><div class="pullquote"><p><em>Sometimes I can’t ignore the sound of the future’s thunder.</em></p><p><em>Rumbling and tumbling; time roils.</em></p><p><em>The world, I fear, might, just might, be torn asunder. </em></p></div><h3>Movies That Made Kram Put the Phone Down and Pay Attention in Q1</h3><p>Canadian Netflix is much, much better than American Netflix and has a fantastic roster of old-school movies. I leveraged my newfound Canadian-work-permit-Netflix-access as much as I could, throwing away a couple Sunday afternoons to dive into a few classics.</p><ul><li><p>Shawshank Redemption — Mid-90s Morgan Freeman, a prisoner wrongly accused, and a library. 11/10.</p></li><li><p>The Departed — Matt Damon as the bad guy pretending to be good, Dicaprio posing as a bad guy while employed as a cop, Jack Nicholson and Mark Wahlberg going for it. 9/10.</p></li><li><p>Dune Part 2 — not a fan. Go read the book, don’t waste time on the film. 6/10.</p></li><li><p>Dune (1984 Version) — better than Dune 2. worse than Dune 1. worth a watch if you know who Frank Herbert is. 7/10.</p></li><li><p>Pulp Fiction — finally got around to this classic. I now understand the Uma Thurman and Samuel L. Jackson lore. 8/10.</p></li><li><p>Pretty Woman — i am fully in love Julia Roberts. 11/10.</p></li></ul><div><hr></div><h3>Transcribed From Kram’s Notepad Initially Scribbled Down Whilst Sitting at the Park Eating Fried Chicken.</h3><h3>Date, February 25th</h3><p>Life on Earth is beautiful. Look around you. No, look closely. Stop looking at the room you’re in, bent over your screen, a slave to the age of the internet. Look out the window to your left or your right and look with eyes that see, rather than eyes that look.</p><p>Life on Earth is beautiful. Inhale with your eyes the green of your lawn, the curve of your tree, the roof of your neighbor, the verticality of your skyline, the majesty of the sun, the beauty of the sunset, the airiness of a cloud, the vibrance of a flower, the agility of a squirrel, the gaiety of a bird, the strength of dirt, the complexity of concrete. </p><p>Life on Earth is beautiful. So stop for a minute and enjoy it. We live in a complex system of math so beautiful it became life itself. Appreciate it. Breathe in and savor that oxygen and be grateful and breathe out slowly, dispersing carbon dioxide, and be grateful again.</p><p>Life on Earth is beautiful. Don’t forget that.</p><div><hr></div><h3>Music Kram Found Since January 1, 2024</h3><ul><li><p>Song — Highway Queen (Mt. Joy)</p></li><li><p>Album — Away From the Castle</p></li><li><p>Song — Young in Paradise (Mac Saturn)</p></li></ul><p>After a few years off of the music perusal grind, I found a bit of time to listen to new music. In addition to the (talking to pookie voice) absolutely fire recommendations above, I also fell back in love with country music, finding myself listening to full length albums from Flatland, Eric C, Zach B, John P, amongst others.</p><div><hr></div><h3>Things Kram Plans to Write About in 2024</h3><p>In January, I posted a little essay about space and optimism called “<a href="https://thothworship.substack.com/p/da-optimistic-space-time-continuum" target="_blank" rel="noopener noreferrer">Da Optimistic Space Time Continuum</a>” — a title that absolutely bangs and that nobody congratulated me for.</p><p>I am still exceedingly optimistic about the world. A few topics that particularly get me especially excited include weather control (woah), nuclear (woah), ozempic (woah), technology proliferation (woah), food abundance (woah), and renewable energy upgrades (woah).</p><p>I’ll likely write a deep dive on each this year. For a taste of what is to come, here are a few links. Sorry for not writing more — I was a bit busy with work.</p><h4>Controlling Weather Patterns and, Hence, the Environment</h4><ul><li><p>UAE: <a href="https://www.cbsnews.com/news/dubai-rain-cloud-seeding-heat-weather/#:~:text=Scientists%20in%20the%20United%20Arab,well%20as%20several%20other%20regions" target="_blank" rel="noopener noreferrer">https://www.cbsnews.com/news/dubai-rain-cloud-seeding-heat-weather/</a></p></li><li><p>Emissions lowering: <a href="https://www.theguardian.com/environment/2024/jan/24/eu-fossil-fuel-co2-emissions-hit-60-year-low" target="_blank" rel="noopener noreferrer">https://www.theguardian.com/environment/2024/jan/24/eu-fossil-fuel-co2-emissions-hit-60-year-low</a> </p></li><li><p>Weather control: <a href="https://science.howstuffworks.com/nature/control-weather.htm" target="_blank" rel="noopener noreferrer">https://science.howstuffworks.com/nature/control-weather.htm</a> </p></li></ul><h4>Rewiring the Environment</h4><ul><li><p><a href="https://history.state.gov/milestones/1899-1913/panama-canal#:~:text=Following%20heated%20debate%20over%20the,to%20build%20the%20new%20canal" target="_blank" rel="noopener noreferrer">https://history.state.gov/milestones/1899-1913/panama-canal</a></p></li></ul><div class="embedded-post-wrap"><a class="embedded-post" href="https://unchartedterritories.tomaspueyo.com/p/seaflooding?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!4QUy!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fc92decb6-7c5c-4053-bc05-651e5548e9b3_1280x1280.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Uncharted Territories</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">🌎 Seaflooding</div></div><div class="embedded-post-body">Sea levels might rise by one to two meters by the end of the century. What if I told you there was a way to mitigate that, while creating new habitats and more life, growing the economy, and making money along the way? Let’s call it seaflooding. Do You Like the Mediterranean Today…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 225 likes · 106 comments · Tomas Pueyo</div></a></div><ul><li><p>https://www.piratewires.com/p/we-ought-to-have-more-creatures</p></li><li><p><a href="https://www.npr.org/2021/09/14/1036884561/dna-resurrection-jurassic-park-woolly-mammoth" target="_blank" rel="noopener noreferrer">https://www.npr.org/2021/09/14/1036884561/dna-resurrection-jurassic-park-woolly-mammoth</a> </p></li></ul><h4>Nuclear Might Be Good?</h4><ul><li><p><a href="https://oneearthfuture.org/en/one-earth-future/news/there-really-evidence-decline-war#:~:text=Examining%20the%20number%20of%20war,than%20the%20early%20Cold%20War" target="_blank" rel="noopener noreferrer">https://oneearthfuture.org/en/one-earth-future/news/there-really-evidence-decline-war#:~:text=Examining%20the%20number%20of%20war,than%20the%20early%20Cold%20War</a>. </p></li><li><p><a href="https://academic.oup.com/ia/article/95/4/765/5513164" target="_blank" rel="noopener noreferrer">https://academic.oup.com/ia/article/95/4/765/5513164</a> </p></li><li><p><a href="https://world-nuclear.org/information-library/non-power-nuclear-applications/overview/the-many-uses-of-nuclear-technology.aspx#:~:text=Radioisotopes%2C%20nuclear%20power%20process%20heat,water%20resources%20and%20the%20environment" target="_blank" rel="noopener noreferrer">https://world-nuclear.org/information-library/non-power-nuclear-applications/overview/the-many-uses-of-nuclear-technology.aspx#:~:text=Radioisotopes%2C%20nuclear%20power%20process%20heat,water%20resources%20and%20the%20environment</a>.</p></li></ul><h4>Long Live Humanity (Cuz of Life Extension Tech)</h4><ul><li><p>https://www.piratewires.com/p/we-need-to-be-living-forever</p></li><li><p><a href="https://www.nytimes.com/2022/11/22/well/ozempic-diabetes-weight-loss.html" target="_blank" rel="noopener noreferrer">https://www.nytimes.com/2022/11/22/well/ozempic-diabetes-weight-loss.html</a> </p></li></ul><h4>Technology is Becoming Abundant</h4><ul><li><p><a href="https://study.com/academy/lesson/thomas-edison-george-westinghouse.html#:~:text=The%20War%20of%20Currents%20raged,to%20define%20death%20by%20electricity" target="_blank" rel="noopener noreferrer">https://study.com/academy/lesson/thomas-edison-george-westinghouse.html#:~:text=The%20War%20of%20Currents%20raged,to%20define%20death%20by%20electricity</a>. </p></li><li><p><a href="https://www.britannica.com/story/history-of-technology-timeline" target="_blank" rel="noopener noreferrer">https://www.britannica.com/story/history-of-technology-timeline</a> </p></li><li><p><a href="https://explodingtopics.com/blog/smartphone-stats#:~:text=operating%20system%20worldwide-,How%20Many%20Smartphones%20Are%20There%3F,the%208%20billion%20global%20population" target="_blank" rel="noopener noreferrer">https://explodingtopics.com/blog/smartphone-stats#:~:text=operating%20system%20worldwide-,How%20Many%20Smartphones%20Are%20There%3F,the%208%20billion%20global%20population</a>. </p></li><li><p><a href="https://www.demandsage.com/internet-user-statistics/#:~:text=There%20are%20over%205.3%20billion,has%20access%20to%20the%20Internet" target="_blank" rel="noopener noreferrer">https://www.demandsage.com/internet-user-statistics/#:~:text=There%20are%20over%205.3%20billion,has%20access%20to%20the%20Internet</a>. </p></li></ul><h4>Food is Becoming Abundant</h4><ul><li><p><a href="https://ourworldindata.org/food-supply#:~:text=The%20steeper%20rise%20across%20poorer,than%20in%20the%20previous%20century" target="_blank" rel="noopener noreferrer">https://ourworldindata.org/food-supply#:~:text=The%20steeper%20rise%20across%20poorer,than%20in%20the%20previous%20century</a>. </p></li><li><p><a href="https://www.politico.com/newsletters/future-pulse/2023/04/10/panacea-or-peril-the-synthetic-food-debate-00091160" target="_blank" rel="noopener noreferrer">https://www.politico.com/newsletters/future-pulse/2023/04/10/panacea-or-peril-the-synthetic-food-debate-00091160</a> </p></li></ul><h4>Energy is Becoming Abundant</h4><ul><li><p><a href="https://waitbutwhy.com/2015/06/the-deal-with-solar.html" target="_blank" rel="noopener noreferrer">https://waitbutwhy.com/2015/06/the-deal-with-solar.html</a></p></li><li><p><a href="https://www.theguardian.com/environment/2022/may/11/us-fracking-climate-fossil-fuel-gases" target="_blank" rel="noopener noreferrer">https://www.theguardian.com/environment/2022/may/11/us-fracking-climate-fossil-fuel-gases</a></p></li></ul><p><em>For context, before writing on a certain topic, I usually read around 50+ links like the ones I shared above.</em></p><div><hr></div><h3>Food We Will Eat If/When You Visit Kram in Vancouver</h3><ul><li><p>The Thai Food Truck on Robson — order fried rice, specify that you want it spicy.</p></li><li><p>Ignite Pizza — i always grab an XL pie on the way home from the office on Friday. Half double pepperoni, half cheese.</p></li><li><p>Ask for Luigi — genuinely the best Italian I’ve had outside of Italy. Walk in around 6 or grab a reservation two weeks out. Will certainly ask for luigi again.</p></li><li><p>Danbo — I don’t like ramen, yet I am in love with Danbo (a ramen restaurant).</p></li></ul><div><hr></div><h3>Short Form That Was So Good I Saved It On My Laptop</h3><p>If I am an onion, <a href="https://www.youtube.com/watch?v=-FtCTW2rVFM" target="_blank" rel="noopener noreferrer">as Shrek says I am</a>, then a layer you have to understand is that something I love more than pretty much everything except for breakfast tacos is weird ideas laid out in an essay format that is far too long than necessary. I spend the first 45 minutes of nearly every day reading weird essays about odd topics and I save my favorites on a .txt file called “kewl ideas.”</p><p>I would say in Q1 2024, I read less short-form than I have in a long, long time. I was writing a lot for work, reading a lot for work, and, when I could spare time, I was reading really, really long books with grand, sweeping theses. I did, however, get to steal a few minutes here and there to splurge brain cells on big ideas and wonky turns of phrases from some of my favorite writers.</p><p>Here are a few of pieces that I saved:</p><p><a href="https://www.paulgraham.com/vb.html" target="_blank" rel="noopener noreferrer">Life is Short</a></p><p><a href="https://www.paulgraham.com/philosophy.html" target="_blank" rel="noopener noreferrer">Philosophy</a></p><div class="embedded-post-wrap"><a class="embedded-post" href="https://www.noahpinion.blog/p/in-defense-of-science-fiction?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!l14h!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F04281755-2cd6-42e5-a496-e69153abebb2_281x281.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Noahpinion</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">In defense of science fiction</div></div><div class="embedded-post-body">As everyone who reads this blog knows, I’m a big fan of science fiction (see my list of favorites from last week)! So when people start bashing the genre, I tend to leap to its defense. Except this time, the people doing the bashing are some serious heavyweights themselves …</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 308 likes · 177 comments · Noah Smith</div></a></div><p><a href="https://www.scientificamerican.com/article/musk-and-bezos-offer-humanity-a-grim-future-in-space-colonies/" target="_blank" rel="noopener noreferrer">Space Colonies</a></p><div class="embedded-post-wrap"><a class="embedded-post" href="https://www.experimental-history.com/p/so-you-wanna-de-bog-yourself?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!VtWA!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe1a1b3b4-5f35-4876-a0d5-449398201e1f_1171x1171.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Experimental History</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">So you wanna de-bog yourself</div></div><div class="embedded-post-body">Strangers sometimes ask me for advice, which is both flattering and alarming, because I only know about the things I write here, and sometimes not even those. For instance, someone recently asked me if I had any advice about how to teach people to fly planes, which makes me wonder: who’s running the pilot education system?? Now, whenev…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 433 likes · 43 comments · Adam Mastroianni</div></a></div><p><a href="https://outsidetheasylum.blog/the-hidden-complexity-of-thought" target="_blank" rel="noopener noreferrer">Ways of Thinking</a></p><div class="embedded-post-wrap"><a class="embedded-post" href="https://visakanv.substack.com/p/are-you-having-fun-son?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><span></span><span class="embedded-post-publication-name">visa's voltaic verses ⚡️</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">"Are you having fun, son?"</div></div><div class="embedded-post-body">When I was about maybe 14 years old, I plotted to have a fun night by myself in my family home, on a day that I knew everyone was going to be home late. I had borrowed a DVD from a friend, a live concert of one of my favorite bands, Mr. Big – I believe it was the Farewell Live in Japan 2002 video. I decided to really treat myself, and I bought three 3-p…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 82 likes · 14 comments · visakan veerasamy</div></a></div><p><a href="https://jods.mitpress.mit.edu/pub/issue3-brand/release/2?utm_source=substack&amp;utm_medium=email" target="_blank" rel="noopener noreferrer">Pace Layering</a></p><p><a href="https://www.penguin.co.uk/articles/2015/11/read-john-steinbeck-s-letter-of-fatherly-advice-to-his-son" target="_blank" rel="noopener noreferrer">Steinbeck on Love</a></p><p><a href="https://semi-rad.com/2024/01/make-2024-the-year-of-maximum-enthusiasm/" target="_blank" rel="noopener noreferrer">Enthusiasm</a></p><p><a href="https://www.secretorum.life/p/hatching-the-cosmic-egg-hymn-to-dionysus\" target="_blank" rel="noopener noreferrer">Cosmic Egg</a></p><p><a href="https://docs.google.com/document/d/1vzvy3qEQuP4tZMIaxejWy0WR4PXVdf0WQN3hDkJ-0KQ/edit" target="_blank" rel="noopener noreferrer">Out of the Rabbit Hole</a></p><div class="embedded-post-wrap"><a class="embedded-post" href="https://www.experimental-history.com/p/declining-trust-in-zeus-is-a-technology?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!VtWA!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe1a1b3b4-5f35-4876-a0d5-449398201e1f_1171x1171.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Experimental History</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">Declining trust in Zeus is a technology</div></div><div class="embedded-post-body">Randomized-controlled trials only caught on about 80 years ago, and whenever I think about that, I have to sit down and catch my breath for a while. The thing everybody agrees is the “gold standard” of evidence, the thing the FDA requires before it will legally allow you to sell a drug—that thing is…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 267 likes · 81 comments · Adam Mastroianni</div></a></div><div class="embedded-post-wrap"><a class="embedded-post" href="https://www.experimental-history.com/p/how-to-drive-a-stake-through-your?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!VtWA!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe1a1b3b4-5f35-4876-a0d5-449398201e1f_1171x1171.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Experimental History</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">How to drive a stake through your own good heart</div></div><div class="embedded-post-body">I was teaching at Columbia last year when the news broke: our esteemed Ivy League university had been lying for years to increase its standing in the US News and World Report college rankings. According to one of its own math professors, Columbia had juiced its stats by, among other things…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 310 likes · 46 comments · Adam Mastroianni</div></a></div><div class="embedded-post-wrap"><a class="embedded-post" href="https://everythingisamazing.substack.com/p/the-stars-our-destination?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!fytm!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fde69fbd5-835f-427b-8639-c8630e35d3cf_118x118.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Everything Is Amazing</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">The Stars, Our Destination?</div></div><div class="embedded-post-body">Hello! This is Everything Is Amazing, a wide/wild-eyed, science-driven look at curiosity’s ability to make you go “wow”, to tune out clickbait, and to metaphorically throw you into a pile of leaves for the sheer hell of it. Today, we’re returning to our season-long look at…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 111 likes · 43 comments · Mike Sowden</div></a></div><p><a href="https://comment.org/repair-and-remain/" target="_blank" rel="noopener noreferrer">Repair and Remain</a></p><p><a href="https://www.ias.edu/sites/default/files/library/UsefulnessHarpers.pdf" target="_blank" rel="noopener noreferrer">Usefulness of Useless Knowledge</a></p><p><a href="https://rootsofprogress.org/why-a-larger-population" target="_blank" rel="noopener noreferrer">More People</a></p><div class="embedded-post-wrap"><a class="embedded-post" href="https://www.experimental-history.com/p/you-cant-be-too-happy-literally?utm_source=substack&amp;utm_campaign=post_embed&amp;utm_medium=web" target="_blank" rel="noopener noreferrer"><div class="embedded-post-header"><img class="embedded-post-publication-logo" src="https://substackcdn.com/image/fetch/$s_!VtWA!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe1a1b3b4-5f35-4876-a0d5-449398201e1f_1171x1171.png" loading="lazy" decoding="async" alt=""><span class="embedded-post-publication-name">Experimental History</span></div><div class="embedded-post-title-wrapper"><div class="embedded-post-title">You can't be too happy, literally</div></div><div class="embedded-post-body">Over time, people tend to stay at about the same level of happiness, pretty much no matter what. This is extremely weird. Just look at this…</div><div class="embedded-post-cta-wrapper"><span class="embedded-post-cta">Read more</span></div><div class="embedded-post-meta">3 years ago · 273 likes · 52 comments · Adam Mastroianni</div></a></div><p><a href="https://www.piratewires.com/p/epic-feats-american-engineering-projects" target="_blank" rel="noopener noreferrer">American Engineering</a></p><div><hr></div><h3>Books Kram Started in Q1 and is Set to Finish in Q2</h3><ul><li><p>The <a href="https://www.amazon.ca/Time-Machine-H-G-Wells/dp/0486284727" target="_blank" rel="noopener noreferrer">Time Machine</a> — for airplane reading, only.</p></li><li><p><a href="https://www.amazon.com/Anna-Karenina-Oxford-Worlds-Classics/dp/0198800533/ref=sr_1_6?crid=14UIJ32W30663&amp;dib=eyJ2IjoiMSJ9.8clEEUiJuyYEw-dDL6XZigtY5mWoKqXn1lhFy3ImtWc1zkOxghwHy7hc5AN9tI6GB2xHRR566tC_7Hp8I82Ub3-xHbWTJ-XTI7Pk4YrAW5JepN8q27ds1ZMHz5L9ExK0v0v8pq1XuvvVWH2L07FlinotC8FVwjWXO-XqSkj6I8ySc9qN1vRLAyqO92Ev67_gb3kBhcRXwIpbt49Hp8Hhx5wzo-DRDTwXEdz0s6hEypo.vh8KW4EaD1dxF_Riq9Y6hoK5avzENrSmslRnNNnXfB8&amp;dib_tag=se&amp;keywords=anna+karenina+by+leo+tolstoy&amp;qid=1711198687&amp;sprefix=anna+kar%2Caps%2C283&amp;sr=8-6" target="_blank" rel="noopener noreferrer">Anna Karenina</a> — to prove i’m better than you.</p></li><li><p><a href="https://www.amazon.ca/Righteous-Mind-Divided-Politics-Religion/dp/0307455777" target="_blank" rel="noopener noreferrer">The Righteous Mind</a> — an attempt to understand political polarization.</p></li><li><p><a href="https://www.akashicbooks.com/catalog/against-the-written-word-toward-a-universal-illiteracy/" target="_blank" rel="noopener noreferrer">Against the Written Word</a> — studying parody and fun writing.</p></li><li><p><a href="https://www.goodreads.com/book/show/25372801-all-the-birds-in-the-sky" target="_blank" rel="noopener noreferrer">All the Birds in the Sky</a> — a little fantasy for a life over-indexed on non-fiction.</p></li></ul><p>A side note on books — I read many books at the same time. Sometimes in the same day, I will read 10 pages of 5 different books. There is room in the brain for many ideas and many plots and many characters and many facts. Reading many books at once brings texture to the reading experience — instead of a single idea percolating your existence, as tends to happen when a singular focus is given to a singlular book, reading multiple books forces the brain to bounce and layer and stack and filter ideas at a rapid pace, which often results in the marriage of multiple concepts and me coming up with new, cross-concept ideas.</p><p>A side-side note on books — Kram is on pace to hit 600 lifetime books this year. He will celebrate by purchasing a special edition copy of The Foundation.</p><p>A side-side-side note on books and reading and bookstores. This will be turned into a longer post with a real thesis and a better throughline, but, for now, it is a ramble…</p><h5>On Books and Reading and Bookstores</h5><p>Books are, for the generation of z, a medium placed atop a pedestal. To read is not something to do, it is something to brag about.</p><p>And because of this pedestal, (and I’m generalizing here) the generation of z predominantly reads trash or forces themselves to read things that are entirely un-fun. They read self-help books and bad fantasy books and business books because tiktok tells them to or they struggle through non-fiction or memoirs or classics because <em>these are important books to read.</em></p><p>The trash is no better for your brain than social media (just good branding cuz it’s trash in book form instead of screen+scroll form) and the un-fun is no way to get into the habit of reading.</p><p>This bothers me. So here’s unsolicited, unasked for advice from Kram on reading and enjoying reading and books:</p><ul><li><p>only read books that are interesting to you</p></li><li><p>only read the first half of a self-help book. if you can’t figure out how the book ends, you’re fucked anyways.</p></li><li><p>read non-fiction to increase your context</p></li><li><p>read sci-fi to get excited about the future and to figure out what to be wary of in the present</p></li><li><p>never read something just because you think you should</p></li><li><p>stop reading when you start to lose interest in a book</p></li><li><p>go to half-priced books and find something random — your trendy bookstores are laid out like social algorithms, looking to catch your attention on what’s new and hot and cool. fuck that…</p></li><li><p>read new books but read them with much skepticism</p></li><li><p>read history with much skepticism</p></li><li><p>bookstores are traps, attempting to convince you that the new book, just released, is what you should buy. don’t fall for it. the old books, the classics, that’s where the good stuff is. libraries know this. trust librarians. not bookstore workers. unless, of course, that bookstore is Blue Willow.</p></li><li><p>read old books, avidly.</p></li><li><p>underline your books. treat them badly. dog ear them. rip the corners. throw them down on the desk. spill coffee on them. use them as coasters. books are just books</p></li><li><p>splurge for the hardcover when you can</p></li><li><p>read books that you disagree with more than books that you agree with</p></li><li><p>read books more than you watch tv and more than you listen to music and more than you watch movies</p></li><li><p>read fiction to increase your empathy</p></li><li><p>bring books with you wherever you go and instead of wasting 15 minutes scrolling, steal 15 minutes reading</p></li><li><p>read books about philosophy and argue with the authors every claim just for the hell of it. they’re dead, they won’t mind.</p></li></ul><div><hr></div><p>— kram</p><div><hr></div><h6>(Bonus: Grand Gestures Kram is Looking to Pull Off in 2024)</h6><ul><li><p><a href="https://www.youtube.com/watch?v=1GoH3M9Kb4g" target="_blank" rel="noopener noreferrer">Lifting a boombox.</a></p></li><li><p><a href="https://www.youtube.com/watch?v=g4ODPyUxLNw" target="_blank" rel="noopener noreferrer">Sprinting across New York</a>.</p></li><li><p><a href="https://www.youtube.com/watch?v=r05Yea1EXns" target="_blank" rel="noopener noreferrer">Taking a detour</a>.</p></li></ul><p><a href="https://kramnotmark.substack.com/p/q1-2024">Originally published on Substack</a></p></article></noscript>
