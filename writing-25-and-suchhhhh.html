mazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 424w, https://substackcdn.com/image/fetch/$s_!3nmY!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 848w, https://substackcdn.com/image/fetch/$s_!3nmY!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 1272w, https://substackcdn.com/image/fetch/$s_!3nmY!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!3nmY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png" width="1006" height="1168" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!3nmY!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 424w, https://substackcdn.com/image/fetch/$s_!3nmY!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 848w, https://substackcdn.com/image/fetch/$s_!3nmY!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 1272w, https://substackcdn.com/image/fetch/$s_!3nmY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a9e9ad0-f06e-446e-b9d4-5885697370f8_1006x1168.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2>Friendship.</h2><blockquote><blockquote><p><em>we humans need food, water, shelter; these are basic needs.</em></p></blockquote><blockquote><p><em>therefore, friendship is unnecessary. like art or philosophy.</em></p></blockquote><blockquote><p><em>and appetizers for the table.</em></p></blockquote></blockquote><p>a friend in this life is rare and beautiful. a relationship to cherish, to cultivate.</p><p>there is the mundane friendship: a road trip full of questions and music and bad advice. a small kitchen, a wooden cutting board full of cheese and a table covered with plates of carbonara — mediocre to taste, yet so fun to create. a garage and a refrigerator and an L-shaped couch made for lounging and bantering about things that do not matter in the most serious way possible while clicking buttons in a vain attempt win the fake game being played upon the flat screen tv a few feet away. a sand volleyball court that is just an excuse for a group chat. dinner on a tuesday, lunch on a thursday, beers on a saturday.</p><p>and there is the grand friendship: a golden palace at three am in a different country. bar hopping on a monday in the city of boot scoot and boogie. eating a homecooked meal at a family home upon a hill, overlooking a spread of green and blue: a memory imprinted forevermore upon my sense of self. a twenty year tradition of celebration with the same people, in both december and most definitely april. a small town in northern italy that somehow becomes home for a short period of time. writing something together that is appreciated by others, for some reason. showing up on the worst days, being there on the best days, someway, somehow.</p><p>but then there is the life-giving, the formative, the moments where a friendship built on the mundane and grand is distilled into a look from across the room — a look nobody else could decipher. or perhaps these experiences are cashed in all at once for a single conversation, giving hard advice or requesting help. but mostly, it is in the moments that are sometimes taken for granted — where neither expects something of the other except an attuned presence. this is time spent beyond the masks of everyday life. of complete truth and no pretense. when the facade drops, the shoulders melt, and you face each other as honest humans, a little broken, a little confused, but mostly just glad to be here, happier for the seconds/minutes/hours shared, confident that there is one other person on earth that understands.</p><div><hr></div><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!1Gtp!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!1Gtp!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 424w, https://substackcdn.com/image/fetch/$s_!1Gtp!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 848w, https://substackcdn.com/image/fetch/$s_!1Gtp!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 1272w, https://substackcdn.com/image/fetch/$s_!1Gtp!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!1Gtp!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png" width="1456" height="1813" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!1Gtp!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 424w, https://substackcdn.com/image/fetch/$s_!1Gtp!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 848w, https://substackcdn.com/image/fetch/$s_!1Gtp!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 1272w, https://substackcdn.com/image/fetch/$s_!1Gtp!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb84c10c6-cb16-47e1-aa93-0caabc64beff_1484x1848.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h3>The Illusion of Choice</h3><p>say yes. do the thing. drive fast, faster, fastest. run further, harder. cast your net wider, deeper. dream big, bigger, biggest. there is only this life. grand should be the gestures. wild should be the dreams. inspired should be your existence. risk everything. hold nothing back. full throttle, forward, no looking back.</p><p>say no. time is valuable. choose wisely, wiser, wisest. protect yourself, others. be wary of risk, chance. think hard, harder, hardest. there is only this life. careful should be the actions. realistic should be the pursuits. practical should be your existence. chance nothing. create safety nets. slowly, forward, always looking back.</p><p>the choice is yours.</p><p>i know how i want to live.</p><div><hr></div><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!ois_!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!ois_!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!ois_!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!ois_!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!ois_!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!ois_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!ois_!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!ois_!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!ois_!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!ois_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc160ac24-1b7c-451d-85a1-a0a107fb8d6c_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h3>IS THE WORLD ENDING???????</h3><p>is the world ending? deadpool and wolverine says yes. history says that this is but a lull in the creative industry.</p><p>is the world ending? the near assisination of a presidential candidate says yes. history says assasinations are par for the course for election cycles.</p><p>is the world ending? the japanese carry trade says yes. history says that this is but a bust that will lead into a boom cycle.</p><p>is the world ending? all of my social feeds say yes. history says the internet is but a tool in its infancy, and that humanity will harness it for the greater good.</p><p>is the world ending? my girlfriend literally applying to go to mars says yes. history says that expansion is normal — why should an expansion to space be seen as a bad thing?</p><p>is the world ending? israel and palestine say yes. history says that war and dispute and terrible things happen and yet humanity still goes on.</p><p>is the world ending? the increasing speed at which ai is becoming reality says yes. history says that humans have done a pretty good job at controlling new technologies.</p><p>is the world ending? money is being printed at a faster rate than ever before. history says that currencies rise and fall, but humanity continues.</p><p>is the world ending? yes, of course the world is ending. just look at society.</p><p>is the world ending? no, of course the world isn’t ending. just look at history.</p><div><hr></div><h6>if you’ve made it this far, thanks. or perhaps you’re welcome. i hope you enjoyed this. or at least didn’t hate it. i wanted to take a second to point out that all photography here was shot and curated by emma except for the title graphic, which was lovingly created by me, kram. emma will likely think that such a choice ruins the entire aesthetic of the entire piece. to this point, i have no refutation outside of the fact that i think everything in life is only improved when batman gets involved. until next time,</h6><p>— kram.</p><p><a href="https://kramnotmark.substack.com/p/25-and-suchhhhh">Originally published on Substack</a></p></article></noscript>
