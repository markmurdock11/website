99582140af_1536x1024.png" width="1456" height="971" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!RuYq!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F32d97466-1ed6-4536-a3ca-bd99582140af_1536x1024.png 424w, https://substackcdn.com/image/fetch/$s_!RuYq!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F32d97466-1ed6-4536-a3ca-bd99582140af_1536x1024.png 848w, https://substackcdn.com/image/fetch/$s_!RuYq!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F32d97466-1ed6-4536-a3ca-bd99582140af_1536x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!RuYq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F32d97466-1ed6-4536-a3ca-bd99582140af_1536x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p><em>Welcome to <a href="https://kramnotmark.substack.com/s/kinetic" target="_blank" rel="noopener noreferrer">KINETIC</a>, a series about places, but really about love and friendship and experiencing the world through the human lens. Not the lens of a phone. This is the third post. </em></p><p><em>In June, I visited Croatia to experience my friend <a href="https://x.com/zord4n" target="_blank" rel="noopener noreferrer">Marko’s home</a>. A former colleague now turned friend, my trip to Croatia involved a concert in a different language, me becoming an unnofficial uncle, and…</em></p><div><hr></div><p>The thing they don’t tell you about taking a job in tech or a remote job or really any job in person is that if it goes really well or really bad, because relationships do best when there are peaks or valleys to celebrate or denigrate, the relationships you find along the way will be glorious. </p><p>These relationships will take you to new corners of the world and into conversations that you never would have imagined, meeting people and seeing things that are the exact things that make life worth living. </p><p><em><strong>In Croatia, there is a town called Bjelovar</strong></em> and it is the hometown of Marko, my friend, my good friend, a new dad, husband to the pants-wearing Špela, son of the Jurina family, an older brother with intensity. Native to Croatia, Marko can always be found with a cigarette just being rolled, you never see him smoke it because he smokes as he lives and breathes. You only notice the rolling, the light break in the conversation that paces the day as he opens up his pack of tobacco and rips open a new filter, his eyes alight and mind still on whatever conspiracy theory topic is being thrown around. Fingers on autopilot: rolling and rolling and rolling.</p><p><em><strong>In Croatia there is a town called Bjelovar</strong></em> and there is a family called the Jurinas, and they live on a street of about ten houses. Each house is surrounded by a green green yard and is designed with a unique floor plan and adorned with paint of different colors, yet it all still comes together into a cohesive unit that definitely feels like a neighborhood of a tight-knit group of people. There is much waving and stopping to say hello and laughing and smiling amongst the people who live on this street.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!RIhI!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!RIhI!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!RIhI!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!RIhI!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!RIhI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!RIhI!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!RIhI!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!RIhI!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!RIhI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc1870651-6129-49f6-b326-3ad0743c9bcb_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>​And the Jurina house is a three-story build, and it is three houses away from where the family first lived on that street before, having bought the property that is now their home of 21 years or so. The house is built to host, in that it has a big dinner table as the focal point of the house and a kitchen with four little seats, and then a terrace that can fit eight people easily. Each of those people can have a glass of wine or two sitting next to them and a coffee mug and also a plate for cake. It was on this terrace that I spent the majority of my trip to Croatia, sitting and chatting and smiling and laughing as I lived a day in the life of the Jurinas, as they sat out there and whiled the hot summer day away talking about nothing and living for everything and sipping on spritzes from 2pm to 10pm.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!TkkM!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!TkkM!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!TkkM!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!TkkM!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!TkkM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!TkkM!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!TkkM!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!TkkM!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!TkkM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff9aaf081-4355-45f2-bc2f-4f7d365a9cc2_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><em><strong>In Croatia there is a town called Bjelovar</strong></em> and it is the hometown of Marko who is now the father of Max who is now two and a half and a sparkplug of a boy, who is the spitting image of his mother with that bleach-blond hair and those sparkling big blue emotionally playful eyelashed eyes and red red lips turned up into a sly smile. But he is also the spitting image of his father not in the way he looks but in the way he moves, his hips waddling side to side as he walks and runs and rumbles and tumbles around the house.</p><p>Max speaks not a word of English nor I a sentence of Croatian or Slovenian and I am also famously not a huge kid guy but my goodness, Marko, my friend, getting to see his child and be the fun uncle and run around the front yard playing soccer and badminton with a two-and-a-half-year-old with endless energy babbling and laughing and communicating through body language and through emotion and through the physical objects of the world, it was a joy, it was a joy, it was a joy.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!wx30!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!wx30!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!wx30!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!wx30!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!wx30!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!wx30!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!wx30!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!wx30!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!wx30!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F688124c7-af2e-405b-aa71-aa56f25f8e32_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><em><strong>​In Croatia there is a town called Bjelovar</strong></em> and for twelve days every year it hosts a festival and when I was lucky enough to visit it was the 30th anniversary and it was also the World Cup and also there was a new mayor recently elected and so the festival of a town for 40,000 was set up to host 250,000 and there were food carts everywhere and four different concert venues and the people were enthused and welcoming.</p><p>I went for the first three days of the festival, culminating in a concert by <a href="https://open.spotify.com/artist/1JbDmDlop4Pm4IyJhc22jt" target="_blank" rel="noopener noreferrer">Petar Grašo</a> that I attended with Marko, his wife, his mother, his mother-in-law, his sister-in-law, his brother, and his sister-in-law’s boyfriend. It was a family affair and it was a Croatian affair and I was an American listening to a concert in a language I didn’t know surrounded by a family I had just met and thousands of people singing along to the songs of the day that were obviously about heartbreak but also love and also family and also life and I didn’t need to hear the words because the city of Bjelovar and the people and Petar Grašo and Marko and his family translated the words through emotion and body language and lights and I loved it, I loved every second of it.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!ygR0!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!ygR0!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!ygR0!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!ygR0!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!ygR0!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!ygR0!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!ygR0!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!ygR0!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!ygR0!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd431922-aa85-4d64-8d3e-f65b31470426_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>There are so many moments on this trip that are deeply personal but so universal that I just want to get them out of my head and into the world. </p><p>The way that Marko and Špela, the two lovers who are so perfectly matched in giving each other shit but have been through so much, held hands in the yellow and pink light of the Petar Grašo concert, singing and dancing and staring at each other, forgetting the other people around them, turning it into a moment for two. </p><p>The feeling I got when Max gave me a mimicked “nice” in English after giving me a fist bump on my way to the Uber. The thrill I felt for Marko and for Špela as I met Max and saw how excited they were to raise a kid in a loving house, with the intention of giving him the freedom to explore and speak. How fun it was to see how much little Max has changed Marko for the better, for the better.</p><p>On hearing about Marko’s past and how much he has transformed, how he is a man of second and third and fourth chances who has lived hard but is now living so well. There is so much to a person that takes so long to learn. I  thought I knew him and what he was about, but now, after visiting him and seeing him in his home and with his parents and his kid, wow, what a different visual.</p><p><em><strong>In Croatia there is a town called Bjelovar </strong></em>and as Marko and I walked down the streets of Bjelovar together and alone we were both so happy and the sun was shining and it was the afternoon and it was one of those moments in life where two friends meet and very few words are said but the words that are said mean so much because they express and they prove that yes, there is a bond here and it goes oh so deep and it is oh so beautiful and it is oh so the purpose of life.</p><p>And so we walked down the street and we gave each other advice on the things we could give advice on. We asked questions and we told stories and we were a bit nostalgic but we were also so excited about the future and it was there that the two friends were fully unmasked to each other for the first time. And that is a gorgeous thing, the unmasking when a friendship becomes family. </p><p>We both realized in that moment that life is so good and that when we met four years ago we never could have imagined the places we would go nor the people we would become. And we spoke about our next four years and the four after that and there we walked, two friends so adoring of the past, so thankful for their present, and so genuinely ready for a better future, and it was a Croatian man and an American man and the world worked in so many mysterious ways to bring us together and we really never should have met but there we were and there we will go down the path life gave us.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!CIUo!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!CIUo!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!CIUo!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!CIUo!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!CIUo!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!CIUo!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!CIUo!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!CIUo!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!CIUo!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8d49de48-8a37-4bc5-a425-d1ac37a8d8b0_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p><em><strong>In Croatia there is a town called Bjelovar</strong></em> and it is one hour and eight minutes from the airport and while Uber allowed me to schedule a ride, the driver never showed up and the app sent me a notification at 6:26 for my 6:30am reservation that I was down and out and that no drivers were available which was not an exciting situation since my flight was at 9:05am and I had promised Emma, my love my love, that I would be back for dinner and dancing and a weekend in London.</p><p>​And so I scrambled up the stairs and shook Marko, my friend my friend, who was dead asleep because he was a Croatian through and through the night before, staying up till 4:30am celebrating in the streets of his hometown with the people of his hometown, and so I shook and shook and finally after a slap I awoke the beast that is my friend Marko. I explained the situation as he wiped the nap from his eyes and then he went to the room next door and he started talking in Croatian and all of a sudden his father, a big smiling but burly and bald and strong and hilarious but also definitely used to be a hardass of a man, came out and said “Come, Mark,” because his English was better than Max’s but only by about 25 words and I went because this was not a man to keep waiting.</p><p>And we went into the garage and Dragan Jurina started driving me on that 68-minute drive to the airport around 7am, and it was a wonderful ride. It was another moment where we lacked the language to speak in full sentences but mostly enjoyed each other’s company and the novelty of the moment and also the beauty of the landscape. We shared a few words about the trip and the road, but it was mostly quiet, and it was 100% beautiful. Then, about 45 minutes into the drive, around 7:45 and with my flight boarding just minutes away, Dragan asked if I wanted a coffee. And I said yes. </p><p>​And so we stopped by the side of the road and found a little gas station. Just a few minutes before boarding and still 15 minutes from the airport, we sat outside at the gas station and ordered two Americanos and watched the sun rise and stared at each other and tried to figure out what we could say that the other would understand. Then, after about five minutes, we went back into the car and we drove the last stretch  and I made it to my flight on time and made it back to London and it was glorious.</p><div class="captioned-image-container"><figure><div class="image-link image2"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!KJJr!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!KJJr!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!KJJr!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!KJJr!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!KJJr!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png" width="1400" height="300" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!KJJr!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 424w, https://substackcdn.com/image/fetch/$s_!KJJr!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 848w, https://substackcdn.com/image/fetch/$s_!KJJr!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 1272w, https://substackcdn.com/image/fetch/$s_!KJJr!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F63882ca4-2493-4d87-9fc0-736581ded2f8_1400x300.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture><div></div></div></div></figure></div><p>And there is just advice that I wish I could give my previous self which is to go out and travel more and to see your friends where they are and ask them to host you and to allow yourself to be hosted and to live a life that allows you to have the experiences that come with a weird group of people in weird places of the world doing weird things so that you can get pulled into that.</p><p>​It’s also the advice to never settle and to only allow myself to be deeply in love with who I am with and what I do and seeing Marko and Špela and Max was such a reminder of that. It is also a reminder that there are no burned bridges unless you really set fire to a structure and that Marko and I could’ve so easily not been friends when I left our little startup back in the day but we both intensely pushed back against that and now there I was in Croatia with his family and he has been to Texas with my family, and this is important and also a reminder.</p><p><em><strong>In Croatia there is a town called Bjelovar</strong></em> and that is where I stayed for just a few days that felt like a year where I met my nephew of another family and deepened a friendship into a brotherhood and listened to a concert in another language and felt the love of a host family with whom I shared so much, even without a shared language.</p><div><hr></div><h6><strong>Thanks for reading and thank you Croatia.</strong></h6><h6><strong>Next up is Berlin, which will have a bit more technology and such.</strong></h6><h6><strong>- Kram</strong></h6><p><a href="https://kramnotmark.substack.com/p/in-croatia-there-is-a-town-called">Originally published on Substack</a></p></article></noscript>
