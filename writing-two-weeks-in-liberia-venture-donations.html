<noscript><style>#knm-preview{display:none!important}body{background:#f7f1f8;color:#151419;font:20px/1.6 Georgia,serif}article{max-width:740px;margin:40px auto;padding:24px}img,video{max-width:100%;height:auto}h1{line-height:1.1}</style><article><a href="/#writing">← archive</a><h1>Two Weeks in Liberia: Venture Donations, Starlink, and Many, Many Flywheels</h1><p>From the Archive — a crypto bro visits West Africa and discovers a scrappy 25-year-old nonprofit.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!m7hA!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!m7hA!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 424w, https://substackcdn.com/image/fetch/$s_!m7hA!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 848w, https://substackcdn.com/image/fetch/$s_!m7hA!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 1272w, https://substackcdn.com/image/fetch/$s_!m7hA!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!m7hA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png" width="1308" height="881" class="sizing-normal" alt="" title="" srcset="https://substackcdn.com/image/fetch/$s_!m7hA!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 424w, https://substackcdn.com/image/fetch/$s_!m7hA!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 848w, https://substackcdn.com/image/fetch/$s_!m7hA!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 1272w, https://substackcdn.com/image/fetch/$s_!m7hA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fddd1b8bf-07d1-4984-b128-97ccebe7e114_1308x881.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><div><hr></div><blockquote><p><em>“Universal Outreach somehow takes social impact principles, embeds them with capitalist operating models, and created an accelerator for private business and a venture fund for ideas to improve the economy and education platform of Liberia — through a nonprofit that has almost no overhead because it was founded by someone with a heart big enough to cover all admin fees.”</em></p></blockquote><div><hr></div><p>A wide road and a well-worn white Jeep straight out of Jumanji delivered me from the airport to a three-story compound in Monrovia housing two organizations: Liberia Pure, a small business specializing in honey and coconut oil, and Universal Outreach Foundation, a nonprofit focused on education and economic development in Liberia. Abu drove. A sturdy, soft-spoken Liberian, he patiently survived my initial onslaught of questions about the city, the roads, the population size, the construction everywhere. I was a bit chagrined when Emma, my partner, hopped in ten minutes later to ask Abu about himself — his three-year-old daughter, his home, their previous adventures together.</p><p>That Jeep ride arrived after four days of travel: five flights, two trains, one broken plane computer, a conversation beneath the Eiffel Tower, a train to Amsterdam, a bomb scare in Brussels, an omelet in Ethiopia, and my first shower in an airport lounge. I’ve since learned this is a perfectly normal Liberia itinerary. Airline routes from North America and Europe run sparse and lightly serviced. The country is not easy to get to, which is part of the point.</p><p>The trip had been in the works for months, planned mostly by Emma, who estimates she’s spent nearly a year total in the country, working alongside Kent Bubbs Jr. and Landis Wyatt — the two people running UOF. In return for a free flight and accommodations, we had promised to do a social media and communications overhaul for UOF in a week.</p><p>I am not, historically, a nonprofit guy. I’ve never donated much. Rarely volunteered. Always been skeptical of entities that exist without the goal of revenue. It was Emma’s enthusiasm for the work, and really her enthusiasm for how genuinely good Landis and Kent are as people, that pushed me onto the plane. What followed changed my mind in ways I did not expect.</p><p>Here’s what I learned.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!jPDq!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!jPDq!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 424w, https://substackcdn.com/image/fetch/$s_!jPDq!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 848w, https://substackcdn.com/image/fetch/$s_!jPDq!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 1272w, https://substackcdn.com/image/fetch/$s_!jPDq!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!jPDq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png" width="881" height="1308" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!jPDq!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 424w, https://substackcdn.com/image/fetch/$s_!jPDq!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 848w, https://substackcdn.com/image/fetch/$s_!jPDq!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 1272w, https://substackcdn.com/image/fetch/$s_!jPDq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F71f015a3-cf15-45a8-bd7b-f595358e7e4e_881x1308.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><strong>Creating Flywheels for Liberia: Coconut Oil, Beekeeping, and Small Loans</strong></h2><p>One of Kent’s most memorable spiels — and he had many, as we spent hours with him talking about UOF’s goals and brand — was essentially this: all corporate entities are the same in that “money comes in, money moves around, money goes out.” It is the entities that leverage this movement best to get to their end goal that stick around. On the business side, this efficiency drives revenue. On the nonprofit side, it drives social impact. In essence, principles of good business can lead to goals outside of revenue.</p><p>Kent and Landis, two Canadians you might expect to be somewhat liberal in their operating temperament, run UOF on pure business principles. Universal Outreach, though a non-profit, seems to be more of an accelerator than anything else — because through what Kent and Landis call “programs,” UOF has seeded ventures across industries including coconut oil, coffee, beekeeping, and small business loans. All donations for UOF function as seed money for Liberian industry and make up the foundation that network effects can be built upon. Their goal is flywheels, with initial donations being the kickstarter for a new innovation.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!hBrU!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!hBrU!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 424w, https://substackcdn.com/image/fetch/$s_!hBrU!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 848w, https://substackcdn.com/image/fetch/$s_!hBrU!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 1272w, https://substackcdn.com/image/fetch/$s_!hBrU!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!hBrU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png" width="1342" height="1022" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!hBrU!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 424w, https://substackcdn.com/image/fetch/$s_!hBrU!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 848w, https://substackcdn.com/image/fetch/$s_!hBrU!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 1272w, https://substackcdn.com/image/fetch/$s_!hBrU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F928a6c43-2167-4cb8-83dd-5fcc34bc5796_1342x1022.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>The coconut tree example is the clearest. Kent raises money to plant coconut trees — a classic donation program any donor would happily fund. But years before asking a donor for money, he and Landis had been sourcing the buyers and market for the products throughout Liberia and beyond, looking at coconut oil as a viable local product, and working with Liberia Pure — the for-profit business sharing their compound, owned and operated by two Liberians, Gladys Freeman and Cecil Wilson — to ensure that once those trees were planted, the market would already exist to absorb and distribute the output. This results in donations leading to industry that can sustain on a secondary market -- with roughly $150,000 in coconut oil value generated in just the first few years, with over 3,000 trees in the ground and the Sass Town processing facility producing approximately 5,360 litres of cold-pressed oil. This is the beauty of self-perpetuating programs. And, it also protects against downside, where, if Kent can’t raise a dollar next year, Liberia already has thousands of coconut trees that will bear fruit and generate positive social impact for years to come, so there is very little downside.</p><p>Beekeeping is the most astounding example. Liberia had zero commercial beekeepers in 2011. Today, it has close to 5,000. </p><p>Initial donations to UOF funded the start of a beekeeping industry, paying for training and initial equipment giveaways. From there, in a program Wilson and UOF designed, an elegant solution for growth has taken root to expand the reach of the initial program. First, beekeepers teach community members to grow hives on unused property, paying landowners a 10-15% fee share based on honey sold. Then, community members use that cash for household goods, or save up to purchase equipment and join the industry themselves. UOF’s ongoing role supports equipment grants, extension workers to implement new trainings, and presence at the annual conference. Liberia Pure acts as the natural buyer for local honey, packaging it to be resold in stores. Everything now runs on its own momentum. This is two-sided philanthropy that, once started, creates a market of buyers and sellers for raw goods that keeps spinning long after the original donation is spent.</p><p>I was lucky enough to go beekeeping while in Monrovia — an early morning, sweating under the sun with Etta, a woman with 26 hives on her property about 45 minutes from the city. </p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!QLYi!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!QLYi!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 424w, https://substackcdn.com/image/fetch/$s_!QLYi!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 848w, https://substackcdn.com/image/fetch/$s_!QLYi!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 1272w, https://substackcdn.com/image/fetch/$s_!QLYi!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!QLYi!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png" width="1308" height="881" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!QLYi!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 424w, https://substackcdn.com/image/fetch/$s_!QLYi!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 848w, https://substackcdn.com/image/fetch/$s_!QLYi!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 1272w, https://substackcdn.com/image/fetch/$s_!QLYi!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F391b4abd-0d39-431f-9300-9727c9a957e7_1308x881.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!RSjn!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!RSjn!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 424w, https://substackcdn.com/image/fetch/$s_!RSjn!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 848w, https://substackcdn.com/image/fetch/$s_!RSjn!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 1272w, https://substackcdn.com/image/fetch/$s_!RSjn!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!RSjn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png" width="1308" height="988" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!RSjn!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 424w, https://substackcdn.com/image/fetch/$s_!RSjn!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 848w, https://substackcdn.com/image/fetch/$s_!RSjn!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 1272w, https://substackcdn.com/image/fetch/$s_!RSjn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0391365a-e03b-4cda-a594-46c86489a063_1308x988.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>One bee sting later and one experience I will never forget (the sound of hundreds of bees prancing and dancing just centimeters away from your face through a thinly-laid veil of mesh is quite the wake-up call), I can say Etta has quite an interesting side hustle She produces 10-20 tins a year of honey, each holding five gallons, sold on the open market to buyers like Liberia Pure for roughly $18 a gallon. </p><p>In a country where the average income is under $1,500 a year, Etta’s beekeeping brings in up to $2,100 in good production years.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!RJ7I!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!RJ7I!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 424w, https://substackcdn.com/image/fetch/$s_!RJ7I!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 848w, https://substackcdn.com/image/fetch/$s_!RJ7I!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 1272w, https://substackcdn.com/image/fetch/$s_!RJ7I!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!RJ7I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png" width="1342" height="680" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!RJ7I!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 424w, https://substackcdn.com/image/fetch/$s_!RJ7I!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 848w, https://substackcdn.com/image/fetch/$s_!RJ7I!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 1272w, https://substackcdn.com/image/fetch/$s_!RJ7I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb1ea317d-9e01-40ad-9e11-a41b59463062_1342x680.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>The more I spent time in Monrovia, the more I kept seeing flywheels everywhere. For instance, on the drive back from beekeeping, Abu pulled over at his second tea shop — cement on the sides, tin on the roof, roughly 30x50 feet, busy at 11am, run by his mother (who cannot read but can certainly handle the money) alongside two young boys from the neighborhood. He had funded it through a UOF small business loan, and was using a second loan to build a three-unit rental property nearby. A drive at UOF, two tea shops, and an up and coming rental shop -- it seems I had not been a very good question asker during my initial rid from the airport. (Another Abu sidenote: earlier that morning, he had noticed women selling mango drink packs for 850 Liberian dollars and knew the going rate was 1,000. He bought every pack on the road. Arbitrage at every opportunity.)</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!LP7C!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!LP7C!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 424w, https://substackcdn.com/image/fetch/$s_!LP7C!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 848w, https://substackcdn.com/image/fetch/$s_!LP7C!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 1272w, https://substackcdn.com/image/fetch/$s_!LP7C!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!LP7C!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png" width="988" height="1038" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!LP7C!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 424w, https://substackcdn.com/image/fetch/$s_!LP7C!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 848w, https://substackcdn.com/image/fetch/$s_!LP7C!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 1272w, https://substackcdn.com/image/fetch/$s_!LP7C!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F919c5483-2793-4098-a028-7cf4d4af6e22_988x1038.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>The small loans program is itself a two-sided flywheel. First, UOF runs an educational course (designed and operated thorugh donations) for small business owners covering best practices, accounting, and general management. Second, graduates can access $500-$3,000 loans at monthly rates undercutting local banks — which price loans at 20% or higher and require KYC documentation that many entrepreneurs simply can’t clear in Liberia. This is another example of UOF implementing programs, ventures, that are two sided in nature: training and in practice -- with many success stories already bearing fruit.</p><p>For instance, one story that stuck in my mind is that of Mercy Benson who, through a small loan, moved her clothing store from a market stall to a standalone unit, wherein monthly income went from $500 to $800 USD (60% increase). Another story is Eric Vaye, who went through the business development program and learned the power of receipt issuance compared to mutual trust and memory. He has since increased his recorded profits and opened a second stall. The small loans program, when tied to practical business education, have proven to be simple, yet effective kickstarters for local businesses.</p><p>This type of program-building pattern has been repeated many times across UOF’s 20-year history.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!T5MI!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!T5MI!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 424w, https://substackcdn.com/image/fetch/$s_!T5MI!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 848w, https://substackcdn.com/image/fetch/$s_!T5MI!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 1272w, https://substackcdn.com/image/fetch/$s_!T5MI!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!T5MI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png" width="1440" height="700" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!T5MI!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 424w, https://substackcdn.com/image/fetch/$s_!T5MI!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 848w, https://substackcdn.com/image/fetch/$s_!T5MI!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 1272w, https://substackcdn.com/image/fetch/$s_!T5MI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F76ae3ab7-de6e-4054-b5d1-9f65d71b8cb4_1440x700.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Start with an idea. Build a program around it. Source a market. Find donors. Implement education. Support industry. This is the UOF flywheel that has worked across industries.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!f7Rx!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!f7Rx!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 424w, https://substackcdn.com/image/fetch/$s_!f7Rx!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 848w, https://substackcdn.com/image/fetch/$s_!f7Rx!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 1272w, https://substackcdn.com/image/fetch/$s_!f7Rx!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!f7Rx!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png" width="1324" height="1650" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!f7Rx!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 424w, https://substackcdn.com/image/fetch/$s_!f7Rx!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 848w, https://substackcdn.com/image/fetch/$s_!f7Rx!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 1272w, https://substackcdn.com/image/fetch/$s_!f7Rx!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb4ebfb49-c0ca-4a08-8f79-445143703e81_1324x1650.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><h2><strong>A Nonprofit With Zero Admin Costs: The 100% Guarantee</strong></h2><p>Philanthropy has always felt static to me. Passive, one-time: donate $50, feed a kid for a year. And from what I’ve read as a tech person and heard along the grapevine, nonprofits are ripe with bureaucratic red tape and inefficiencies — a lot of funds going to the administration of money rather than the distribution of social impact. This gives me roughly the same ickiness as growing up watching church donations disappear into a pastor’s wife’s new Escalade. A chance of hell is far more appealing than donating to, potentially, a younger wife on better wheels for the local baptist leader...</p><p>Spending a week with Landis and Kent changed my mind. The first and most structural reason: Universal Outreach has what they call the 100% Guarantee.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!xYYX!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!xYYX!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 424w, https://substackcdn.com/image/fetch/$s_!xYYX!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 848w, https://substackcdn.com/image/fetch/$s_!xYYX!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 1272w, https://substackcdn.com/image/fetch/$s_!xYYX!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!xYYX!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png" width="1346" height="620" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!xYYX!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 424w, https://substackcdn.com/image/fetch/$s_!xYYX!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 848w, https://substackcdn.com/image/fetch/$s_!xYYX!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 1272w, https://substackcdn.com/image/fetch/$s_!xYYX!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff630b3a8-0abd-4f56-855a-9e00fd6bad78_1346x620.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>They’re also building an endowment fund — with Kent Sr. involved — designed to pay operating costs through interest in forever, securing the foundation against bureaucratic creep long-term. Kent Sr. made his living in real estate and timeshares in the 80s and 90s and has invested deeply in the organization. He funds the dream and built the rocket ship. Other donations are extra fuel, enabling the rocket to be pushed into orbit as far as Kent and Landis can get it. Kent Jr. calls them a “lean and mean machine” and while I chuckle every time he says it with a straight face, it is not incorrect.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!p2Ji!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!p2Ji!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 424w, https://substackcdn.com/image/fetch/$s_!p2Ji!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 848w, https://substackcdn.com/image/fetch/$s_!p2Ji!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 1272w, https://substackcdn.com/image/fetch/$s_!p2Ji!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!p2Ji!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png" width="1336" height="720" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!p2Ji!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 424w, https://substackcdn.com/image/fetch/$s_!p2Ji!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 848w, https://substackcdn.com/image/fetch/$s_!p2Ji!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 1272w, https://substackcdn.com/image/fetch/$s_!p2Ji!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F185830a1-4395-43d8-a559-b61e8b4e2f07_1336x720.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>From the standpoint of someone who has spent six years in venture-backed companies where capital is religion and burn rate can lead to hell, this structure is extraordinary -- especially given that you can go look up their budget on the CRA website and check the claim for yourself.</p><h2><strong>Loving Life Is the Best Foundation for Making Change</strong></h2><p>Kent and Landis have just imprinted their love for life onto an organization. Kent always wanted to beekeep, so he turned a want into an industry — transforming a coincidence of personal interest and market opportunity into something that now self-perpetuates. He and Landis love surfing, so they went and scaffolded surf tourism infrastructure in Robertsport. Adventure junkies, the both of them, with a shared love for deep conversation, for giving back, for finding the next thing. On our last Saturday, Kent invited Emma and me to a guided meditation session he was hosting for about ten Liberians. It was, we later found out, his very first course, and we were the guinea pigs. One hour, a beginner’s guide to stillness, from a mid-50s Canadian man running a multi-program nonprofit in West Africa. It is a reminder that certain types of people always find more hours in the day to do more than you would think possible. Kent and Landis both are those types of people.</p><p>Landis, her hair streaked with small flecks of silver in a perpetual state of beach wave, a smile that sparks a conversation with optimism, and a bit of a stern streak that comes from 18 years of running an org as lean as possible from an accounting perspective, is a college dropout who has held the titles of baker, accountant, head of communications, aesthetician, and business owner. It is so funny to hear the self-deprecating Canadian look at you with a straight face and ask sincere questions about all the silly little things you’ve done in your little corporate career — whilst she and Kent have literally spent 18 years building up multiple industries inside one of the poorest countries in the world and seeing crazy, tangible benefits. They have forgotten more about what they’ve accomplished than what I’ve done in my career.</p><p>They are far more natural in Liberia than anywhere else. In Canada, in pitch mode where I met them, they are good. In Liberia, cooking for guests, hosting dinner conversation every night, running the org, spending hours in the company of the people they have built programs alongside for nearly two decades — they are completely themselves. Such good-hearted people. That is not a small thing. The reason UOF works is not only the 100% Guarantee or the flywheel model. It is that Kent and Landis have embedded their actual selves into every program, every long-shot bet, every industry they have tried to start.</p><p>On the last day of the trip, Emma, Kent, Landis, and I drove four hours down pothole-riddled roads to a beach town called Robertsport. Named after Joseph Jenkins Roberts — Liberia’s first president — and lined with concrete homes built on stilts with Alabama-esque plantation specs (jarring). But gorgeous, gorgeous, gorgeous. The beach is pristine, the waves are crashing, and it is slowly becoming a surfing hub, drawing people from across Europe, the Ivory Coast, and Liberia to an annual competition every May.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!nSSi!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!nSSi!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 424w, https://substackcdn.com/image/fetch/$s_!nSSi!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 848w, https://substackcdn.com/image/fetch/$s_!nSSi!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 1272w, https://substackcdn.com/image/fetch/$s_!nSSi!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!nSSi!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png" width="1308" height="881" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!nSSi!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 424w, https://substackcdn.com/image/fetch/$s_!nSSi!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 848w, https://substackcdn.com/image/fetch/$s_!nSSi!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 1272w, https://substackcdn.com/image/fetch/$s_!nSSi!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbccca7aa-f5a0-4f7a-9954-3615dafc7ac4_1308x881.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>Kent described it as being “10 years from being 10 years away from primetime” as we walked past a long stretch of beachfront land just purchased by a Ivorian developer. When he first arrived in 2003, he would grab a hammock at the local UN headquarters, or just camp. He and Landis have been coming here for nearly two decades. What they saw was a place that was filled with opportunity if it had the right support on a long time horizon.</p><p>UOF has invested in the town through Robertsport Beach Bar and Restaurant and the Robertsport Surf Club — a community hub that acts as a watering hole for ISA certified surf instructors, a local surf therapy program, the international surf competition, and travellers passing through — scholarships for surf program participants, and Philip’s Guesthouse, a three-room property about 75 meters from the water front through a UOF small business loan that Philip paid back even after COVID hit.<a href="https://kram.bio/liberia#fn2" target="_blank" rel="noopener noreferrer"><sup>2</sup></a></p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!XWNA!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!XWNA!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 424w, https://substackcdn.com/image/fetch/$s_!XWNA!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 848w, https://substackcdn.com/image/fetch/$s_!XWNA!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 1272w, https://substackcdn.com/image/fetch/$s_!XWNA!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!XWNA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png" width="1308" height="988" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!XWNA!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 424w, https://substackcdn.com/image/fetch/$s_!XWNA!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 848w, https://substackcdn.com/image/fetch/$s_!XWNA!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 1272w, https://substackcdn.com/image/fetch/$s_!XWNA!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe5db4c1c-3340-44f7-b3e6-3b711df92a98_1308x988.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>The surfing community has grown from roughly 60 surfers in 2013 to over 200 by 2022, with locals having won competitions across the Ivory Coast and Senegal.<a href="https://kram.bio/liberia#fn3" target="_blank" rel="noopener noreferrer"><sup>3</sup></a> The flywheel logic here is the same, stretched over a longer timeline. Kent and Landis invest in youth education and some surf tourism infrastructure. Tourism picks up. Others follow suit. The kids receive scholarships. Local businesses grow from the foot traffic. Repeat. Looking forward, two things need to happen for Robertsport to fully pay off: the road from Monrovia gets paved, cutting four hours of pothole whackamole to a two-hour smooth ride, and more tourism infrastructure gets built by operators beyond UOF. At that point the flywheel runs without them.</p><p>They are building something they know will outlast them, in a town they fell in love with before anyone else was paying attention.</p><h2><strong>Liberia Is Primed for Growth — After Years of Civil War and Ebola</strong></h2><p>On our first day, Kent and Landis sent Emma and me to Monrovia’s national museum, which covers Liberia’s history: its founding by African American expatriates around 1847, the civil wars of the early 1990s through the early 2000s, Ebola. The museum was visceral. The cars of Prince Yormie Johnson and President Doe sat on the floor — big, beastly vehicles, the cars of men who cleared the streets in front of their motorcades or else. The Ebola section was roughly twice the size of the civil war section despite the death toll being ten times smaller. 250,000 dead in war. 15,000 dead by disease. I had never heard of the Liberian civil war before walking in — I was shocked to learn it was multiples more deadly than Ebola.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!BcbN!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!BcbN!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 424w, https://substackcdn.com/image/fetch/$s_!BcbN!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 848w, https://substackcdn.com/image/fetch/$s_!BcbN!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 1272w, https://substackcdn.com/image/fetch/$s_!BcbN!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!BcbN!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png" width="988" height="1308" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!BcbN!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 424w, https://substackcdn.com/image/fetch/$s_!BcbN!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 848w, https://substackcdn.com/image/fetch/$s_!BcbN!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 1272w, https://substackcdn.com/image/fetch/$s_!BcbN!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F310a073c-186a-48cc-93cc-423e2f590442_988x1308.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>This piece would be incomplete without saying that Liberia is not all coconut oil and pristine surf. Kent and Landis carry a quiet, considered realism about the structural damage left behind by two generations shaped by civil war. You feel the residue in daily life. UOF feels it in their organization, in the stories and experiences that accumulate over 18 years in a hard country.</p><p>Kent and Landis trace most of this back to the war, which was rectified thanks to the strength of the women of Liberia — a sit-in in 2003 that ended the second civil war and put the country back on track.<a href="https://kram.bio/liberia#fn4" target="_blank" rel="noopener noreferrer"><sup>4</sup></a> But the war caused two lasting problems: peace came without major accountability, which was followed by a decade of a slow post-war government that has been quicker to invest in itself than in its people.</p><p>Knowing all of this makes UOF’s staffing model all the more fascinating. UOF has between 15-20 full-time employees at all times, every single one of them Liberian, with Kent and Landis the only exceptions. No ex-pats and, interestingly, Kent does not hire Liberians who have worked at other NGOs in the past — they are too used to corruption, to skimming off the top. He would rather train someone from scratch than inherit bad habits. This results in the people of the country being in charge of creating the infrastructure for mini-flywheels, which means the lessons learned by will stick with people who are going to be in Liberia long after Kent and Landis have moved on. Another example of UOF doing the hard thing for the better outcome.</p><p>Today, the numbers on Liberia are stark. GDP per capita sitting at roughly $681 per person per year.<a href="https://kram.bio/liberia#fn5" target="_blank" rel="noopener noreferrer"><sup>5</sup></a> But Kent loves to remind you that the stat is vastly improved from the inglorious number-two spot 18 years ago when he arrived.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!WfH5!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!WfH5!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 424w, https://substackcdn.com/image/fetch/$s_!WfH5!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 848w, https://substackcdn.com/image/fetch/$s_!WfH5!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 1272w, https://substackcdn.com/image/fetch/$s_!WfH5!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!WfH5!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png" width="1390" height="620" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!WfH5!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 424w, https://substackcdn.com/image/fetch/$s_!WfH5!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 848w, https://substackcdn.com/image/fetch/$s_!WfH5!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 1272w, https://substackcdn.com/image/fetch/$s_!WfH5!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F827c7606-79f1-4a7b-aa9d-bc4e2eb410c8_1390x620.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>In 2026, optimism is visible on the ground. Everywhere you walk, there is construction going up — shacks turning into sheds, empty lots turning into mechanic shops, markets for fruit, new malls with electricity and wifi, shawarma shops where the food is ready and hot. The experience I had was clean stores, great service, humorous bartering, and, when you dig into the people behind a transaction or an experience, a deep yearning for a better life through hard work.</p><p>And then there is the internet. In Liberia, it is not coming just through fiber optics. It is coming from the stars.</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!kICh!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!kICh!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 424w, https://substackcdn.com/image/fetch/$s_!kICh!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 848w, https://substackcdn.com/image/fetch/$s_!kICh!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!kICh!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!kICh!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png" width="988" height="1024" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!kICh!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 424w, https://substackcdn.com/image/fetch/$s_!kICh!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 848w, https://substackcdn.com/image/fetch/$s_!kICh!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 1272w, https://substackcdn.com/image/fetch/$s_!kICh!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F03e4c959-069e-42f6-9c92-a4342c63a12f_988x1024.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>I saw Starlink everywhere on the trip — from the café at Annie’s in Robertsport, to a car passing by on a Monrovia street with a Starlink pad taped to a pole in the truck bed, to UOF operations, to spots all across the city. Emma and I used it our entire trip with zero issues, running on a travel monitor that fit in my carry-on bag. Starlink launched in Liberia in 2025 and as of early that year had approximately 336,000 subscribers across 19 African markets — growing fast enough that it sold out capacity in major Nigerian cities within months of launch.<a href="https://kram.bio/liberia#fn10" target="_blank" rel="noopener noreferrer"><sup>10</sup></a> Internet penetration across the continent still sits below 40% of the population, but, based on what I saw, will accelerate in a short period of time thorugh satellites (not fiber optic).</p><div class="captioned-image-container"><figure><a class="image-link image2 is-viewable-img" href="https://substackcdn.com/image/fetch/$s_!pqj-!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png" target="_blank" rel="noopener noreferrer"><div class="image2-inset"><picture><source type="image/webp" srcset="https://substackcdn.com/image/fetch/$s_!pqj-!,w_424,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 424w, https://substackcdn.com/image/fetch/$s_!pqj-!,w_848,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 848w, https://substackcdn.com/image/fetch/$s_!pqj-!,w_1272,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 1272w, https://substackcdn.com/image/fetch/$s_!pqj-!,w_1456,c_limit,f_webp,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 1456w" sizes="100vw"><img src="https://substackcdn.com/image/fetch/$s_!pqj-!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png" width="1338" height="720" class="sizing-normal" alt="" srcset="https://substackcdn.com/image/fetch/$s_!pqj-!,w_424,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 424w, https://substackcdn.com/image/fetch/$s_!pqj-!,w_848,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 848w, https://substackcdn.com/image/fetch/$s_!pqj-!,w_1272,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 1272w, https://substackcdn.com/image/fetch/$s_!pqj-!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21283e23-e5be-4dc5-81c3-ddce4d2a05bb_1338x720.png 1456w" sizes="100vw" loading="lazy" decoding="async"></source></picture></div></a></figure></div><p>The money situation is similar to the internet situation, in that there is obvious room for vast improvement. Though, unlike with Starlink, there seems to be a vacuum for a digital leader in money. For instance, there are no exchanges offering swaps from Liberian dollars to USDT — which is crazy to me, because the ENTIRE economy runs on cash. I could not use a card anywhere I shopped, despite it seeming like a large portion of population having a cell phone. Many businesses still didn’t give me a receipt. Remittances are priced in USD, with exchange rates written on chalkboards — actual chalkboards — at rates somewhere between 175:1 and 200:1 depending on your vendor. Smart contracts, a Liberian dollar stablecoin, and merchant infrastructure that can be enacted from a mobile device are ripe to take over, but still so far away.</p><p>Then, lastly, to end on a physical opportunity, there is coffee -- the latest program Kent and Gladys Freeman have spun up, raising donations to build up Liberia’s native Liberica bean (which is scoring 80/100 in early cupping tests) in Liberia’s first cofree roastery. A roastery that brings specialty coffee to a city currently dominated by Nescafe while simultaneously building an export channel is the goal. Kent calls it a purple cow type of opportunity -- and I think he is right, especially with Germany and Switzerland, close neighbors and major buyers of organic goods, as obvious export markets. Kent has a fundraising target of $30,000-48,000 CAD to make it happen. And that of course doesn’t even come close to being the last of the opportunities, which Kent lists off as dried fruit, sunglasses built from recycled plastic, vegan cosmetics from coconut oil, Starlink cafes for mobile workers. Everywhere he looks in Liberia, Kent see ideas for business. Africa is rich in materials and goods and its exporting business is ripe to grow and UOF is ready to continue driving innovation through programs.</p><h2><strong>Bet on the Founders. Donate Your Time. Do Both.</strong></h2><p>The big thing I’m taking away is how investing deeply in small change can end up making big waves and will likely have a massive impact long-term, even beyond a lifetime. When I think of Kent and Landis and Africa, I think of a 50-year time horizon. I think of the Liberian team working out of the Monrovia compound. I think of the small town of Robertsport and the idea of Liberia’s first coffee roastery and a fledgling coconut oil industry and a network of beehives and wells that service 20,000 people and scholarships that have taken close to 2,500 kids through school and a small loan program that has put capital into the hands of close to 200 entrepreneurs who have started businesses employing over 9,000 people. Each one is a small thing, a micro thing, that maybe doesn’t have a massive, massive impact on its own. But in terms of getting dominoes rolling, of playing the long game with good people across many ideas, what UOF is doing is fascinating.</p><p><em>Many small bets, placed early, with the patience to let compounding do the work. Not a venture fund. Venture Donations.</em></p><p>I think of UOF as accepting and placing Venture Donations: many small bets that have the potential to pay off long-term if the correct network effects hit and others join in on investing in a vertical — with that vertical likely being Africa. And I think this is going to happen. It is inevitable, even if slow. As an optimist, one just has to bet that Africa is going to accelerate at some point. As the powers that be start hitting birth rate and other demographic issues, Africa is set up as a land-rich, people-rich, culturally rich landmass. What Kent and Landis are doing is incredible in that they are laying the groundwork for what success looks like, perhaps putting Liberia far ahead of other spots through their programs and training, without the overhead of a typical NGO.</p><p>Kent and Landis are the founders here. They have been in market for 18 years. They have product-market fit across seven programs. They have a 98% loan repayment rate, a 96% high school graduation rate, and zero overhead. If that were a Series A pitch, it would be oversubscribed, haha. These are good people doing hard things for little pay, just because they love life and adventure and making the world a better place for more people. The best mental model I can find: they have somehow taken social impact principles, embedded them with capitalist operating models, and created an accelerator for private business and a venture fund for ideas to improve the economy and education platform of Liberia — through a nonprofit that has almost no overhead because it was founded by someone with a heart big enough to cover all admin fees.</p><p>I cannot think of a more exciting setup to donate to. And I cannot think of a more interesting place than Liberia right now.</p><p>The idea of donating to a nonprofit as a young person has always felt burdensome. I am young, I am in my earning phase. A donation of money feels incredibly costly, even when it objectively isn’t. But I have a ton of time I can spare, and the idea of giving away my time and skill is not that scary. Funny enough, this only clicked after I showed up in Africa and Kent explained it to me. I had envisioned the trip as a vacation that involved some work. He reframed it: I was donating time by showing up. I had been unknowingly doing the thing the whole time. Emma and I were literally able to create 60 unique post templates across five channels, a content calendar, and a working Claude setup in just under four days of six-hour working windows. I bet, when I look back at this trip in a few years, this type of donation will have helped me just as much as I helped UOF.</p><p>I would challenge all my friends and my generation to donate a few days or a week to a nonprofit this year. And more importantly, donate your time AND skills. We are an internet-native, AI-forward generation. The tools we have built our careers on can do extraordinary things for organizations like UOF in very little time.</p><div><hr></div><p>For more info on UOF, DM me or check out their <a href="https://www.universaloutreachfoundation.org/" target="_blank" rel="noopener noreferrer">website</a>. </p><p>- Kram</p><p>Crossposted on my website <a href="https://kram.bio/liberia" target="_blank" rel="noopener noreferrer">here</a> (for better reading experience). </p><p><a href="https://kramnotmark.substack.com/p/two-weeks-in-liberia-venture-donations">Originally published on Substack</a></p></article></noscript>
